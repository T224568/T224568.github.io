    /* Stats Grid */
    .stats-grid {
      display: grid;

      border-radius: var(--radius-md);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-glass);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-accent);
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      background: rgba(255, 255, 255, 0.05);

    .stat-label {
      font-size: 0.8rem;

      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;

    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Controls Bar */
    .controls-panel {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-glass);
    }

    .search-row {
      display: flex;
      gap: 12px;

      min-width: 280px;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 1.1rem;
    }

    .search-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .search-hint {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .control-selects {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .select-box {
      background: rgba(11, 15, 25, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: #fff;
      padding: 12px 16px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      font-family: inherit;

      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;

      color: var(--accent-cyan);
      font-weight: 600;

      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--cat-color, var(--accent-cyan));
      opacity: 0.8;

      transform: translateY(-3px);
      border-color: var(--border-accent);
      background: var(--bg-card-hover);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);

      border-radius: var(--radius-sm);

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn {

      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;

      background: var(--accent-cyan);
      color: #0b0f19;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      border-color: var(--border-subtle);
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Table / List View */
    .list-view {
      display: none;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow-x: auto;
      box-shadow: var(--shadow-glass);

    table {

      text-align: left;
      font-size: 0.88rem;
    }

    thead tr {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);

      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.15s;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    td {
      padding: 12px 18px;
      color: var(--text-main);
      vertical-align: middle;
    }

    .tbl-title {
      font-weight: 600;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tbl-path {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .tbl-actions {
      display: flex;
      gap: 6px;

      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tbl-btn:hover {
      background: var(--accent-cyan);
      color: #0b0f19;
      border-color: var(--accent-cyan);

      padding: 12px 20px;
      border-radius: var(--radius-md);

      font-size: 0.9rem;
      z-index: 1000;
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>

    let activeCategory = '全部';
    let currentSearch = '';
    let currentSort = 'mtime_desc';
    let currentView = 'grid';

    function init() {
      renderPills();
      bindEvents();
      renderContent();
    }

    function getFilteredItems() {
      return items.filter(item => {
        const matchesCat = (activeCategory === '全部') || (item.category === activeCategory);
        if (!matchesCat) return false;
        if (!currentSearch) return true;
        const q = currentSearch.toLowerCase();
        return item.title.toLowerCase().includes(q) ||
               item.filename.toLowerCase().includes(q) ||
               item.rel.toLowerCase().includes(q) ||
               item.category.toLowerCase().includes(q);
      }).sort((a, b) => {
        if (currentSort === 'mtime_desc') return b.mtime.localeCompare(a.mtime);
        if (currentSort === 'mtime_asc') return a.mtime.localeCompare(b.mtime);
        if (currentSort === 'title_asc') return a.title.localeCompare(b.title, 'zh-Hant');
        if (currentSort === 'size_desc') return b.size_bytes - a.size_bytes;
        if (currentSort === 'size_asc') return a.size_bytes - b.size_bytes;
        return 0;
      });
    }

    function renderPills() {
      const catCounts = { '全部': items.length };
      items.forEach(it => {
        catCounts[it.category] = (catCounts[it.category] || 0) + 1;
      });

      const pillsBar = document.getElementById('pillsBar');
      pillsBar.innerHTML = Object.keys(catCounts).map(cat => {
        const isActive = cat === activeCategory ? 'active' : '';
        return `
          <div class="pill ${isActive}" onclick="setCategory('${cat}')">
            <span>${cat}</span>
            <span class="pill-count">${catCounts[cat]}</span>
          </div>
        `;
      }).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderPills();
      renderContent();
    }

    function setViewMode(mode) {
      currentView = mode;
      document.getElementById('btnGrid').classList.toggle('active', mode === 'grid');
      document.getElementById('btnList').classList.toggle('active', mode === 'list');
      document.getElementById('gridView').style.display = mode === 'grid' ? 'grid' : 'none';
      document.getElementById('listView').style.display = mode === 'list' ? 'block' : 'none';
      renderContent();
    }

    function renderContent() {
      const list = getFilteredItems();
      const gridView = document.getElementById('gridView');
      const tableBody = document.getElementById('tableBody');

      if (list.length === 0) {
        const emptyHtml = `
          <div class="empty-state">
            <div class="empty-icon">🍃</div>
            <div style="font-size: 1.1rem; color: #cbd5e1; margin-bottom: 6px;">找不到相符的 HTML 檔案</div>
            <div style="font-size: 0.85rem; color: var(--text-dim);">請嘗試縮小關鍵字或重設分類篩選</div>
          </div>
        `;
        if (currentView === 'grid') {
          gridView.innerHTML = emptyHtml;
        } else {
          tableBody.innerHTML = `<tr><td colspan="6">${emptyHtml}</td></tr>`;
        }
        return;
      }

      if (currentView === 'grid') {
        gridView.innerHTML = list.map(item => {
          return `
            <div class="card" style="--cat-color: ${item.color}">
              <div>
                <div class="card-top">
                  <div class="card-icon">${item.icon}</div>
                  <div class="card-title-box">
                    <span class="card-category-tag">${escapeHtml(item.category)}</span>
                    <div class="card-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div>
                    <div class="card-filename">${escapeHtml(item.rel)}</div>
                  </div>
                </div>
              </div>

              <div>
                <div class="card-meta">
                  <span>📦 ${item.size_str}</span>
                  <span>🕒 ${item.mtime}</span>
                </div>
                <div class="card-actions" style="margin-top: 12px;">
                  <a href="${item.file_url}" target="_blank" class="btn btn-open">
                    <span>開啟檔案</span> ↗
                  </a>
                  <button onclick="copyToClipboard('${escapeJs(item.full_path)}', '已複製本地絕對路徑')" class="btn btn-copy" title="複製本地路徑">
                    <span>路徑</span> 📋
                  </button>
                  <button onclick="copyToClipboard('${escapeJs(item.file_url)}', '已複製 file:// 連結')" class="btn btn-copy" title="複製 file:// 連結">
                    <span>URL</span> 🔗
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } else {
        tableBody.innerHTML = list.map(item => {
          return `
            <tr>
              <td style="font-size: 1.3rem;">${item.icon}</td>
              <td>
                <div class="tbl-title">${escapeHtml(item.title)}</div>
                <div class="tbl-path">${escapeHtml(item.rel)}</div>
              </td>
              <td>
                <span class="card-category-tag" style="--cat-color: ${item.color}">${escapeHtml(item.category)}</span>
              </td>
              <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-muted);">${item.size_str}</td>
              <td style="font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--text-muted);">${item.mtime}</td>
              <td>
                <div class="tbl-actions" style="justify-content: flex-end;">
                  <a href="${item.file_url}" target="_blank" class="tbl-btn" style="color: var(--accent-cyan);">開啟 ↗</a>
                  <button onclick="copyToClipboard('${escapeJs(item.full_path)}', '已複製路徑')" class="tbl-btn">路徑 📋</button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      }
    }

    function bindEvents() {
      const searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.trim();
        renderContent();
      });

      document.getElementById('sortSelect').addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderContent();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
        if (e.key === 'Escape' && document.activeElement === searchInput) {
          searchInput.value = '';
          currentSearch = '';
          searchInput.blur();
          renderContent();
        }
      });
    }

    function copyToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(msg || '已成功複製至剪貼簿！');
      }).catch(() => {
        showToast('複製失敗');
      });
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    window.onload = init;
  </script>
