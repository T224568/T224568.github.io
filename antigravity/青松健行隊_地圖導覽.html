        <div class="custom-popup">
          <span class="popup-badge" style="background:${route.color}">${route.tag}</span>
          <div class="popup-title">${wp.name}</div>
          <div class="popup-desc">${wp.desc}</div>
        </div>
      `);
      detailGroup.addLayer(wpMarker);
    });

    detailLayers[route.id] = detailGroup;
  });

  function renderRouteCards(filteredRoutes) {
    const listEl = document.getElementById('routeList');
    listEl.innerHTML = '';

    filteredRoutes.forEach(route => {
      const card = document.createElement('div');
      card.className = `route-card ${currentActiveId === route.id ? 'active' : ''}`;
      card.id = `card-${route.id}`;
      card.style.setProperty('--theme-color', route.color);

      let waypointsHtml = route.waypoints.map(w => `
        <div class="waypoint-item" onclick="flyToPoint(${w.lat}, ${w.lng}, '${w.name}', event)">
          <div class="waypoint-dot"></div>
          <div class="waypoint-info">
            <strong>${w.name}</strong>
            <p>${w.desc}</p>
          </div>
        </div>
      `).join('');

      card.innerHTML = `
        <div class="card-top">
          <span class="card-tag" style="background:${route.color}">${route.num}. ${route.tag}</span>
          <span class="card-dist">${route.dist}</span>
        </div>
        <div class="card-title">${route.name}</div>
        <div class="card-transit">🚆 ${route.transit}</div>
        <div class="card-desc">${route.desc}</div>
        <div class="card-actions">
          <button class="btn-card highlight" onclick="selectRoute('${route.id}', true, event)">🎯 查看全線</button>
          <button class="btn-card" onclick="toggleWaypoints('${route.id}', event)">📍 沿途節點 (${route.waypoints.length})</button>
        </div>
        <div class="waypoints-list" id="wpts-${route.id}">
          ${waypointsHtml}
        </div>
      `;

      card.onclick = () => selectRoute(route.id, true);
      listEl.appendChild(card);
    });
  }

  function selectRoute(id, zoomTo = true, event = null) {
    if (event) event.stopPropagation();
    currentActiveId = id;

    document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
    const targetCard = document.getElementById(`card-${id}`);
    if (targetCard) {
      targetCard.classList.add('active');
      targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    routesData.forEach(r => {
      const pl = polylines[r.id];
      const halo = polylineHalos[r.id];
      const sm = startMarkers[r.id];
      const dl = detailLayers[r.id];

      if (r.id === id) {
        pl.setStyle({ weight: 9, opacity: 1.0 });
        halo.setStyle({ weight: 14, opacity: 0.95 });
        pl.bringToFront();
        sm.setOpacity(1.0);
        if (!map.hasLayer(dl)) map.addLayer(dl);
      } else {
        pl.setStyle({ weight: 4, opacity: 0.3 });
        halo.setStyle({ weight: 6, opacity: 0.3 });
        sm.setOpacity(0.4);
        if (map.hasLayer(dl)) map.removeLayer(dl);
      }
    });

    if (zoomTo && polylines[id]) {
      map.fitBounds(polylines[id].getBounds(), { padding: [50, 50], maxZoom: 15 });
    }
  }

  function toggleWaypoints(id, event) {
    if (event) event.stopPropagation();
    const wptsEl = document.getElementById(`wpts-${id}`);
    if (wptsEl) {
      wptsEl.classList.toggle('open');
    }
  }

  function flyToPoint(lat, lng, title, event) {
    if (event) event.stopPropagation();
    map.flyTo([lat, lng], 16, { duration: 1.2 });
  }

  function filterRoutes(group, btn) {
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    let filtered = routesData;
    if (group !== 'all') {
      filtered = routesData.filter(r => r.group === group);
    }
    renderRouteCards(filtered);

    routesData.forEach(r => {
      const pl = polylines[r.id];
      const halo = polylineHalos[r.id];
      const sm = startMarkers[r.id];
      const dl = detailLayers[r.id];

      if (group === 'all' || r.group === group) {
        if (!map.hasLayer(halo)) map.addLayer(halo);
        if (!map.hasLayer(pl)) map.addLayer(pl);
        if (!map.hasLayer(sm)) map.addLayer(sm);
        pl.setStyle({ weight: 6, opacity: 0.95 });
        halo.setStyle({ weight: 9, opacity: 0.9 });
        sm.setOpacity(1.0);
      } else {
        if (map.hasLayer(halo)) map.removeLayer(halo);
        if (map.hasLayer(pl)) map.removeLayer(pl);
        if (map.hasLayer(sm)) map.removeLayer(sm);
        if (map.hasLayer(dl)) map.removeLayer(dl);
      }
    });

    if (group === 'all') {
      fitAllRoutes();
    } else if (filtered.length > 0) {
      const groupBounds = L.featureGroup(filtered.map(r => polylines[r.id])).getBounds();
      map.fitBounds(groupBounds, { padding: [60, 60] });
    }
  }

  function handleSearch() {
    const val = document.getElementById('routeSearch').value.toLowerCase().trim();
    const filtered = routesData.filter(r => 
      r.name.toLowerCase().includes(val) ||
      r.desc.toLowerCase().includes(val) ||
      r.transit.toLowerCase().includes(val) ||
      r.highlight.toLowerCase().includes(val) ||
      r.waypoints.some(w => w.name.toLowerCase().includes(val) || w.desc.toLowerCase().includes(val))
    );
    renderRouteCards(filtered);
  }

  function fitAllRoutes() {
    currentActiveId = null;
    document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
    routesData.forEach(r => {
      if (!map.hasLayer(polylineHalos[r.id])) map.addLayer(polylineHalos[r.id]);
      if (!map.hasLayer(polylines[r.id])) map.addLayer(polylines[r.id]);
      if (!map.hasLayer(startMarkers[r.id])) map.addLayer(startMarkers[r.id]);
      if (map.hasLayer(detailLayers[r.id])) map.removeLayer(detailLayers[r.id]);
      polylines[r.id].setStyle({ weight: 6, opacity: 0.95 });
      polylineHalos[r.id].setStyle({ weight: 9, opacity: 0.9 });
      startMarkers[r.id].setOpacity(1.0);
    });
    const allBounds = L.featureGroup(Object.values(polylines)).getBounds();
    map.fitBounds(allBounds, { padding: [60, 60] });
  }

  function locateUser() {
    if (!navigator.geolocation) {
      alert("您的瀏覽器不支援 GPS 定位");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        const userIcon = L.divIcon({
          className: 'user-pin',
          html: `<div style="background:#2563eb;color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;border:3px solid #fff;box-shadow:0 0 12px rgba(37,99,235,0.8);animation:pulse 1.5s infinite;">📍</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        L.marker([latitude, longitude], { icon: userIcon }).addTo(map).bindPopup("<b>您目前的位置</b>").openPopup();
        map.flyTo([latitude, longitude], 15);
      },
      err => {
        alert("無法獲取目前位置，請確認定位權限。");
      }
    );
  }

  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const btn = document.getElementById('btnToggleSidebar');
    sb.classList.toggle('collapsed');
    if (sb.classList.contains('collapsed')) {
      btn.innerText = '📋 路線清單';
    } else {
      btn.innerText = '🗺️ 大地圖模式';
    }
    setTimeout(() => map.invalidateSize(), 300);
  }

  renderRouteCards(routesData);
  fitAllRoutes();
</script>
</body>
</html>
