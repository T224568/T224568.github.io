atGPT 提示詞工程的核心概念、技巧及實用指令框架。\n> 2. 強調透過清晰定義目標、善用範例與連貫思考來提升 AI 回應品質。\n> 3. 提供數據安全警示與優化指令語法，助使用者更高效精準地與 AI 協作。\n>\n> **🎯 行動清單 (Action Items)**\n> - [ ] **優化提示詞結構**：在撰寫 Prompt 時，明確定義目標、上下文與輸出格式，並移除冗贅的禮貌用語。\n> - [ ] **採用進階引導技術**：針對複雜問題，主動運用「少樣本 (Few-shot)」或「思維鏈 (Chain of Thought)」技術引導 AI 拆解步驟。\n> - [ ] **建立安全防護意識**：務必篩選並移除任何敏感或隱私數據，避免將機密資訊傳輸至 AI 系統。\n> - [ ] **導入迭代優化機制**：建立提示詞迭代習慣，透過調整參數、增加關鍵字或簡化指令來持續優化輸出結果。\n> - [ ] **運用角色扮演設定**：針對特定情境需求，套用「角色+視覺描述+個性+行為規範」的指令框架，精準獲取所需的專業觀點。\n\n---\n\n\n![image](https://prod-files-secu"}, {"note_name": "2025-11-18 超實用ai工具", "title": "超實用ai工具", "source": "Notion Import", "created": "2025-11-18", "desc": "# 超實用ai工具 > 匯入日期：2026-07-12 > [!abstract] AI 內容摘要 > 1. 精選 14 款涵蓋文書處理、影音剪輯與創意生成的實用 AI 工具。 > 2. 協助使用者優化工作流程，透過自動化工具顯著提升生產力。 > 3. 涵蓋從文字改寫、簡報製作到", "cat": "🎨 Nano Banana 與 AI 生圖創作", "obs_uri": "obsidian://open?vault=secondbrain&file=Clippings/2025-11-18%20%E8%B6%85%E5%AF%A6%E7%94%A8ai%E5%B7%A5%E5%85%B7", "body_preview": "# 超實用ai工具\n\n> 匯入日期：2026-07-12\n\n> [!abstract] AI 內容摘要\n> 1. 精選 14 款涵蓋文書處理、影音剪輯與創意生成的實用 AI 工具。\n> 2. 協助使用者優化工作流程，透過自動化工具顯著提升生產力。\n> 3. 涵蓋從文字改寫、簡報製作到視覺修圖的全方位應用場景。\n>\n> **🎯 行動清單 (Action Items)**\n> - [ ] 根據目前工作需求，從清單中挑選 3 款最能解決痛點的工具進行實測。\n> - [ ] 將此 14 款工具整理至個人知識庫或瀏覽器書籤，並分門別類標記用途。\n> - [ ] 訂定一週測試計畫，實際應用這些工具替代原本耗時的重複性任務。\n> - [ ] 持續觀察這些 AI 工具的更新動態，確保工作流程始終保持最高效率。\n\n---\n\n\n今天送你 14 個我私藏、超實用的 AI 工具清單，從工作、剪片、寫文案到做簡報，全都能幫你省下好幾小時。\n\n🔥 14 個一定要收藏的 AI 工具（每天都用得到）\n\n1. [ChatGPT.com](http://chatgpt.com/) — 你有問題，它就有答案\n1. [PDFgear.com](http://pdfgear.com/) — PDF 想編輯、想轉檔，一鍵搞定\n1. [Syllab.io](http://syllab.io/) — 不會剪片也能做出 AI 影片"}, {"note_name": "2025-11-15 Fotor GoArt- Turn Your Photos into Stunning A", "title": "Fotor GoArt: Turn Your Photos into Stunning Artworks with Hundreds of Photo Effects", "source": "Notion Import", "created": "2025-11-15", "desc": "# Fotor GoArt: Turn Your Photos into Stunning Artworks with Hundreds of Photo Effects > 匯入日期：2026-07-12 > [!abstract] AI 內容摘要 > 1. Fotor GoA", "cat": "🎨 Nano Banana 與 AI 生圖創作", "obs_uri": "obsidian://open?vault=secondbrain&file=Clippings/2025-11-15%20Fotor%20GoArt-%20Turn%20Your%20Photos%20into%20Stunning%20A", "body_preview": "# Fotor GoArt: Turn Your Photos into Stunning Artworks with Hundreds of Photo Effects\n\n> 匯入日期：2026-07-12\n\n> [!abstract] AI 內容摘要\n> 1. Fotor GoArt 提供豐富的 AI 圖像特效，能將照片轉化為素描、水彩、漫畫及藝術風格作品。\n> 2. 平台具備多樣化的風格分類與預設濾鏡，支援多種常見圖片格式的快速轉換與處理。\n> 3. 使用者透過簡單的上傳流程，即可將一般照片創作成具有藝術感的視覺素材。\n>\n> **🎯 行動清單 (Action Items)**\n> - [ ] 瀏覽 Fotor GoArt 風格分類，挑選 3 種符合個人品牌或社群內容需求的藝術濾鏡。\n> - [ ] 準備 5 張不同場景的照片，並上傳測試其在「動漫」與「藝術流派」分類下的轉換效果。\n> - [ ] 將最滿意的藝術化圖片儲存至「My Library」，建立個人專屬的 AI 風格素材庫。\n> - [ ] 評估並確認個人訂閱方案的權限，以解鎖包含 PRO 在內的所有特效工具。\n\n---\n\n\nTools\n\nCtrl+K\n\nHome\n\nAI Photo\n\nAI Video\n\nAI Design\n\nNEW\n\nAgent Sisi\n\nCommunity\n\nMy Library\n\nAI Ar"}, {"note_name": "2025-11-10 AIEnhancer 工具套件", "title": "AIEnhancer 工具套件", "source": "Notion Import", "created": "2025-11-10", "desc": "# AIEnhancer 工具套件 > 匯入日期：2026-07-12 > [!abstract] AI 內容摘要 > 1. AIEnhancer 是一套全方位 AI 影像處理工具，涵蓋修復、高清化與背景處理功能。 > 2. 核心功能支援將靜態照片一鍵轉換為逼真的動漫或素描風格藝", "cat": "🎨 Nano Banana 與 AI 生圖創作", "obs_uri": "obsidian://open?vault=secondbrain&file=Clippings/2025-11-10%20AIEnhancer%20%E5%B7%A5%E5%85%B7%E5%A5%97%E4%BB%B6", "body_preview": "# AIEnhancer 工具套件\n\n> 匯入日期：2026-07-12\n\n> [!abstract] AI 內容摘要\n> 1. AIEnhancer 是一套全方位 AI 影像處理工具，涵蓋修復、高清化與背景處理功能。\n> 2. 核心功能支援將靜態照片一鍵轉換為逼真的動漫或素描風格藝術創作。\n> 3. 該平台提供免費、快速且隱私安全的線上處理服務，適用於設計與個人應用。\n>\n> **🎯 行動清單 (Action Items)**\n> - [ ] 整理需要修復的舊照片或低解析度圖像，並使用高清轉換功能進行升級。\n> - [ ] 嘗試使用「照片轉素描」功能製作獨特的社交媒體頭像或數位藝術作品。\n> - [ ] 利用背景移除與物件清理工具，優化商業設計或產品展示圖片。\n> - [ ] 測試影像去模糊功能，改善拍攝不佳的照片細節品質。\n\n---\n\n\n## 🛠️ AIEnhancer 工具套件\n\n* **照片修復**：修復老舊或破損照片，去除斑點、刮痕，恢復褪色影像。\n* **去模糊 / 銳化**：改善手抖或模糊照片，讓細節更清晰。\n* **高清轉換器**：將低解析度圖片升級到 HD 或 4K。\n* **背景移除**：快速去除或替換照片背景。\n* **Logo 背景移除**：專業去除 Logo 背景。\n* **浮水印移除**：刪除圖片上的文字或浮水印。\n* **圖片清理 / 物件移除**：去"}, {"note_name": "2025-11-06 Text to Video Prompts", "title": "Text to Video Prompts", "source": "Notion Import", "created": "2025-11-06", "desc": "# Text to Video Prompts > 匯入日期：2026-07-12 > [!abstract] AI 內容摘要 > 1. 本文彙整了 AI 文字轉影片（T2V）的關鍵資源，涵蓋大規模資料集與寫作指南。 > 2. 利用 VidProM 資料集可分析長提示詞結構，透過", "cat": "🎬 AI 影音、音樂與多媒體實作", "obs_uri": "obsidian://open?vault=secondbrain&file=Clippings/2025-11-06%20Text%20to%20Video%20Prompts", "body_preview": "# Text to Video Prompts\n\n> 匯入日期：2026-07-12\n\n> [!abstract] AI 內容摘要\n> 1. 本文彙整了 AI 文字轉影片（T2V）的關鍵資源，涵蓋大規模資料集與寫作指南。\n> 2. 利用 VidProM 資料集可分析長提示詞結構，透過 Alibaba Cloud 指南學習撰寫技巧。\n> 3. 針對不同需求，可彈性選擇專業資料、結構化框架或快速套用的行銷範例。\n>\n> **🎯 行動清單 (Action Items)**\n> - [ ] 前往 Hugging Face 下載 VidProM 資料集，用於分析高品質影片的長提示詞結構。\n> - [ ] 閱讀 Alibaba Cloud 提示指南，將「實體、環境、動作、鏡頭語言」納入個人的提示詞模板。\n> - [ ] 建立一個專屬的 T2V 提示詞庫，收集並分類常用的風格、運鏡與氛圍關鍵字。\n> - [ ] 挑選「50 AI Text-to-Video Prompts」中的範例進行實作測試，並根據生成結果優化描述。\n\n---\n\n\n## ✅ 推薦資源與範例\n\n1. VidProM：首個大規模 T2V 提示詞資料集，涵蓋約 1.67 百萬條用戶提出的提示詞，配合約 6.69 百萬條由擴散模型生成的影片。[arXiv+2arXiv+2](https://arxiv.org/abs/2403.060"}, {"note_name": "2025-11-05 Build Apps With Google AI Studio Full AI Codi", "title": "Build Apps With Google AI Studio 💡 Full AI Coding Tutorial - YouTube", "source": "Notion Import", "created": "2025-11-05", "desc": "# Build Apps With Google AI Studio 💡 Full AI Coding Tutorial - YouTube > 匯入日期：2026-07-12 > [!abstract] AI 內容摘要 > 1. 本教學介紹利用 Google AI Studio", "cat": "🎬 AI 影音、音樂與多媒體實作", "obs_uri": "obsidian://open?vault=secondbrain&file=Clippings/2025-11-05%20Build%20Apps%20With%20Google%20AI%20Studio%20Full%20AI%20Codi", "body_preview": "# Build Apps With Google AI Studio 💡 Full AI Coding Tutorial - YouTube\n\n> 匯入日期：2026-07-12\n\n> [!abstract] AI 內容摘要\n> 1. 本教學介紹利用 Google AI Studio 快速構建 AI 應用程式的完整流程。\n> 2. 強調透過 API 整合與模型調用，簡化開發者部署 AI 功能的複雜度。\n> 3. 指導如何將 AI 模型嵌入現有軟體開發架構，實現高效的程式自動化。\n>\n> **🎯 行動清單 (Action Items)**\n> - [ ] 註冊並登入 Google AI Studio 獲取 API Key。\n> - [ ] 在 AI Studio 介面中測試並微調 Prompt 以符合特定專案需求。\n> - [ ] 將生成的 API 連結整合至現有的應用程式開發環境中。\n> - [ ] 設定 API 使用限額與監控機制，確保應用運作的穩定性。\n\n---"}, {"note_name": "2025-11-05 Mapify- AI 心智圖摘要器", "title": "Mapify: AI 心智圖摘要器", "source": "Notion Import", "created": "2025-11-05", "desc": "# Mapify: AI 心智圖摘要器 > 匯入日期：2026-07-12 > [!abstract] AI 內容摘要 > 1. Mapify 是整合 AI 的心智圖工具，能將 YouTube、PDF 與文件瞬間轉化為結構化圖表。 > 2. 透過階層化的內容呈現，有效提升學習理解", "cat": "🎬 AI 影音、音樂與多媒體實作", "obs_uri": "obsidian://open?vault=secondbrain&file=Clippings/2025-11-05%20Mapify-%20AI%20%E5%BF%83%E6%99%BA%E5%9C%96%E6%91%98%E8%A6%81%E5%99%A8", "body_preview": "# Mapify: AI 心智圖摘要器\n\n> 匯入日期：2026-07-12\n\n> [!abstract] AI 內容摘要\n> 1. Mapify 是整合 AI 的心智圖工具，能將 YouTube、PDF 與文件瞬間轉化為結構化圖表。\n> 2. 透過階層化的內容呈現，有效提升學習理解力、資訊整理效率與簡報準備速度。\n> 3. 支援互動式擴充與編輯，協助使用者快速從海量資訊中萃取核心重點並產生靈感。\n>\n> **🎯 行動清單 (Action Items)**\n> - [ ] 前往 Mapify 官網註冊帳號，並連結常用文件或影片來源進行首次測試。\n> - [ ] 上傳一份複雜的 PDF 報告或教材，利用 AI 生成心智圖並驗證資訊歸納的精確度。\n> - [ ] 嘗試使用心智圖的「編輯與擴充」功能，針對特定節點延伸更多觀點以優化學習筆記。\n> - [ ] 利用「一鍵簡報模式」整理一項待辦專案，將複雜資訊轉化為易於展示的簡報架構。\n\n---\n\n\n在幾秒鐘內將 YouTube、PDF 文件/文檔、URL、播客和會議記錄摘要轉換為心智圖。由 GPT、Gemini 或其他頂尖大型語言模型提供支持。\n\n[免費開始使用](https://mapify.so/tc/signin)\n\n![image](https://assets.chatmind.tech/prod_mapify/_images/h"}, {"note_name": "2025-11-05 Obsidian教學｜Obsidian是什麼 跟Notion差在哪 如何用它生成 知識網路", "title": "Obsidian教學｜Obsidian是什麼？跟Notion差在哪？如何用它生成「知識網路」筆記？|數位時代 BusinessNext", "source": "Notion Import", "created": "2025-11-05", "desc": "# Obsidian教學｜Obsidian是什麼？跟Notion差在哪？如何用它生成「知識網路」筆記？|數位時代 BusinessNext > 匯入日期：2026-07-12 > [!abstract] AI 內容摘要 > 1. Obsidian 透過 Markdown 純文字檔", "cat": "💻 GitHub 開源工具與 AI Agent 開發", "obs_uri": "obsidian://open?vault=secondbrain&file=Clippings/2025-11-05%20Obsidian%E6%95%99%E5%AD%B8%EF%BD%9CObsidian%E6%98%AF%E4%BB%80%E9%BA%BC%20%E8%B7%9FNotion%E5%B7%AE%E5%9C%A8%E5%93%AA%20%E5%A6%82%E4%BD%95%E7%94%A8%E5%AE%83%E7%94%9F%E6%88%90%20%E7%9F%A5%E8%AD%98%E7%B6%B2%E8%B7%AF", "body_preview": "# Obsidian教學｜Obsidian是什麼？跟Notion差在哪？如何用它生成「知識網路」筆記？|數位時代 BusinessNext\n\n> 匯入日期：2026-07-12\n\n> [!abstract] AI 內容摘要\n> 1. Obsidian 透過 Markdown 純文字檔案儲存，確保資料自主權並支援長期離線編輯。\n> 2. 運用雙向連結與關聯圖功能，將碎片化筆記轉化為具備神經網絡結構的知識庫。\n> 3. 對比 Notion 的協作與雲端特性，Obsidian 更適合個人知識管理、離線創作與隱私保護。\n>\n> let currentCat = "ALL";

function init() {
  const cats = ["ALL", ...new Set(ITEMS.map(x => x.cat))];
  const pillsEl = document.getElementById("catPills");
  pillsEl.innerHTML = cats.map(c => {
    const cnt = c === "ALL" ? ITEMS.length : ITEMS.filter(x => x.cat === c).length;
    const label = c === "ALL" ? `🌟 全部剪藏 (${cnt})` : `${c} (${cnt})`;
    return `<button class="pill ${c === 'ALL' ? 'active' : ''}" data-cat="${c}">${label}</button>`;
  }).join("");

  pillsEl.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      pillsEl.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentCat = btn.getAttribute("data-cat");
      render();
    });
  });

  document.getElementById("searchInput").addEventListener("input", render);
  render();
}

function render() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const filtered = ITEMS.filter(it => {
    if (currentCat !== "ALL" && it.cat !== currentCat) return false;
    if (!q) return true;
    return (it.title + " " + it.note_name + " " + it.desc + " " + it.cat).toLowerCase().includes(q);
  });

  document.getElementById("countInfo").textContent = `顯示 ${filtered.length} / ${ITEMS.length} 篇剪藏筆記`;

  const grid = document.getElementById("cardsGrid");
  grid.innerHTML = filtered.map(it => `
    <div class="card">
      <div>
        <div class="card-meta">
          <span class="badge">${it.cat}</span>
          <span>📅 ${it.created}</span>
        </div>
        <h3 class="card-title">${it.note_name}</h3>
        <div class="card-desc">${it.desc || '（點擊下方按鈕於 Obsidian 開啟完整內容）'}</div>
      </div>
      <div class="card-actions">
        <a class="btn btn-obs" href="${it.obs_uri}">💎 在 Obsidian 開啟</a>
        ${it.source ? `<a class="btn btn-src" href="${it.source}" target="_blank" rel="noopener">🔗 原始網頁</a>` : ''}
      </div>
    </div>
  `).join("");
}

init();
</script>
