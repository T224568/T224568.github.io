<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Download Books for Free | 免費電子書跨站下載入口</title>
  <style>
    :root {
      --bg-light: #f8fafc;
      --bg-dark: #0b0f19;
      --surface-light: #ffffff;
      --surface-dark: #131b2e;
      --surface-hover-light: #f1f5f9;
      --surface-hover-dark: #1e293b;
      --border-light: #e2e8f0;
      --border-dark: #1e293b;
      --text-main-light: #0f172a;
      --text-main-dark: #f8fafc;
      --text-muted-light: #64748b;
      --text-muted-dark: #94a3b8;
      --brand-light: #d97706;
      --brand-dark: #fbbf24;
      --brand-bg-light: #fef3c7;
      --brand-bg-dark: rgba(251, 191, 36, 0.14);
      --accent-blue-light: #2563eb;
      --accent-blue-dark: #60a5fa;

      --bg: var(--bg-light);
      --surface: var(--surface-light);
      --surface-hover: var(--surface-hover-light);
      --border: var(--border-light);
      --text-main: var(--text-main-light);
      --text-muted: var(--text-muted-light);
      --brand: var(--brand-light);
      --brand-bg: var(--brand-bg-light);
      --accent-blue: var(--accent-blue-light);

      @media (prefers-color-scheme: dark) {
        --bg: var(--bg-dark);
        --surface: var(--surface-dark);
        --surface-hover: var(--surface-hover-dark);
        --border: var(--border-dark);
        --text-main: var(--text-main-dark);
        --text-muted: var(--text-muted-dark);
        --brand: var(--brand-dark);
        --brand-bg: var(--brand-bg-dark);
        --accent-blue: var(--accent-blue-dark);
      }

      @supports (color: light-dark(white, black)) {
        --bg: light-dark(var(--bg-light), var(--bg-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --surface-hover: light-dark(var(--surface-hover-light), var(--surface-hover-dark));
        --border: light-dark(var(--border-light), var(--border-dark));
        --text-main: light-dark(var(--text-main-light), var(--text-main-dark));
        --text-muted: light-dark(var(--text-muted-light), var(--text-muted-dark));
        --brand: light-dark(var(--brand-light), var(--brand-dark));
        --brand-bg: light-dark(var(--brand-bg-light), var(--brand-bg-dark));
        --accent-blue: light-dark(var(--accent-blue-light), var(--accent-blue-dark));
      }

      color-scheme: light dark;
      accent-color: var(--brand);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      padding: 2rem 1.25rem 4rem;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: var(--brand-bg);
      color: var(--brand);
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 0.85rem;
      letter-spacing: 0.03em;
    }

    h1 {
      font-size: clamp(1.85rem, 4vw, 2.75rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    h1 span {
      color: var(--brand);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Search Hub */
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.12);
    }

    .search-form {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .search-input-wrap {
      flex: 1 1 280px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    #bookQuery {
      width: 100%;
      padding: 0.9rem 2.6rem 0.9rem 2.75rem;
      font-size: 1.05rem;
      border: 1.5px solid var(--border);
      border-radius: 0.85rem;
      background: var(--bg);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #bookQuery:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-bg);
    }

    .clear-btn {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.25rem;
      display: none;
    }

    .clear-btn.visible {
      display: block;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      padding: 0.85rem 1.25rem;
      border-radius: 0.85rem;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: transform 0.15s, background-color 0.2s, opacity 0.2s;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--brand);
      color: #0b0f19;
    }

    .btn-secondary {
      background: var(--surface-hover);
      color: var(--text-main);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--brand);
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .tag-chip {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.15s;
    }

    .tag-chip:hover {
      border-color: var(--brand);
      color: var(--brand);
    }

    /* Filter Bar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tab-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 0.95rem;
      border-radius: 0.65rem;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active,
    .tab-btn:hover {
      background: var(--brand-bg);
      color: var(--brand);
      border-color: var(--brand);
    }

    .toolbar-actions {
      display: flex;
      gap: 0.6rem;
    }

    /* Grid Cards */
    .sites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .site-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.1rem;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .site-card:hover {
      transform: translateY(-3px);
      border-color: var(--brand);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.18);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .site-identity {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .site-icon {
      width: 44px;
      height: 44px;
      border-radius: 0.75rem;
      background: var(--brand-bg);
      color: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .site-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .site-url {
      font-size: 0.84rem;
      color: var(--accent-blue);
      text-decoration: none;
      word-break: break-all;
    }

    .site-url:hover {
      text-decoration: underline;
    }

    .number-badge {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      padding: 0.2rem 0.55rem;
      border-radius: 0.5rem;
    }

    .site-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .meta-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .meta-pill {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 0.45rem;
      background: var(--surface-hover);
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .meta-pill.format {
      color: var(--brand);
      border-color: var(--brand-bg);
      background: var(--brand-bg);
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .card-btn {
      padding: 0.55rem 0.75rem;
      border-radius: 0.65rem;
      font-size: 0.86rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-hover);
      color: var(--text-main);
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .card-btn:hover {
      border-color: var(--brand);
    }

    .card-btn.primary {
      background: var(--brand);
      color: #0b0f19;
      border-color: transparent;
      font-weight: 700;
    }

    .card-btn.primary:hover {
      opacity: 0.92;
    }

    /* Reference Table & Original Image Section */
    .bottom-panel {
      margin-top: 2.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    .panel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      padding: 1.35rem;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .raw-list {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.85;
      overflow-x: auto;
      user-select: all;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--text-main);
      color: var(--bg);
      padding: 0.75rem 1.2rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.25s;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 640px) {
      .search-form {
        flex-direction: column;
      }
      .btn-group {
        width: 100%;
      }
      .btn-group .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge-top">📚 7 大免費電子書與 PDF 資源庫</div>
      <h1>Download <span>Books</span> for Free</h1>
      <p class="subtitle">輸入書名、作者或關鍵字，一鍵跨站搜尋或直達各大免費電子書平台下載（支援 EPUB / PDF / Kindle）。</p>
    </header>

    <!-- 跨站搜尋中樞 -->
    <section class="search-box" aria-label="跨站電子書搜尋">

        <div class="btn-group">
          <button type="submit" class="btn btn-primary" title="對下方篩選出的網站同步更新搜尋連結">
            ⚡ 套用關鍵字至全站按鈕
          </button>
          <button type="button" id="openTop3Btn" class="btn btn-secondary" title="一次開啟前 3 大熱門站的搜尋結果">
            🚀 一次搜前 3 站
          </button>
        </div>
      </form>
      <div class="quick-tags">
        <span>熱門試搜：</span>
        <button type="button" class="tag-chip" data-q="Psychology of Money">Psychology of Money</button>
        <button type="button" class="tag-chip" data-q="Pride and Prejudice">Pride and Prejudice</button>
        <button type="button" class="tag-chip" data-q="Machine Learning">Machine Learning</button>
        <button type="button" class="tag-chip" data-q="The Little Prince">The Little Prince</button>
        <button type="button" class="tag-chip" data-q="Rich Dad Poor Dad">Rich Dad Poor Dad</button>
      </div>
    </section>

    <!-- 篩選與工具列 -->
    <div class="toolbar">
      <div class="filter-tabs" role="tablist" aria-label="格式與分類篩選">
        <button type="button" class="tab-btn active" data-filter="all">全部網站 (7)</button>
        <button type="button" class="tab-btn" data-filter="pdf">📄 主打 PDF (3)</button>
        <button type="button" class="tab-btn" data-filter="epub">📱 EPUB / Kindle (4)</button>
        <button type="button" class="tab-btn" data-filter="no-login">⚡ 免註冊直下 (5)</button>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="copyAllBtn" class="tab-btn">📋 複製全部網址</button>
        <button type="button" id="downloadBookmarksBtn" class="tab-btn">🔖 下載瀏覽器書籤 (.html)</button>
      </div>
    </div>

    <!-- 7 大網站卡片區 -->
    <main id="sitesGrid" class="sites-grid"></main>

    <!-- 原始清單快速複製區 -->
    <section class="bottom-panel">
      <div class="panel-card">
        <div class="panel-title">
          <span>🔗 圖片原始 7 大網址清單（點擊即可全選複製）</span>
          <button type="button" id="copyRawBtn" class="tab-btn">複製純文字清單</button>
        </div>
        <pre id="rawList" class="raw-list">https://manybooks.net
https://pdfdrive.com
https://pdfcoffee.com
https://pdfroom.com
https://gutenberg.org
https://openlibrary.org
https://standardebooks.org</pre>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const BOOK_SITES = [
      {
        id: 1,
        name: "ManyBooks",
        url: "https://manybooks.net",
        searchUrl: (q) => `https://manybooks.net/search-book?search=${encodeURIComponent(q)}`,
        icon: "📘",
        formats: ["EPUB", "PDF", "MOBI", "線上讀"],
        tags: ["epub"],
        desc: "收錄超過 50,000 本免費電子書，介面現代化，分類齊全（小說、科幻、商業、經典文學），支援多種閱讀器格式。",
        loginNote: "部分格式需免費登入"
      },
      {
        id: 2,
        name: "PDF Drive",
        url: "https://pdfdrive.com",
        searchUrl: (q) => `https://www.pdfdrive.com/search?q=${encodeURIComponent(q)}`,
        icon: "📕",
        formats: ["PDF", "EPUB", "MOBI"],
        tags: ["pdf", "no-login"],
        desc: "全球最大免費 PDF 搜尋引擎之一，收錄逾 7,500 萬份 PDF 書籍、教材、學術論文與雜誌，免註冊、無下載次數限制。",
        loginNote: "免註冊直接下載"
      },
      {
        id: 3,
        name: "PDFCoffee",
        url: "https://pdfcoffee.com",
        searchUrl: (q) => `https://pdfcoffee.com/search.html?q=${encodeURIComponent(q)}`,
        icon: "☕",
        formats: ["PDF", "DOCX"],
        tags: ["pdf", "no-login"],
        desc: "由社群分享驅動的 PDF 文件與電子書資料庫，經常能找到冷門原文教科書、技術手冊、研究報告與講義。",
        loginNote: "免註冊直接下載"
      },
      {
        id: 4,
        name: "PDF Room",
        url: "https://pdfroom.com",
        searchUrl: (q) => `https://pdfroom.com/books?q=${encodeURIComponent(q)}`,
        icon: "🏛️",
        formats: ["PDF"],
        tags: ["pdf", "no-login"],
        desc: "專注於高畫質 PDF 書籍、漫畫與學術讀物的清爽型搜尋網站，版面乾淨無干擾，提供一鍵預覽與高速下載。",
        loginNote: "免註冊直接下載"
      },
      {
        id: 5,
        name: "Project Gutenberg",
        url: "https://gutenberg.org",
        searchUrl: (q) => `https://www.gutenberg.org/ebooks/search/?query=${encodeURIComponent(q)}`,
        icon: "📜",
        formats: ["EPUB", "Kindle", "HTML", "TXT"],
        tags: ["epub", "no-login"],
        desc: "全球歷史最悠久的數位圖書館（古騰堡計畫），擁有 70,000+ 本公有領域世界名著，完全合法、免註冊、零廣告。",
        loginNote: "免註冊直接下載"
      },
      {
        id: 6,
        name: "Open Library",
        url: "https://openlibrary.org",
        searchUrl: (q) => `https://openlibrary.org/search?q=${encodeURIComponent(q)}`,
        icon: "🌐",
        formats: ["PDF", "EPUB", "線上借閱"],
        tags: ["epub"],
        desc: "由網際網路檔案館 (Internet Archive) 營運的開放圖書館，收錄數百萬冊現代與經典圖書，支援公版書直下與現代書免費借閱。",
        loginNote: "公版直下 / 現代書免費借閱"
      },
      {
        id: 7,
        name: "Standard Ebooks",
        url: "https://standardebooks.org",
        searchUrl: (q) => `https://standardebooks.org/ebooks?query=${encodeURIComponent(q)}`,
        icon: "✨",
        formats: ["EPUB", "AZW3", "Kepub", "進階EPUB"],
        tags: ["epub", "no-login"],
        desc: "針對公有領域經典名著進行「精品級重新排版與校對」，附帶高質感封面與完美字體排版，堪稱 Kindle / Kobo 閱讀體驗天花板。",
        loginNote: "免註冊直接下載"
      }
    ];

    const sitesGrid = document.getElementById("sitesGrid");
    const bookQueryInput = document.getElementById("bookQuery");
    const clearBtn = document.getElementById("clearBtn");
    const searchForm = document.getElementById("searchForm");
    const openTop3Btn = document.getElementById("openTop3Btn");
    const toastEl = document.getElementById("toast");

    let currentFilter = "all";

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => {
        toastEl.classList.remove("show");
      }, 2400);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[m]));
    }

    function renderSites() {
      const query = bookQueryInput.value.trim();
      clearBtn.classList.toggle("visible", query.length > 0);

      const filtered = BOOK_SITES.filter((site) => {
        if (currentFilter === "all") return true;
        return site.tags.includes(currentFilter);
      });

      sitesGrid.innerHTML = filtered.map((site) => {
        const targetSearchUrl = query ? site.searchUrl(query) : site.url;
        const primaryLabel = query
          ? `🔍 搜「${escapeHtml(query.length > 12 ? query.slice(0, 12) + "…" : query)}」`
          : "🚀 前往網站下載";

        return `
          <article class="site-card">
            <div>
              <div class="card-top">
                <div class="site-identity">
                  <div class="site-icon" aria-hidden="true">${site.icon}</div>
                  <div>
                    <h2 class="site-title">${escapeHtml(site.name)}</h2>
                    <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="site-url">${site.url}</a>
                  </div>
                </div>
                <span class="number-badge">#0${site.id}</span>
              </div>
              <p class="site-desc" style="margin: 0.85rem 0;">${escapeHtml(site.desc)}</p>
              <div class="meta-badges">
                ${site.formats.map((f) => `<span class="meta-pill format">${escapeHtml(f)}</span>`).join("")}
                <span class="meta-pill">${escapeHtml(site.loginNote)}</span>
              </div>
            </div>

            <div class="card-actions">
              <a href="${targetSearchUrl}" target="_blank" rel="noopener noreferrer" class="card-btn primary">
                ${primaryLabel}
              </a>
              <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="card-btn">
                🏠 首頁
              </a>
              <button type="button" class="card-btn copy-single-btn" data-url="${site.url}" title="複製網址">
                📋
              </button>
            </div>
          </article>
        `;
      }).join("");

      document.querySelectorAll(".copy-single-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const url = btn.getAttribute("data-url");
          navigator.clipboard.writeText(url).then(() => {
            showToast(`已複製：${url}`);
          });
        });
      });
    }

    // IME-safe Enter keydown handling
    let lastCompositionEndAt = null;
    bookQueryInput.addEventListener("compositionend", (event) => {
      lastCompositionEndAt = event.timeStamp;
    });

    bookQueryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        if (event.isComposing || event.keyCode === 229) {
          return;
        }
        if (lastCompositionEndAt !== null && Math.abs(event.timeStamp - lastCompositionEndAt) < 50) {
          return;
        }
        searchForm.requestSubmit();
      }
    });

    bookQueryInput.addEventListener("input", () => {
      renderSites();
    });

    clearBtn.addEventListener("click", () => {
      bookQueryInput.value = "";
      renderSites();
      bookQueryInput.focus();
    });

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      renderSites();
      const q = bookQueryInput.value.trim();
      if (q) {
        showToast(`已將「${q}」套用至所有網站的搜尋按鈕！`);
      } else {
        showToast("請先輸入書名或作者關鍵字");
        bookQueryInput.focus();
      }
    });

    openTop3Btn.addEventListener("click", () => {
      const q = bookQueryInput.value.trim();
      const topSites = [BOOK_SITES[1], BOOK_SITES[0], BOOK_SITES[4]]; // PDF Drive, ManyBooks, Gutenberg
      topSites.forEach((site) => {
        const url = q ? site.searchUrl(q) : site.url;
        window.open(url, "_blank", "noopener,noreferrer");
      });
      showToast(q ? `已開啟前 3 大站搜尋「${q}」` : "已開啟前 3 大電子書網站");
    });

    document.querySelectorAll(".tag-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        bookQueryInput.value = chip.getAttribute("data-q");
        renderSites();
        showToast(`已帶入關鍵字：${bookQueryInput.value}`);
      });
    });

    document.querySelectorAll(".filter-tabs .tab-btn").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".filter-tabs .tab-btn").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.getAttribute("data-filter");
        renderSites();
      });
    });

    function copyAllUrls() {
      const text = BOOK_SITES.map((s) => s.url).join("\n");
      navigator.clipboard.writeText(text).then(() => {
        showToast("已複製全部 7 個電子書網站網址！");
      });
    }

    document.getElementById("copyAllBtn").addEventListener("click", copyAllUrls);
    document.getElementById("copyRawBtn").addEventListener("click", copyAllUrls);

    // 匯出瀏覽器書籤 HTML 檔方便一鍵匯入 Chrome / Edge / Safari
    document.getElementById("downloadBookmarksBtn").addEventListener("click", () => {
      const linksHtml = BOOK_SITES.map(
        (s) => `        <DT><A HREF="${s.url}" ADD_DATE="${Math.floor(Date.now() / 1000)}">${s.name} - ${s.desc.slice(0, 30)}</A>`
      ).join("\n");
      const netscapeBookmark = `<!DOCTYPE NETSCAPE-Bookmark-file-1>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">
<TITLE>Bookmarks</TITLE>
<H1>Bookmarks</H1>
<DL><p>
    <DT><H3 ADD_DATE="${Math.floor(Date.now() / 1000)}">Download Books for Free (7大免費電子書)</H3>
    <DL><p>
${linksHtml}
    </DL><p>
</DL><p>`;

      const blob = new Blob([netscapeBookmark], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "free_ebooks_bookmarks.html";
      a.click();
      URL.revokeObjectURL(a.href);
      showToast("已下載書籤檔 free_ebooks_bookmarks.html！");
    });

    renderSites();
  </script>
</body>
</html>
