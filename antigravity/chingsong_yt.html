<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥾 青松健行隊（輕鬆健行隊）｜YouTube 健行影音典藏館（全 79 部・含影片長度與觀看數）</title>
  <style>
    :root {
      --bg: #0b1310;
      --surface: #13201b;
      --surface-hover: #1a2c25;
      --border: #233b31;
      --text: #f0fdf4;
      --text-muted: #94a3b8;
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.16);
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.15);
      --primary: #38bdf8;
      --primary-soft: rgba(56, 189, 248, 0.15);
      --danger: #f43f5e;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 64px;
    }
    a { color: var(--emerald); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    header {
      background: linear-gradient(135deg, #0d1f18 0%, #142e24 50%, #13232e 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 20px 22px;
    }
    .container {
      max-width: 1360px;
      margin: 0 auto;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .title-group h1 {
      font-size: clamp(1.35rem, 2.4vw, 1.95rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ecfdf5;
    }
    .title-badge {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--emerald-soft);
      border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
      font-weight: 700;
    }
    .title-group p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--emerald);
      text-decoration: none;
    }
    .btn-emerald {
      background: var(--emerald-soft);
      border-color: rgba(16, 185, 129, 0.45);
      color: #34d399;
    }
    .btn-emerald:hover {
      background: rgba(16, 185, 129, 0.28);
      border-color: var(--emerald);
    }
    .btn-accent {
      background: var(--accent-soft);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .btn-accent:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--accent);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: rgba(19, 32, 27, 0.82);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 2px;
      color: var(--text);
    }
    .stat-value.emerald { color: #34d399; }
    .stat-value.accent { color: #fbbf24; }
    .stat-value.primary { color: var(--primary); }

    .toolbar-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(11, 19, 16, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      flex: 1 1 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 36px 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--emerald);
      box-shadow: 0 0 0 3px var(--emerald-soft);
    }
    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
    }
    .controls-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    select {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: var(--emerald); }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .view-toggle button[aria-pressed="true"] {
      background: var(--emerald-soft);
      color: #34d399;
    }

    .chips-section {
      padding: 14px 20px 6px;
    }
    .chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      color: var(--text);
      border-color: var(--emerald);
    }
    .chip[aria-pressed="true"] {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: #34d399;
    }
    .chip-count {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    main {
      padding: 16px 20px;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      content-visibility: auto;
      contain-intrinsic-size: 310px;
    }
    .video-card:hover {
      transform: translateY(-3px);
      border-color: var(--emerald);
      box-shadow: 0 12px 26px -10px rgba(16, 185, 129, 0.25);
    }
    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #070d0a;
      cursor: pointer;
      overflow: hidden;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }
    .video-card:hover .thumb-wrap img {
      transform: scale(1.04);
    }
    .rank-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(11, 19, 16, 0.86);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 800;
      font-size: 0.76rem;
      padding: 3px 9px;
      border-radius: 8px;
    }
    .duration-badge {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(11, 19, 16, 0.9);
      backdrop-filter: blur(4px);
      color: #38bdf8;
      font-weight: 700;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      padding: 3px 9px;
      border-radius: 8px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .views-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(11, 19, 16, 0.88);
      backdrop-filter: blur(4px);
      color: #fbbf24;
      font-weight: 700;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
      padding: 3px 9px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.28);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .thumb-wrap:hover .play-overlay {
      opacity: 1;
    }
    .play-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.94);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }
    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }
    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .card-title:hover { color: #34d399; }
    .card-meta {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .yr-tag {
      background: var(--emerald-soft);
      color: #34d399;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .table-wrap {
      display: none;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #0e1915;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      white-space: nowrap;
    }
    tbody tr {
      content-visibility: auto;
      contain-intrinsic-size: 52px;
    }
    tbody tr:hover {
      background: var(--surface-hover);
    }
    .td-rank {
      font-weight: 800;
      color: var(--text-muted);
      width: 64px;
    }
    .td-views {
      font-weight: 700;
      color: #fbbf24;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .td-dur {
      font-weight: 700;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .td-date {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .is-hidden {
      display: none !important;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      margin-top: 16px;
    }

    dialog#playerDialog {
      margin: auto;
      width: min(94vw, 960px);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.78);
    }
    dialog#playerDialog::backdrop {
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .dialog-header h2 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .dialog-close {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .dialog-close:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    .player-aspect {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      background: #000;
    }
    .player-aspect iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .dialog-footer {
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .dialog-nav-btns {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <p id="reorder-status" role="status" class="visually-hidden"></p>

  <header>
    <div class="container">
      <div class="header-top">
        <div class="title-group">
          <h1 style="flex-wrap:wrap;">
            <span>🥾 青松健行隊｜專屬 YouTube 影音典藏館</span>
            <a class="btn btn-emerald" href="https://youtube.com/playlist?list=PLEkxGUl_9XRYiPqAtV4lxKKKyQ42jD3H6&si=xmZgn6VRmx09inow" target="_blank" rel="noopener" style="margin-left:4px;">
              📺 開啟 YouTube 播放清單（青松YT聯結）
            </a>
          </h1>
          <p>收錄 2024–2026 歷次健行活動紀錄短片・100% 補齊影片長度與實時觀看人數・預設播放音量 15%</p>
        </div>

      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">健行影片總數</div>
          <div class="stat-value emerald" id="statVisibleCount">79 / 79</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累計影片總時長</div>
          <div class="stat-value primary" id="statVisibleDur">8小時 26分</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累計總觀看次數</div>
          <div class="stat-value accent" id="statVisibleViews">4,834</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">最高單部觀看</div>
          <div class="stat-value accent">632 次</div>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar-wrap">
    <div class="container toolbar">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="🔍 搜尋健行路線、步道名稱、日期（如：大湖公園、寶藏巖、農禪寺、三峽、202610）..." aria-label="搜尋健行影片標題或日期" />
        <button type="button" class="clear-btn" id="clearSearchBtn" aria-label="清除搜尋">✕</button>
      </div>
      <div class="controls-group">
        <label for="sortSelect" class="visually-hidden">排序方式</label>
        <select id="sortSelect" aria-label="排序方式">
          <option value="date-desc" selected>📅 健行日期：最新 → 最舊（預設）</option>
          <option value="date-asc">📅 健行日期：最舊 → 最新</option>
          <option value="views-desc">🔥 觀看次數：高 → 低</option>
          <option value="views-asc">觀看次數：低 → 高</option>
          <option value="dur-desc">⏱️ 影片長度：長 → 短</option>
          <option value="dur-asc">⏱️ 影片長度：短 → 長</option>
          <option value="title-asc">🔤 標題名稱：A → Z</option>
        </select>

        <div class="view-toggle" role="group" aria-label="檢視模式切換">
          <button type="button" id="gridViewBtn" aria-pressed="true">🖼️ 卡片檢視</button>
          <button type="button" id="tableViewBtn" aria-pressed="false">📋 表格檢視</button>
        </div>
      </div>
    </div>
  </div>

  <section class="chips-section">
    <div class="container">
      <div class="chips-bar" id="yearChips" role="group" aria-label="年份與類別快速篩選"></div>
    </div>
  </section>

  <main class="container">
    <div class="video-grid" id="videoGrid"></div>

    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th scope="col">編號</th>
            <th scope="col">觀看次數</th>
            <th scope="col">影片長度</th>
            <th scope="col">健行影片標題</th>
            <th scope="col">年份</th>
            <th scope="col">發布日期</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody id="videoTbody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="emptyState">
      <h3>找不到符合條件的健行影片</h3>
      <p style="margin-top:6px;">請嘗試更換路線關鍵字，或點選上方「全部年份」重置篩選。</p>
    </div>
  </main>

  <dialog id="playerDialog" closedby="any" aria-labelledby="dialogVideoTitle">
    <div class="dialog-header">
      <h2 id="dialogVideoTitle">影片播放</h2>
      <form method="dialog">
        <button type="submit" class="dialog-close">✕ 關閉 (Esc)</button>
      </form>
    </div>
    <div class="player-aspect">
      <iframe id="ytIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="YouTube 影片播放器"></iframe>
    </div>
    <div class="dialog-footer">
      <span id="dialogMetaInfo"></span>
      <div class="dialog-nav-btns">
        <button type="button" class="btn" id="prevVidBtn" style="padding:5px 11px;font-size:0.8rem;">⏮ 上一部</button>
        <button type="button" class="btn" id="nextVidBtn" style="padding:5px 11px;font-size:0.8rem;">下一部 ⏭</button>
        <a id="dialogYtLink" href="#" target="_blank" rel="noopener" style="margin-left:6px;">↗ 在 YouTube 開啟</a>
      </div>
    </div>

    function getFilteredAndSorted() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = VIDEOS.filter(v => {
        if (activeYear !== 'ALL' && v.year !== activeYear) return false;
        if (q) {
          const hay = `${v.Title} ${v.UploadDate} ${v.Duration} ${v.year}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const sorted = [...filtered].sort((a, b) => {
        if (currentSort === 'date-desc') return (Number(b.Item) - Number(a.Item)) || (b.UploadDate || '').localeCompare(a.UploadDate || '');
        if (currentSort === 'date-asc') return (Number(a.Item) - Number(b.Item)) || (a.UploadDate || '').localeCompare(b.UploadDate || '');
        if (currentSort === 'views-desc') return (b.viewsNum - a.viewsNum) || (Number(b.Item) - Number(a.Item));
        if (currentSort === 'views-asc') return (a.viewsNum - b.viewsNum) || (Number(b.Item) - Number(a.Item));
        if (currentSort === 'dur-desc') return (b.durSec - a.durSec) || (b.viewsNum - a.viewsNum);
        if (currentSort === 'dur-asc') return (a.durSec - b.durSec) || (b.viewsNum - a.viewsNum);
        if (currentSort === 'title-asc') return a.Title.localeCompare(b.Title, 'zh-Hant');
        return 0;
      });

      return { filtered, sorted };
    }

      for (const v of sorted) {
        sumViews += v.viewsNum;
        sumSec += v.durSec;
      }

      for (const v of VIDEOS) {
        const isVis = visibleSet.has(v.href);
        cardMap.get(v.href).classList.toggle('is-hidden', !isVis);
        rowMap.get(v.href).classList.toggle('is-hidden', !isVis);
      }

      const orderedCards = sorted.map(v => cardMap.get(v.href));
      const orderedRows = sorted.map(v => rowMap.get(v.href));
      reorder(gridEl, orderedCards);
      reorder(tbodyEl, orderedRows);

      statCountEl.textContent = `${sorted.length} / ${VIDEOS.length}`;
      statViewsEl.textContent = sumViews.toLocaleString();
      const hrs = Math.floor(sumSec / 3600);
      const mins = Math.floor((sumSec % 3600) / 60);
      statDurEl.textContent = hrs > 0 ? `${hrs}小時 ${mins}分` : `${mins}分鐘`;
      emptyStateEl.style.display = sorted.length === 0 ? 'block' : 'none';

      if (announceSort) {
        const sortLabel = document.getElementById('sortSelect').selectedOptions[0].textContent;
        statusEl.textContent = `已依 ${sortLabel} 排序，共顯示 ${sorted.length} 部健行影片`;

    function parseDurSec(dStr) {
      if (!dStr) return 0;
      const parts = String(dStr).split(':').map(x => parseInt(x, 10)).filter(n => !isNaN(n));
      if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
      if (parts.length === 2) return parts[0] * 60 + parts[1];
      if (parts.length === 1) return parts[0];
      return 0;
    }

    function normalizeDateStr(val) {
      if (!val) return '';
      const s = String(val);
      if (s.includes('T')) {
        const d = new Date(s);
        if (!isNaN(d.getTime())) {
          // Convert UTC ISO from GAS back to Asia/Taipei YYYY-MM-DD
          const tw = new Date(d.getTime() + 8 * 3600 * 1000);
          return tw.toISOString().slice(0, 10);
        }
      }
      return s.slice(0, 10);
    }

    async function syncLiveFromGoogleSheet() {
      const DOC_URL = 'https://docs.google.com/spreadsheets/d/1xAZ810fin7AY4azNgN-sPr4fuIx0a77ASFOymfvxTXk/edit';
      const GAS_DATA_API = 'https://script.google.com/macros/s/AKfycbwHEV0Wa8IBd9oL4yEoEdg4CSmx1Ry3FVTcgm93TU-89Ns8C_kQD6jqR2EW-2tESgKkEA/exec';
      const url = `${GAS_DATA_API}?sheetUrl=${encodeURIComponent(DOC_URL)}&sheetTag=${encodeURIComponent('青松YT聯結')}`;
      try {
        const res = await fetch(url);
        if (!res.ok) return;
        const rows = await res.json();
        if (!Array.isArray(rows) || rows.length < 2) return;

        const header = rows[0].map(h => String(h || '').trim().toLowerCase());
        const colItem = header.findIndex(h => h === 'item' || h.includes('編號'));
        const colViews = header.findIndex(h => h.includes('view') || h.includes('觀看'));
        const colTitle = header.findIndex(h => h.includes('title') || h.includes('標題'));
        const colHref = header.findIndex(h => h === 'href' || h.includes('url') || h.includes('link'));
        const colDur = header.findIndex(h => h.includes('duration') || h.includes('長度') || h.includes('時長'));
        const colDate = header.findIndex(h => h.includes('date') || h.includes('日期'));

        const fallbackDurMap = new Map(VIDEOS.map(v => [v.vid, v.Duration]));
        const liveVideos = [];

        for (let r = 1; r < rows.length; r++) {
          const row = rows[r];
          if (!Array.isArray(row)) continue;
          const rawHref = colHref !== -1 && row[colHref] ? String(row[colHref]).trim() : '';
          const rawTitle = colTitle !== -1 && row[colTitle] ? String(row[colTitle]).trim() : '';
          const mVid = rawHref.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
          if (!mVid || !rawTitle) continue;
          const vid = mVid[1];
          const href = `https://www.youtube.com/watch?v=${vid}`;
          const vcNum = colViews !== -1 && row[colViews] ? (parseInt(String(row[colViews]).replace(/,/g, ''), 10) || 0) : 0;
          let durStr = colDur !== -1 && row[colDur] ? String(row[colDur]).trim() : '';
          if (durStr.includes('1899-12-') || !durStr) {
            durStr = fallbackDurMap.get(vid) || '';
          }
          const upDate = normalizeDateStr(colDate !== -1 ? row[colDate] : '');
          const mAct = rawTitle.match(/(202\d)[./-]?(\d{2})[./-]?(\d{2})/);
          const yr = mAct ? mAct[1] : (upDate.slice(0, 4) || '其他');

          liveVideos.push({
            Item: colItem !== -1 && row[colItem] ? String(row[colItem]) : String(rows.length - r),
            ViewCount: vcNum.toLocaleString(),
            viewsNum: vcNum,
            Title: rawTitle,
            href,
            vid,
            Duration: durStr,
            durSec: parseDurSec(durStr),
            UploadDate: upDate,
            year: yr,
            ListName: '青松YT聯結'
          });
        }

        if (liveVideos.length === 0) return;

        // Check if there are new videos or updated counts compared to static snapshot
        const oldHrefs = new Set(VIDEOS.map(v => v.href));
        const hasNewOrChanged = liveVideos.length !== VIDEOS.length || liveVideos.some(v => !oldHrefs.has(v.href));

        // Replace VIDEOS contents and rebuild DOM if needed
        VIDEOS.length = 0;
        VIDEOS.push(...liveVideos);

        const yrMap = new Map();
        let maxViews = 0;
        for (const v of VIDEOS) {
          yrMap.set(v.year, (yrMap.get(v.year) || 0) + 1);
          if (v.viewsNum > maxViews) maxViews = v.viewsNum;
        }
        YEARS.length = 0;
        YEARS.push(...Array.from(yrMap.entries()).sort((a, b) => b[0].localeCompare(a[0])));

        
        document.getElementById('yearChips').innerHTML = '';
        gridEl.innerHTML = '';
        tbodyEl.innerHTML = '';
        cardMap.clear();
        rowMap.clear();

        initChips();
        initDOMItems();
        selectYear(activeYear);
      } catch (err) {
        console.warn('[Chingsong YT] Live Google Sheet sync skipped:', err);
      }
    }

    initChips();
    initDOMItems();
    syncLiveFromGoogleSheet();
  </script>
</body>
</html>
