IG 發布：${post.mtime_str}">
                    <span class="text-sky-400 flex items-center gap-0.5"><i class="fa-solid fa-cloud-arrow-down text-[10px]"></i>${post.ctime_str.split(' ')[0]}</span>
                  </div>
                </div>
                <h3 class="text-sm font-bold text-slate-100 group-hover:text-pink-300 transition-colors line-clamp-2 leading-snug cursor-pointer" onclick="openLightbox('${post.code}', 0)">
                  ${post.title}
                </h3>
              </div>

              <!-- Mini Carousel Strip & Actions -->
              <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between">
                <div class="flex items-center gap-1">
                  ${thumbsHtml}
                  ${extraCount}
                </div>
                <div class="flex items-center gap-2">
                  ${post.ig_url ? `
                    <a href="${post.ig_url}" target="_blank" class="w-7 h-7 rounded-lg bg-pink-600/20 hover:bg-pink-600 text-pink-400 hover:text-white flex items-center justify-center text-xs transition-all border border-pink-500/30" title="在 Instagram 開啟貼文">
                      <i class="fa-brands fa-instagram"></i>
                    </a>` : ''
                  }
                  <button onclick="openLightbox('${post.code}', 0)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-xs transition-all border border-slate-700" title="大圖檢視">
                    <i class="fa-solid fa-expand"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderTable(posts) {
      tableBody.innerHTML = posts.map(post => {
        const cover = post.items[0];
        const isVid = cover.ext in { 'mp4': 1, 'mov': 1, 'webm': 1 };
        const coverSrc = getMediaUrl(cover);

        return `
          <tr class="hover:bg-slate-800/40 transition-colors">
            <td class="py-3 px-4 text-center">
              <div class="w-12 h-14 rounded-lg bg-slate-900 border border-slate-700/80 overflow-hidden cursor-pointer mx-auto flex items-center justify-center" onclick="openLightbox('${post.code}', 0)">
                ${isVid 
                  ? `<div class="relative w-full h-full flex items-center justify-center bg-slate-950"><i class="fa-solid fa-play text-xs text-rose-400"></i></div>`
                  : `<img src="${coverSrc}" alt="${post.title}" decoding="async" class="w-full h-full object-cover" onerror="if(window.location.protocol==='file:'){this.onerror=null;this.src=BASE_PATH+encodeURIComponent(cover.filename);}" />`
                }
              </div>
            </td>
            <td class="py-3 px-4">
              <div class="font-mono text-[10px] text-pink-400">#${post.code}</div>
              <div class="font-bold text-slate-100 hover:text-pink-300 transition-colors cursor-pointer text-sm" onclick="openLightbox('${post.code}', 0)">
                ${post.title}
              </div>
              <div class="text-[11px] text-slate-500 truncate max-w-md mt-0.5">
                ${post.items.map(it => it.title).join(' • ')}
              </div>
            </td>
            <td class="py-3 px-3">
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${post.category_badge} inline-flex items-center gap-1">
                <i class="fa-solid ${post.category_icon}"></i>${post.category_name}
              </span>
            </td>
            <td class="py-3 px-3">
              <span class="text-[11px] font-medium px-2 py-0.5 rounded-full border ${post.type_badge}">
                ${post.type_label}
              </span>
            </td>
            <td class="py-3 px-3 text-center font-mono font-medium text-slate-300">${post.count}</td>
            <td class="py-3 px-3 font-mono text-slate-400">${post.total_size_str}</td>
            <td class="py-3 px-3 font-mono text-[11px] text-slate-400">
              <div>${post.ctime_str}</div>
            </td>
            <td class="py-3 px-4 text-center">
              <div class="inline-flex items-center gap-1.5">
                ${post.ig_url ? `
                  <a href="${post.ig_url}" target="_blank" class="w-7 h-7 rounded-lg bg-pink-600/20 hover:bg-pink-600 text-pink-400 hover:text-white flex items-center justify-center text-xs transition-all border border-pink-500/30" title="在 Instagram 開啟貼文">
                    <i class="fa-brands fa-instagram"></i>
                  </a>` : ''
                }
                <button onclick="openLightbox('${post.code}', 0)" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center text-xs transition-all border border-slate-700" title="展開預覽">
                  <i class="fa-solid fa-expand"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Lightbox Controls
    function openLightbox(postCode, slideIndex = 0) {
      activePost = POSTS_DATA.find(p => p.code === postCode);
      if (!activePost) return;
      activeSlideIndex = slideIndex;

      lightboxModal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');

      if (activePost.ig_url) {
        modalIgLink.href = activePost.ig_url;
        modalIgLink.classList.remove('hidden');
      } else {
        modalIgLink.classList.add('hidden');
      }

      updateLightboxSlide();
    }

    function closeLightbox() {
      lightboxModal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
      modalVideo.pause();
      modalVideo.src = "";
      modalImg.src = "";
      activePost = null;
    }

    function updateLightboxSlide() {
      if (!activePost) return;
      const total = activePost.items.length;
      const currentItem = activePost.items[activeSlideIndex];
      const isVid = currentItem.ext in { 'mp4': 1, 'mov': 1, 'webm': 1 };
      const mediaUrl = getMediaUrl(currentItem);

      modalCounter.textContent = `${activeSlideIndex + 1} / ${total}`;
      modalTitle.textContent = `${activePost.title} - ${currentItem.title || currentItem.filename}`;
      modalRawFile.href = mediaUrl;

      if (isVid) {
        modalImg.classList.add('hidden');
        modalVideo.classList.remove('hidden');
        modalVideo.src = mediaUrl;
        modalVideo.play().catch(e => console.log('Autoplay muted requirement'));
      } else {
        modalVideo.pause();
        modalVideo.classList.add('hidden');
        modalImg.classList.remove('hidden');
        modalImg.src = mediaUrl;
      }

      // Arrows visibility
      modalPrev.classList.toggle('hidden', total <= 1);
      modalNext.classList.toggle('hidden', total <= 1);

      // Render Bottom Thumbnails if carousel
      if (total > 1) {
        modalThumbnails.classList.remove('hidden');
        modalThumbnails.innerHTML = activePost.items.map((it, idx) => `
          <button onclick="activeSlideIndex = ${idx}; updateLightboxSlide();" class="relative w-12 h-14 rounded-lg overflow-hidden border-2 transition-all ${idx === activeSlideIndex ? 'border-pink-500 scale-105 shadow-md shadow-pink-500/30' : 'border-slate-700 opacity-60 hover:opacity-100'}">
            ${it.ext in { 'mp4':1,'mov':1 } ? '<div class="w-full h-full bg-slate-900 flex items-center justify-center text-xs text-rose-400"><i class="fa-solid fa-play"></i></div>' : `<img src="${getMediaUrl(it)}" onerror="if(window.location.protocol==='file:'){this.onerror=null;this.src=BASE_PATH+encodeURIComponent(it.filename);}" class="w-full h-full object-cover" />`}
          </button>
        `).join('');
      } else {
        modalThumbnails.classList.add('hidden');
      }
    }

    async function fetchShortUrl(longUrl) {
      if (shortUrlCache[longUrl]) return shortUrlCache[longUrl];
      const endpoints = [
        `https://is.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`,
        `https://v.gd/create.php?format=json&url=${encodeURIComponent(longUrl)}`
      ];
      for (const endpoint of endpoints) {
        try {
          const resp = await fetch(endpoint);
          if (resp.ok) {
            const data = await resp.json();
            if (data && data.shorturl) {
              shortUrlCache[longUrl] = data.shorturl;
              return data.shorturl;
            }
          }
        } catch (e) {
          console.warn('shortener failed:', endpoint, e);
        }
      }
      // Fallback: clck.ru
      try {
        const resp3 = await fetch(`https://clck.ru/--?url=${encodeURIComponent(longUrl)}`);
        if (resp3.ok) {
          const shortUrl = (await resp3.text()).trim();
          if (shortUrl.startsWith('http')) {
            shortUrlCache[longUrl] = shortUrl;
            return shortUrl;
          }
        }
      } catch (e3) {
        console.warn('clck.ru failed:', e3);
      }
      return longUrl;
    }

    modalShareBtn.addEventListener('click', async () => {
      if (!activePost || !activePost.items[activeSlideIndex]) return;
      const currentItem = activePost.items[activeSlideIndex];
      const title = currentItem.title || activePost.title;
      const longUrl = R2_BASE + encodeURIComponent(currentItem.filename);
      const originalHtml = modalShareBtn.innerHTML;
      modalShareBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>縮網址中...</span>';
      modalShareBtn.disabled = true;
      try {
        const shortUrl = await fetchShortUrl(longUrl);
        await navigator.clipboard.writeText(`${title}\n${shortUrl}`);
        modalShareBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>已複製短網址+標題</span>';
      } catch (err) {
        console.error(err);
        modalShareBtn.innerHTML = '<i class="fa-solid fa-xmark"></i><span>複製失敗</span>';
      } finally {
        setTimeout(() => {
          modalShareBtn.innerHTML = originalHtml;
          modalShareBtn.disabled = false;
        }, 2000);
      }
    });

    modalPrev.addEventListener('click', () => {
      if (!activePost) return;
      activeSlideIndex = (activeSlideIndex - 1 + activePost.items.length) % activePost.items.length;
      updateLightboxSlide();
    });

    modalNext.addEventListener('click', () => {
      if (!activePost) return;
      activeSlideIndex = (activeSlideIndex + 1) % activePost.items.length;
      updateLightboxSlide();
    });

    modalClose.addEventListener('click', closeLightbox);
    lightboxModal.addEventListener('click', (e) => {
      if (e.target === lightboxModal) closeLightbox();
    });

    window.addEventListener('keydown', (e) => {
      if (lightboxModal.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') modalPrev.click();
      if (e.key === 'ArrowRight') modalNext.click();
    });

    // Event Listeners for Categories
    catBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        catBtns.forEach(b => {
          b.classList.remove('active', 'bg-pink-600', 'text-white', 'border-pink-500/40');
          b.classList.add('bg-slate-900/80', 'text-slate-400', 'border-slate-800');
        });
        btn.classList.add('active', 'bg-pink-600', 'text-white', 'border-pink-500/40');
        btn.classList.remove('bg-slate-900/80', 'text-slate-400', 'border-slate-800');
        currentCategory = btn.dataset.cat;
        render();
      });
    });

    // Event Listeners for Type Filters
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('active', 'bg-slate-700', 'text-white');
          b.classList.add('text-slate-400');
        });
        btn.classList.add('active', 'bg-slate-700', 'text-white');
        btn.classList.remove('text-slate-400');
        currentFilter = btn.dataset.type;
        render();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.classList.toggle('hidden', !searchQuery);
      render();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      render();
    });

    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    viewGridBtn.addEventListener('click', () => {
      currentView = 'grid';
      viewGridBtn.classList.add('bg-slate-700', 'text-white');
      viewGridBtn.classList.remove('text-slate-400');
      viewListBtn.classList.remove('bg-slate-700', 'text-white');
      viewListBtn.classList.add('text-slate-400');
      render();
    });

    viewListBtn.addEventListener('click', () => {
      currentView = 'list';
      viewListBtn.classList.add('bg-slate-700', 'text-white');
      viewListBtn.classList.remove('text-slate-400');
      viewGridBtn.classList.remove('bg-slate-700', 'text-white');
      viewGridBtn.classList.add('text-slate-400');
      render();
    });

    // Initial Render
    render();
  </script>
</body>
</html>
