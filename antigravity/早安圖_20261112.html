<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日早安圖（2026-11-12 荷花池晨曦特輯）</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --accent: #10b981;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #0b1512 0%, #0f2b1d 50%, #0a1f16 100%);
    color: var(--text-main);
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container {
    max-width: 1200px;
    width: 100%;
  }
  header {
    text-align: center;
    margin-bottom: 35px;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #6ee7b7, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 1.05rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    margin-bottom: 40px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    overflow: hidden;
    backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 15px 40px rgba(16, 185, 129, 0.2);
  }
  .img-wrapper {
    width: 100%;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
  }
  .card-body {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    justify-content: space-between;
  }
  .badge {
    align-self: flex-start;
    padding: 4px 12px;
    border-radius: 9999px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .badge-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  .badge-blue { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
  .badge-amber { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
  h2 { font-size: 1.3rem; margin-bottom: 8px; }
  p.desc { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 16px; }
  .actions {
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    text-align: center;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    text-decoration: none;
    color: #fff;
    background: #10b981;
    transition: background 0.2s;
  }
  .btn:hover { background: #059669; }
  .btn-outline {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #e2e8f0;
  }
  .btn-outline:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  .wide-card {
    grid-column: 1 / -1;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>清晨荷塘 • 今日早安圖</h1>
      <p class="subtitle">2026年11月12日 星期四 ｜ 基於用戶清晨 07:23 荷花池實拍照製作</p>
    </header>

    <div class="grid">
      <!-- 一般版 -->
      <div class="card">
        <div class="img-wrapper">
          <img src="早安圖/早安_20261112.jpg" alt="早安_20261112.jpg">
        </div>
        <div class="card-body">
          <div>
            <span class="badge badge-green">一般版 • 9:16</span>
            <h2>朝氣盎然 • 滿池綠意</h2>
            <p class="desc">生機蓬勃萬物並秀，滿載昂揚鬥志迎向新突破。融合晨露池塘與金光書法。</p>
          </div>
          <div class="actions">
            <a href="早安圖/早安_20261112.jpg" target="_blank" class="btn">查看原圖</a>
            <a href="早安圖/早安_20261112.jpg" download class="btn btn-outline">下載</a>
          </div>
        </div>
      </div>

      <!-- 信仰版 -->
      <div class="card">
        <div class="img-wrapper">
          <img src="早安圖/信仰_20261112.jpg" alt="信仰_20261112.jpg">
        </div>
        <div class="card-body">
          <div>
            <span class="badge badge-blue">信仰版 • 9:16</span>
            <h2>主的恩典 • 晨光靈修</h2>
            <p class="desc">「我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。」（哥林多後書 12:9）</p>
          </div>
          <div class="actions">
            <a href="早安圖/信仰_20261112.jpg" target="_blank" class="btn">查看原圖</a>
            <a href="早安圖/信仰_20261112.jpg" download class="btn btn-outline">下載</a>
          </div>
        </div>
      </div>

      <!-- 橫版全景 -->
      <div class="card wide-card">
        <div class="img-wrapper">
          <img src="早安圖/早安_20261112_橫版.jpg" alt="早安_20261112_橫版.jpg">
        </div>
        <div class="card-body">
          <div>
            <span class="badge badge-amber">實拍全景橫幅 • 寬螢幕</span>
            <h2>滿池綠意迎朝曦 • 橫版早安卡</h2>
            <p class="desc">保留實拍完整視野與清晨光影，覆蓋底角相機水印，配上毛玻璃質感卡片與「平安喜樂」印章。</p>
          </div>
          <div class="actions" style="max-width: 320px;">
            <a href="早安圖/早安_20261112_橫版.jpg" target="_blank" class="btn">查看原圖</a>
            <a href="早安圖/早安_20261112_橫版.jpg" download class="btn btn-outline">下載</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
