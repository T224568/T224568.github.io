<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小暉鋼琴｜全頻道 18 個播放清單互動檢索器（去重・依觀看數排序）</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #181b24;
      --surface-hover: #212634;
      --border: #2a3042;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #f59e0b;
      --accent-soft: rgba(245, 158, 11, 0.14);
      --primary: #38bdf8;
      --primary-soft: rgba(56, 189, 248, 0.14);
      --danger: #f43f5e;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 64px;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Visually hidden for screen reader status announcements */
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    header {
      background: linear-gradient(135deg, #161923 0%, #1e1b2e 50%, #172133 100%);
      border-bottom: 1px solid var(--border);
      padding: 28px 20px 22px;
    }
    .container {
      max-width: 1360px;
      margin: 0 auto;
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .title-group h1 {
      font-size: clamp(1.35rem, 2.4vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-group p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 4px;
    }
    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
      text-decoration: none;
    }
    .btn-accent {
      background: var(--accent-soft);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .btn-accent:hover {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--accent);
    }

    /* Stats bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }
    .stat-card {
      background: rgba(24, 27, 36, 0.75);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-value {
      font-size: 1.35rem;
      font-weight: 800;
      margin-top: 2px;
      color: var(--text);
    }
    .stat-value.accent { color: #fbbf24; }
    .stat-value.primary { color: var(--primary); }

    /* Filter Toolbar */
    .toolbar-wrap {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(15, 17, 23, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .search-box {
      flex: 1 1 280px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 10px 36px 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }
    .clear-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      display: none;
    }
    .controls-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    select {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: var(--primary); }

    .view-toggle {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 13px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .view-toggle button[aria-pressed="true"] {
      background: var(--primary-soft);
      color: var(--primary);
    }

    /* Playlist chips */
    .chips-section {
      padding: 14px 20px 6px;
    }
    .chips-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip:hover {
      color: var(--text);
      border-color: #475569;
    }
    .chip[aria-pressed="true"] {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #fbbf24;
    }
    .chip-count {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 0.75rem;
    }

    /* Main content area */
    main {
      padding: 16px 20px;
    }

    /* Card Grid View */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }
    .video-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.16s ease, border-color 0.16s ease;
      content-visibility: auto;
      contain-intrinsic-size: 320px;
    }
    .video-card:hover {
      transform: translateY(-3px);
      border-color: #475569;
    }
    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #0b0d13;
      cursor: pointer;
      overflow: hidden;
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }
    .video-card:hover .thumb-wrap img {
      transform: scale(1.04);
    }
    .rank-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(15, 17, 23, 0.86);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 800;
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 8px;
    }
    .rank-badge.top3 {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      border-color: transparent;
      color: #fff;
    }
    .views-badge {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 17, 23, 0.88);
      backdrop-filter: blur(4px);
      color: #fbbf24;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 9px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.35);
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .thumb-wrap:hover .play-overlay {
      opacity: 1;
    }
    .play-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(244, 63, 94, 0.92);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }
    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 10px;
    }
    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      cursor: pointer;
    }
    .card-title:hover { color: var(--primary); }
    .card-meta {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .pl-tag {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    /* Table View */
    .table-wrap {
      display: none;
      overflow-x: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #13161f;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      white-space: nowrap;
    }
    tbody tr {
      content-visibility: auto;
      contain-intrinsic-size: 52px;
    }
    tbody tr:hover {
      background: var(--surface-hover);
    }
    .td-rank {
      font-weight: 800;
      color: var(--text-muted);
      width: 64px;
    }
    .td-views {
      font-weight: 700;
      color: #fbbf24;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .td-date {
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .is-hidden {
      display: none !important;
    }

    .empty-state {
      display: none;
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      margin-top: 16px;
    }

    /* Native Modal Dialog for YouTube Player */
    dialog#playerDialog {
      margin: auto;
      width: min(94vw, 960px);
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 0;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    }
    dialog#playerDialog::backdrop {
      background-color: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
    }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .dialog-header h2 {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
    }
    .dialog-close {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .dialog-close:hover {
      border-color: var(--danger);
      color: var(--danger);
    }
    .player-aspect {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      background: #000;
    }
    .player-aspect iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    .dialog-footer {
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    @media (prefers-reduced-motion: reduce) {
      *, ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <p id="reorder-status" role="status" class="visually-hidden"></p>

  <header>
    <div class="container">
      <div class="header-top">
        <div class="title-group">
          <h1>🎹 小暉鋼琴｜全頻道教學影片篩選器</h1>
          <p>整合 18 個播放清單（含系統課程）・已自動去重並依實時觀看次數由高至低排序</p>
        </div>
        <div class="header-actions">
          <a class="btn btn-accent" href="https://docs.google.com/spreadsheets/d/1xAZ810fin7AY4azNgN-sPr4fuIx0a77ASFOymfvxTXk/edit" target="_blank" rel="noopener">
            📊 開啟 Google Sheet (302 筆)
          </a>
          <a class="btn" href="https://www.youtube.com/channel/UCW79XtJkbxJfCj6Hqycwzig/playlists" target="_blank" rel="noopener">
            📺 YouTube 頻道播放清單
          </a>
          <button class="btn" id="exportCsvBtn" type="button">⬇️ 匯出目前篩選 CSV</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">去重後總影片數</div>
          <div class="stat-value primary" id="statVisibleCount">302 / 302</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">收錄播放清單數</div>
          <div class="stat-value">18 個清單</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">累計總觀看次數</div>
          <div class="stat-value accent" id="statVisibleViews">2,033,819</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">最高單片觀看數</div>
          <div class="stat-value accent">937,841 次</div>
        </div>
      </div>
    </div>
  </header>

  <div class="toolbar-wrap">
    <div class="container toolbar">
      <div class="search-box">
        <input type="search" id="searchInput" placeholder="🔍 搜尋影片標題、曲名、和弦、伴奏、指法關鍵字..." aria-label="搜尋影片標題或播放清單" />
        <button type="button" class="clear-btn" id="clearSearchBtn" aria-label="清除搜尋">✕</button>
      </div>
      <div class="controls-group">
        <label for="sortSelect" class="visually-hidden">排序方式</label>
        <select id="sortSelect" aria-label="排序方式">
          <option value="views-desc" selected>🔥 觀看次數：高 → 低（預設）</option>
          <option value="views-asc">觀看次數：低 → 高</option>
          <option value="date-desc">📅 發布日期：最新 → 最舊</option>
          <option value="date-asc">發布日期：最舊 → 最新</option>
          <option value="title-asc">🔤 標題名稱：A → Z</option>
        </select>

        <div class="view-toggle" role="group" aria-label="檢視模式切換">
          <button type="button" id="gridViewBtn" aria-pressed="true">🖼️ 卡片檢視</button>
          <button type="button" id="tableViewBtn" aria-pressed="false">📋 表格檢視</button>
        </div>
      </div>
    </div>
  </div>

  <section class="chips-section">
    <div class="container">
      <div class="chips-bar" id="playlistChips" role="group" aria-label="播放清單分類篩選"></div>
    </div>
  </section>

  <main class="container">
    <div class="video-grid" id="videoGrid"></div>

    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th scope="col">排名</th>
            <th scope="col">觀看次數</th>
            <th scope="col">影片標題</th>
            <th scope="col">所屬播放清單</th>
            <th scope="col">發布日期</th>
            <th scope="col">操作</th>
          </tr>
        </thead>
        <tbody id="videoTbody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="emptyState">
      <h3>找不到符合條件的教學影片</h3>
      <p style="margin-top:6px;">請嘗試更換搜尋關鍵字，或點選上方「全部播放清單」重置篩選。</p>
    </div>
  </main>

  <dialog id="playerDialog" closedby="any" aria-labelledby="dialogVideoTitle">
    <div class="dialog-header">
      <h2 id="dialogVideoTitle">影片播放</h2>
      <form method="dialog">
        <button type="submit" class="dialog-close">✕ 關閉 (Esc)</button>
      </form>
    </div>
    <div class="player-aspect">
      <iframe id="ytIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen title="YouTube 影片播放器"></iframe>
    </div>
    <div class="dialog-footer">
      <span id="dialogMetaInfo"></span>
      <a id="dialogYtLink" href="#" target="_blank" rel="noopener">↗ 在 YouTube 分頁開啟</a>
    </div>
  </dialog>

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'chip';
        btn.dataset.pl = plName;
        btn.setAttribute('aria-pressed', 'false');
        btn.innerHTML = `${plName} <span class="chip-count">${count}</span>`;
        btn.addEventListener('click', () => selectPlaylist(plName));
        bar.appendChild(btn);
      }
    }

    function selectPlaylist(pl) {
      activePlaylist = pl;
      for (const btn of document.querySelectorAll('#playlistChips .chip')) {
        btn.setAttribute('aria-pressed', btn.dataset.pl === pl ? 'true' : 'false');
      }
      applyFilterAndSort(false);
    }

    // Initial render of all cards and table rows once
    function initDOMItems() {
      const gridFrag = document.createDocumentFragment();
      const tbodyFrag = document.createDocumentFragment();

      for (const v of VIDEOS) {
        // Card element
        const card = document.createElement('article');
        card.className = 'video-card';
        card.dataset.href = v.href;
        const topClass = v.Item <= 3 ? 'rank-badge top3' : 'rank-badge';
        const thumbUrl = `https://i.ytimg.com/vi/${v.vid}/hqdefault.jpg`;

        card.innerHTML = `
          <div class="thumb-wrap" data-play="${v.vid}">
            <img src="${thumbUrl}" alt="${v.Title.replace(/"/g, '&quot;')}" loading="lazy" decoding="async" />
            <span class="${topClass}">#${v.Item}</span>
            <span class="views-badge">👁️ ${v.ViewCount}</span>
            <div class="play-overlay"><div class="play-icon">▶</div></div>
          </div>
          <div class="card-body">
            <h3 class="card-title" data-play="${v.vid}">${v.Title}</h3>
            <div class="card-meta">
              <span class="pl-tag" title="點擊篩選：${v.ListName}" data-filter-pl="${v.ListName.split('/')[0].trim()}">📂 ${v.ListName}</span>
              <span>${v.UploadDate || ''}</span>
            </div>
          </div>
        `;
        card.querySelectorAll('[data-play]').forEach(el => {
          el.addEventListener('click', () => openPlayer(v));
        });
        card.querySelector('[data-filter-pl]').addEventListener('click', (e) => {
          e.stopPropagation();
          selectPlaylist(e.currentTarget.dataset.filterPl);
        });
        cardMap.set(v.href, card);
        gridFrag.appendChild(card);

        // Table row element
        const tr = document.createElement('tr');
        tr.dataset.href = v.href;
        tr.innerHTML = `
          <td class="td-rank">#${v.Item}</td>
          <td class="td-views">${v.ViewCount}</td>
          <td>
            <a href="${v.href}" class="row-play-link" style="font-weight:600;color:var(--text);">${v.Title}</a>
          </td>
          <td><span class="pl-tag" data-filter-pl="${v.ListName.split('/')[0].trim()}">${v.ListName}</span></td>
          <td class="td-date">${v.UploadDate || ''}</td>
          <td>
            <button type="button" class="btn" style="padding:4px 10px;font-size:0.78rem;">▶ 播放</button>
          </td>
        `;
        tr.querySelector('.row-play-link').addEventListener('click', (e) => {
          e.preventDefault();
          openPlayer(v);
        });
        tr.querySelector('button').addEventListener('click', () => openPlayer(v));
        tr.querySelector('[data-filter-pl]').addEventListener('click', (e) => {
          selectPlaylist(e.currentTarget.dataset.filterPl);
        });
        rowMap.set(v.href, tr);
        tbodyFrag.appendChild(tr);
      }

      gridEl.appendChild(gridFrag);
      tbodyEl.appendChild(tbodyFrag);
    }

    function getFilteredAndSorted() {
      const q = searchQuery.trim().toLowerCase();
      const filtered = VIDEOS.filter(v => {
        if (activePlaylist !== 'ALL') {
          const lists = v.ListName.split('/').map(s => s.trim());
          if (!lists.includes(activePlaylist)) return false;
        }
        if (q) {
          const hay = `${v.Title} ${v.ListName} ${v.UploadDate}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const sorted = [...filtered].sort((a, b) => {
        if (currentSort === 'views-desc') return b.viewsNum - a.viewsNum;
        if (currentSort === 'views-asc') return a.viewsNum - b.viewsNum;
        if (currentSort === 'date-desc') return (b.UploadDate || '').localeCompare(a.UploadDate || '') || (b.viewsNum - a.viewsNum);
        if (currentSort === 'date-asc') return (a.UploadDate || '').localeCompare(b.UploadDate || '') || (b.viewsNum - a.viewsNum);
        if (currentSort === 'title-asc') return a.Title.localeCompare(b.Title, 'zh-Hant');
        return 0;
      });

      return { filtered, sorted };
    }

    function applyFilterAndSort(announceSort = false) {
      const { sorted } = getFilteredAndSorted();
      const visibleSet = new Set(sorted.map(v => v.href));

      let sumViews = 0;
      for (const v of sorted) sumViews += v.viewsNum;

      for (const v of VIDEOS) {
        const isVis = visibleSet.has(v.href);
        cardMap.get(v.href).classList.toggle('is-hidden', !isVis);
        rowMap.get(v.href).classList.toggle('is-hidden', !isVis);
      }

      const orderedCards = sorted.map(v => cardMap.get(v.href));
      const orderedRows = sorted.map(v => rowMap.get(v.href));
      reorder(gridEl, orderedCards);
      reorder(tbodyEl, orderedRows);

      statCountEl.textContent = `${sorted.length} / ${VIDEOS.length}`;
      statViewsEl.textContent = sumViews.toLocaleString();
      emptyStateEl.style.display = sorted.length === 0 ? 'block' : 'none';

      if (announceSort) {
        const sortLabel = document.getElementById('sortSelect').selectedOptions[0].textContent;
        statusEl.textContent = `已依 ${sortLabel} 排序，共顯示 ${sorted.length} 部影片`;
      }
    }

    // Modal player with native <dialog closedby="any"> + fallback
    const dialog = document.getElementById('playerDialog');
    const ytIframe = document.getElementById('ytIframe');

    if (!('closedBy' in HTMLDialogElement.prototype)) {
      dialog.addEventListener('click', (event) => {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        const isDialogContent = (
          rect.top <= event.clientY &&
          event.clientY <= rect.top + rect.height &&
          rect.left <= event.clientX &&
          event.clientX <= rect.left + rect.width
        );
        if (isDialogContent) return;
        dialog.close();
      });
    }

    dialog.addEventListener('close', () => {
      ytIframe.src = '';
    });

    function openPlayer(v) {
      document.getElementById('dialogVideoTitle').textContent = `#${v.Item} ${v.Title}`;
      document.getElementById('dialogMetaInfo').textContent = `👁️ 觀看次數：${v.ViewCount} ｜ 📂 清單：${v.ListName} ｜ 📅 發布：${v.UploadDate}`;
      document.getElementById('dialogYtLink').href = v.href;
      ytIframe.src = `https://www.youtube.com/embed/${v.vid}?autoplay=1&rel=0`;
      dialog.showModal();
    }

    // Event bindings
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearSearchBtn');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      clearBtn.style.display = searchQuery ? 'block' : 'none';
      applyFilterAndSort(false);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.style.display = 'none';
      applyFilterAndSort(false);
      searchInput.focus();
    });

    document.getElementById('sortSelect').addEventListener('change', (e) => {
      currentSort = e.target.value;
      applyFilterAndSort(true);
    });

    const gridViewBtn = document.getElementById('gridViewBtn');
    const tableViewBtn = document.getElementById('tableViewBtn');
    gridViewBtn.addEventListener('click', () => {
      currentView = 'grid';
      gridViewBtn.setAttribute('aria-pressed', 'true');
      tableViewBtn.setAttribute('aria-pressed', 'false');
      gridEl.style.display = 'grid';
      tableWrapEl.style.display = 'none';
    });
    tableViewBtn.addEventListener('click', () => {
      currentView = 'table';
      tableViewBtn.setAttribute('aria-pressed', 'true');
      gridViewBtn.setAttribute('aria-pressed', 'false');
      gridEl.style.display = 'none';
      tableWrapEl.style.display = 'block';
    });

    // Export current filtered view as CSV
    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      const { sorted } = getFilteredAndSorted();
      const headers = ['Item', 'ViewCount', 'Title', 'href', 'UploadDate', 'ListName'];
      const rows = [headers.join(',')];
      for (const v of sorted) {
        const row = headers.map(h => `"${String(v[h] ?? '').replace(/"/g, '""')}"`);
        rows.push(row.join(','));
      }
      const blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `小暉鋼琴_播放清單篩選_${sorted.length}筆.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    initChips();
    initDOMItems();
  </script>
</body>
</html>
