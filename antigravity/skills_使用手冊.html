    let activeCat = "全部";
    const cats = ["全部", ...new Set(SKILLS.map(s => s.cat))];

    function esc(s) {
      return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
    }

    function renderCats() {
      document.getElementById("cats").innerHTML = cats.map(c => {
        const n = c === "全部" ? SKILLS.length : SKILLS.filter(s => s.cat === c).length;
        return `<button class="cat-btn ${c===activeCat?"active":""}" data-cat="${esc(c)}" onclick="activeCat=this.dataset.cat;renderCats();render()">${esc(c)} (${n})</button>`;
      }).join("");

      const sel = document.getElementById("cat-select");
      if (sel) {
        sel.innerHTML = cats.map(c => {
          const n = c === "全部" ? SKILLS.length : SKILLS.filter(s => s.cat === c).length;
          return `<option value="${esc(c)}" ${c===activeCat?"selected":""}>${esc(c)} (${n})</option>`;
        }).join("");
      }
    }

    function copyCmd(btn, txt) {
      navigator.clipboard.writeText(txt).then(() => {
        const o = btn.textContent; btn.textContent = "✅ 已複製"; btn.classList.add("ok");
        setTimeout(() => { btn.textContent = o; btn.classList.remove("ok"); }, 1200);
      });
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const list = SKILLS.filter(s => (activeCat === "全部" || s.cat === activeCat) &&

      document.getElementById("count").textContent = `顯示 ${list.length} / ${SKILLS.length} 項`;
      document.getElementById("grid").innerHTML = list.map(s => {

              return `<span class="trig-chip" data-copy="${esc(clean)}" onclick="copyCmd(this, this.dataset.copy)">${esc(t)}</span>`;
            }).join("") + `</div>`
          : "";
        const cli = s.cli ? `<div><strong>💻 CLI / 呼叫：</strong><code>${esc(s.cli)}</code></div>` : "";

          : `<div class="usage-pill" style="color:var(--muted);">💤 近10天未呼叫 ｜ 隨時可透過 <code>${esc(primaryCmd)}</code> 啟用</div>`;

        return `<div class="card">

              <div class="title">${esc(s.folder)}</div>
              <span class="badge">${esc(s.cat)}</span>
