    gap: 4px;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.38);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    text-decoration: none;
    letter-spacing: 0.3px;
    transition: all 0.2s ease;
  }
  .btn-gpx-studio:hover {

    font-weight: 900;

    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-header p {
    font-size: 12.5px;
    color: #d1fae5;
    line-height: 1.45;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .btn-hdr {
    flex: 1;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #ffffff;
    padding: 8px 12px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .btn-hdr:hover {
    background: rgba(255,255,255,0.28);
    transform: translateY(-1px);
  }
  .filter-bar {
    padding: 10px 14px;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    white-space: nowrap;
  }
  .btn-filter {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #475569;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-filter.active {
    background: #047857;
    color: #ffffff;
    border-color: #047857;
    box-shadow: 0 2px 6px rgba(4,120,87,0.25);
  }
  .search-box {
    padding: 10px 14px;
    border-bottom: 1px solid #e2e8f0;
    background: #ffffff;
  }
  .search-input {

    padding: 8px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .search-input:focus {
    border-color: #047857;
    box-shadow: 0 0 0 3px rgba(4,120,87,0.15);
  }
  .route-list {

    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .route-card {

    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    border-left: 5px solid #047857;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  }
  .route-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.08);

  .route-card.active {

    background: #f0fdf4;
    border-color: #86efac;
    box-shadow: 0 4px 14px rgba(4,120,87,0.12);

    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;

    align-items: center;
    gap: 4px;

    color: #047857;
    font-size: 11px;
    font-weight: 800;

    font-size: 12.5px;
    font-weight: 800;
    color: #0f172a;
  }
  .card-title {
    font-size: 15.5px;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.35;
    margin-bottom: 6px;
  }
  .card-meta {
    font-size: 12px;
    color: #475569;
    line-height: 1.5;
    margin-bottom: 10px;
  }

    gap: 6px;
    border-top: 1px dashed #e2e8f0;
    padding-top: 10px;
  }

    padding: 6px 8px;
    border-radius: 6px;
    font-size: 11.5px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.15s;
    border: none;

    color: #334155;
    border: 1px solid #cbd5e1;
  }
  .btn-act-studio:hover {

    color: #ffffff;
    border-color: #047857;
  }
  .btn-act-gmap {

    color: #ffffff;
  }
  .btn-act-gmap:hover {
    background: #c2410c;
  }
  .btn-act-dl {
    background: #047857;
    color: #ffffff;
  }
  .btn-act-dl:hover {
    background: #065f46;
  }
  .btn-act-focus {
    background: #0284c7;
    color: #ffffff;
  }
  .btn-act-focus:hover {

    color: #0f172a;

    font-weight: 800;

    margin-bottom: 4px;

    margin-bottom: 8px;

    margin-top: 6px;

    font-weight: 700;

    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);

    }

    "🇹🇼 台灣通用電子地圖": nlscLayer,
    "🗺️ OpenStreetMap": osmLayer,
    "🛰️ 高解析衛星空拍圖": satelliteLayer,
    "⛰️ 健行等高線地形圖": topoLayer
  };

  L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

  let routeLayers = {};
  let markerLayers = {};
  let activeRouteId = null;

  function renderList(items) {
    const listEl = document.getElementById('routeList');
    listEl.innerHTML = '';

    if (items.length === 0) {
      listEl.innerHTML = '<div style="text-align:center; padding:30px 10px; color:#94a3b8; font-size:13px;">查無符合的健行軌跡</div>';
      return;
    }

    items.forEach(r => {
      const card = document.createElement('div');
      card.className = `route-card ${r.id === activeRouteId ? 'active' : ''}`;
      card.id = `card-${r.id}`;
      card.style.borderLeftColor = r.color;
      card.onclick = (e) => {
        if (e.target.closest('.btn-act')) return;
        selectRoute(r.id);
      };

      card.innerHTML = `
        <div class="card-top">
          <span class="card-badge" style="background:${r.color}15; color:${r.color};">#${r.num} ${r.tag}</span>
          <span class="card-dist">${r.dist} (實測 ${r.actual_dist} km)</span>
        </div>
        <div class="card-title">${r.name}</div>
        <div class="card-meta">
          <div>🚌 <strong>接駁：</strong>${r.transit} <a href="${r.gmap_url}" target="_blank" style="margin-left:6px; color:#ea580c; font-weight:700; text-decoration:none;" title="開啟 Google Maps 起點導航">[📍起點導航 ↗]</a></div>
          <div>👣 <strong>節點：</strong>${r.steps}</div>
          <div>✨ <strong>亮點：</strong>${r.highlight}</div>
        </div>
        <div class="card-actions">
          <button class="btn-act btn-act-focus" onclick="selectRoute('${r.id}')">📍 定位路線</button>
          <a class="btn-act btn-act-gmap" href="${r.gmap_url}" target="_blank" title="在 Google Maps 開啟起點導航">🚗 起點導航</a>
          <a class="btn-act btn-act-studio" href="${r.gpx_studio_url}" target="_blank" title="在 gpx.studio 開啟線上檢視編輯">🗺️ gpx.studio</a>
          <a class="btn-act btn-act-dl" href="${r.download_url}" target="_blank" download="${r.filename}" title="下載原始 GPX 檔案">📥 下載 GPX</a>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function initMapLayers() {
    routesData.forEach(r => {
      const polyline = L.polyline(r.points, {
        color: r.color,
        weight: 5.5,
        opacity: 0.85,
        lineJoin: 'round',
        lineCap: 'round'
      }).addTo(map);

      polyline.on('click', () => selectRoute(r.id));
      routeLayers[r.id] = polyline;

      const groupMarkers = [];
      if (r.points && r.points.length > 0) {
        const startPt = r.points[0];
        const startIcon = L.divIcon({
          className: 'custom-start-div',
          html: `<div class="route-start-badge" style="background:${r.color};">${r.num}</div>`,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const startMarker = L.marker(startPt, { icon: startIcon }).addTo(map);
        startMarker.bindPopup(`
          <div class="popup-content">
            <span class="popup-tag" style="background:${r.color};">路線 #${r.num} 起點</span>
            <div class="popup-title">${r.name}</div>
            <div class="popup-desc">${r.desc}</div>
            <div class="popup-btn-row">
              <a class="popup-btn" style="background:#ea580c;" href="${r.gmap_url}" target="_blank">🚗 Google Map 導航</a>
              <a class="popup-btn" style="background:#047857;" href="${r.gpx_studio_url}" target="_blank">🗺️ gpx.studio</a>
              <a class="popup-btn" style="background:#0284c7;" href="${r.download_url}" target="_blank">📥 下載 GPX</a>
            </div>
          </div>
        `);
        groupMarkers.push(startMarker);
      }

      if (r.waypoints) {
        r.waypoints.forEach((wp, wIdx) => {
          if (wIdx === 0) return;
          const wpMarker = L.circleMarker([wp.lat, wp.lng], {
            radius: 5,
            fillColor: r.color,
            color: '#ffffff',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.95
          }).addTo(map);

          wpMarker.bindPopup(`
            <div class="popup-content">
              <div class="popup-title" style="font-size:13.5px;">📍 ${wp.name}</div>
              <div class="popup-desc" style="margin-bottom:0;">${wp.desc}</div>
            </div>
          `);
          groupMarkers.push(wpMarker);
        });
      }

      markerLayers[r.id] = groupMarkers;
    });

    fitAllRoutes();
  }

  function selectRoute(id) {
    activeRouteId = id;

    Object.keys(routeLayers).forEach(rid => {
      const isCur = (rid === id);
      routeLayers[rid].setStyle({
        weight: isCur ? 7.5 : 3.5,
        opacity: isCur ? 1.0 : 0.4
      });
      if (isCur) routeLayers[rid].bringToFront();
    });

    const route = routesData.find(r => r.id === id);
    if (route && routeLayers[id]) {
      map.fitBounds(routeLayers[id].getBounds(), { padding: [50, 50], maxZoom: 16 });
    }

    document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
    const activeCard = document.getElementById(`card-${id}`);
    if (activeCard) {
      activeCard.classList.add('active');
      activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function fitAllRoutes() {
    activeRouteId = null;
    const allBounds = L.latLngBounds([]);

    Object.keys(routeLayers).forEach(rid => {
      routeLayers[rid].setStyle({ weight: 5, opacity: 0.85 });
      allBounds.extend(routeLayers[rid].getBounds());
    });

    if (allBounds.isValid()) {
      map.fitBounds(allBounds, { padding: [40, 40] });
    }

    document.querySelectorAll('.route-card').forEach(c => c.classList.remove('active'));
  }

  function filterRoutes(group, btn) {
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');

    let filtered = routesData;
    if (group !== 'all') {
      filtered = routesData.filter(r => r.group === group);
    }

    renderList(filtered);

    routesData.forEach(r => {
      const match = (group === 'all' || r.group === group);
      if (match) {
        if (!map.hasLayer(routeLayers[r.id])) map.addLayer(routeLayers[r.id]);
        if (markerLayers[r.id]) markerLayers[r.id].forEach(m => { if (!map.hasLayer(m)) map.addLayer(m); });
      } else {
        if (map.hasLayer(routeLayers[r.id])) map.removeLayer(routeLayers[r.id]);
        if (markerLayers[r.id]) markerLayers[r.id].forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
      }
    });

    const bounds = L.latLngBounds([]);
    filtered.forEach(r => {
      if (routeLayers[r.id]) bounds.extend(routeLayers[r.id].getBounds());
    });
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
  }

  function handleSearch() {
    const q = document.getElementById('routeSearch').value.trim().toLowerCase();
    const filtered = routesData.filter(r => {
      const txt = (r.name + ' ' + r.tag + ' ' + r.steps + ' ' + r.highlight + ' ' + r.transit + ' ' + r.desc).toLowerCase();
      return txt.includes(q);
    });
    renderList(filtered);
  }

  function locateUser() {
    if (!navigator.geolocation) {
      showToast('⚠️ 您的瀏覽器不支援定位功能');
      return;
    }
    showToast('📡 正在獲取您的 GPS 位置...');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        L.circleMarker([lat, lng], {
          radius: 9,
          fillColor: '#ef4444',
          color: '#ffffff',
          weight: 3,
          fillOpacity: 1
        }).addTo(map).bindPopup('📍 您目前所在位置').openPopup();
        map.setView([lat, lng], 16);
        showToast('✅ 已定位至您的當前位置');
      },
      err => {
        showToast('⚠️ 無法取得位置，請確認定位權限');
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
  }

  function toggleSidebar() {
    const sb = document.getElementById('sidebar');
    const btn = document.getElementById('btnToggleSidebar');
    sb.classList.toggle('collapsed');
    if (sb.classList.contains('collapsed')) {
      btn.innerText = '📋 展開列表';
    } else {
      btn.innerText = '🗺️ 大地圖模式';
    }
    setTimeout(() => { map.invalidateSize(); }, 300);
  }

  // 初始化
  renderList(routesData);
  initMapLayers();
</script>

</body>
</html>
