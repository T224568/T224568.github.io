<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>長鑫4F²超車三星？記憶體巨頭崩盤 9:16 手機圖卡畫廊</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #f0f6fc;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 30px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fff;
    }
    p.sub {
      color: #8b949e;
      font-size: 0.95rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 25px;
      max-width: 1300px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }
    .tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      font-weight: bold;
    }
    .img-wrap {
      width: 100%;
      background: #000;
      position: relative;
    }
    .img-wrap img {
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      object-fit: contain;
      display: block;
    }
    .card-footer {
      padding: 12px 18px;
      font-size: 0.85rem;
      color: #8b949e;
      line-height: 1.4;
      background: #11141a;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <h1>長鑫 4F² 超車三星？記憶體巨頭崩盤 9:16 手機圖卡</h1>
    <p class="sub">模型：Google Nano Banana ｜ 產出路徑：/Volumes/512G/Antigravity/ ｜ 預設組合：1C, 2H, 3I</p>
  </header>

  <main class="gallery">
    <!-- 圖卡 1 (1C) -->
    <article class="card">
      <div class="card-header">
        <span class="card-title">1C 黑板摘要</span>
        <span class="tag">Chalkboard</span>
      </div>
      <div class="img-wrap">
        <img src="長鑫4F超車記憶體崩盤_黑板摘要_1C.jpg" alt="1C 黑板摘要圖卡">
      </div>
      <div class="card-footer">
        黑板擦痕與細微粉筆灰質感，彩色粉筆手繪晶圓圖解、箭頭與四大核心重點摘要。
      </div>
    </article>

    <!-- 圖卡 2 (2H) -->
    <article class="card">
      <div class="card-header">
        <span class="card-title">2H 3D 黏土心智圖</span>
        <span class="tag">3D Clay</span>
      </div>
      <div class="img-wrap">
        <img src="長鑫4F超車記憶體崩盤_3D黏土心智圖_2H.jpg" alt="2H 3D黏土心智圖卡">
      </div>
      <div class="card-footer">
        軟萌霧面黏土材質與柔和陰影，中央立體晶片軸心延伸出四色立體導管分支。
      </div>
    </article>

    <!-- 圖卡 3 (3I) -->
    <article class="card">
      <div class="card-header">
        <span class="card-title">3I 等角講義</span>
        <span class="tag">Isometric 3D</span>
      </div>
      <div class="img-wrap">
        <img src="長鑫4F超車記憶體崩盤_等角講義_3I.jpg" alt="3I 等角講義圖卡">
      </div>
      <div class="card-footer">
        45度等角透視切面，微縮半導體晶圓廠、3D DRAM架構浮島與四大教學模組。
      </div>
    </article>
  </main>
</body>
</html>
