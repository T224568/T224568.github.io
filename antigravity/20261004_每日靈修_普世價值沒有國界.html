<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日靈修 9:16 手機視覺圖卡 | 2026-10-04 普世價值沒有國界</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-gold: #fbbf24;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(251, 191, 36, 0.12) 0%, transparent 40%);
    }
    header { text-align: center; margin-bottom: 2rem; max-width: 600px; }
    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }
    h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-sub); font-size: 0.95rem; line-height: 1.5; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: var(--card-bg); padding: 0.35rem; border-radius: 9999px; border: 1px solid var(--border-color); }
    .tab-btn {
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 500;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--accent-gold);
      color: #0b0f19;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
    }
    .viewer-card {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9/16;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      background: #000;
    }
    .viewer-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .viewer-card img.active { display: block; animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .info-footer { margin-top: 1.5rem; text-align: center; color: var(--text-sub); font-size: 0.85rem; }
    .action-links { display: flex; gap: 1rem; margin-top: 1rem; }
    .action-btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .action-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
  </style>
</head>
<body>
  <header>
    <div class="badge">2026-10-04 每日靈修</div>
    <h1>普世價值沒有國界</h1>
    <p class="subtitle">撒迦利亞書 1:1~21 ｜ 上帝的慈愛與統治超越族群界線，在黑暗與重建中帶來光明指望。</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="showCard(0)">[1I] 3D 等角場景</button>
    <button class="tab-btn" onclick="showCard(1)">[2H] 3D 黏土心智圖</button>
    <button class="tab-btn" onclick="showCard(2)">[3B] 現代毛玻璃講義</button>
  </div>

  <div class="viewer-card">
    <img id="card-0" class="active" src="https://files.catbox.moe/8uh6z9.jpg" alt="1I 等角視圖">
    <img id="card-1" src="https://files.catbox.moe/5po2yd.jpg" alt="2H 黏土心智圖">
    <img id="card-2" src="https://files.catbox.moe/l1tdht.jpg" alt="3B 現代講義">
  </div>

  <div class="action-links">
    <a href="https://bible.fhl.net/NUI/_rwd/#/bible/亞1:1-21" target="_blank" class="action-btn">📖 FHL 電子聖經閱讀</a>
    <a href="https://www.pct.org.tw/dailyneweyes.aspx?strDID=20261004" target="_blank" class="action-btn">🌐 每日新眼光原文</a>
  </div>

  <div class="info-footer">
    由 Google Nano Banana 生成 9:16 手機視覺圖卡 ｜ 自動同步至 Notion 每日靈修資料庫
  </div>

  <script>
    function showCard(index) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.viewer-card img').forEach((img, i) => {
        img.classList.toggle('active', i === index);
      });
    }
  </script>
</body>
</html>
