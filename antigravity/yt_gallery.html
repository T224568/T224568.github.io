    const statTotal = document.getElementById('stat-total');

    // Update Sheets dropdown based on category
    function updateSheetOptions() {
      const prevSelected = sheetFilter.value;
      sheetFilter.innerHTML = '<option value="">全部清單/分頁 (All Sheets)</option>';
      
      const candidateSheets = new Set();
      VIDEOS.forEach(v => {
        if (currentCategory === 'all' || v.mainCat === currentCategory) {
          v.sheets.forEach(s => candidateSheets.add(s));
        }
      });

      const sortedCandidateSheets = Array.from(candidateSheets).sort();
      sortedCandidateSheets.forEach(sheet => {
        const opt = document.createElement('option');
        opt.value = sheet;
        opt.textContent = sheet;
        sheetFilter.appendChild(opt);
      });

      if (candidateSheets.has(prevSelected)) {
        sheetFilter.value = prevSelected;
        currentSheet = prevSelected;
      } else {
        sheetFilter.value = '';
        currentSheet = '';
      }
    }

    // Counts for Category Pills
    function updateCounts() {
      statTotal.textContent = VIDEOS.length.toLocaleString();
      document.getElementById('pill-all-count').textContent = '(' + VIDEOS.length + ')';
      
      const catCounts = {};
      VIDEOS.forEach(v => {
        catCounts[v.mainCat] = (catCounts[v.mainCat] || 0) + 1;
      });
      if (document.getElementById('pill-worship-count')) document.getElementById('pill-worship-count').textContent = '(' + (catCounts['詩歌聖樂'] || 0) + ')';
      if (document.getElementById('pill-bible-count')) document.getElementById('pill-bible-count').textContent = '(' + (catCounts['聖經靈修'] || 0) + ')';

    }

    // Apply Filter & Sort
    function applyFilters() {
      filteredVideos = VIDEOS.filter(v => {
        if (currentCategory !== 'all' && v.mainCat !== currentCategory) return false;
        if (currentSheet && !v.sheets.includes(currentSheet)) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchTitle = v.title.toLowerCase().includes(q);
          const matchId = v.id.toLowerCase().includes(q);
          const matchSheet = v.sheets.some(s => s.toLowerCase().includes(q));
          if (!matchTitle && !matchId && !matchSheet) return false;
        }
        return true;
      });

        filteredVideos.sort((a, b) => b.viewCount - a.viewCount);
      } else if (sortMode === 'title_asc') {
        filteredVideos.sort((a, b) => a.title.localeCompare(b.title, 'zh-TW'));
      }

      statFiltered.textContent = filteredVideos.length.toLocaleString();
      page = 1;
      renderGrid();

              memberBadge +
            '</div>' +
            (v.duration ? '<div class="absolute bottom-2 left-2"><span class="px-2 py-0.5 rounded-md bg-black/80 backdrop-blur-md text-sky-400 text-[11px] font-bold font-mono border border-sky-400/40 flex items-center gap-1"><i class="fa-regular fa-clock text-[10px]"></i>' + v.duration + '</span></div>' : '') +
            (v.viewCount ? '<div class="absolute bottom-2 right-2"><span class="px-2 py-0.5 rounded-md bg-black/80 backdrop-blur-md text-amber-400 text-[11px] font-bold font-mono border border-amber-400/40 flex items-center gap-1"><i class="fa-regular fa-eye text-[10px]"></i>' + v.viewCount.toLocaleString() + '</span></div>' : '') +
          '</div>' +
          '<div class="p-3.5 flex flex-col flex-1 justify-between gap-2.5">' +
            '<div>' +
              '<h3 class="text-sm font-semibold text-slate-100 group-hover:text-red-400 transition line-clamp-2 leading-snug" title="' + v.title.replace(/"/g, '&quot;') + '">' +
                v.title +
              '</h3>' +
            '</div>' +
            '<div class="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-800/80">' +
              '<span class="truncate max-w-[140px] text-slate-400" title="' + v.sheets.join(', ') + '">' +
                '<i class="fa-solid fa-list-ul text-slate-500 mr-1 text-[10px]"></i>' + v.sheets[0] +
              '</span>' +
              '<div class="flex items-center gap-2">' +
                viewsStr +
                '<a href="https://www.youtube.com/watch?v=' + v.id + '" target="_blank" onclick="event.stopPropagation()" class="hover:text-red-400 p-1" title="在 YouTube 開啟">' +
                  '<i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i>' +
                '</a>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');

      const shownCount = displayItems.length;
      pageInfo.textContent = '顯示 ' + shownCount.toLocaleString() + ' / 共 ' + filteredVideos.length.toLocaleString() + ' 部影片';
      if (shownCount >= filteredVideos.length) {
        loadMoreBtn.classList.add('hidden');
      } else {
        loadMoreBtn.classList.remove('hidden');
      }
    }

    const modal = document.getElementById('player-modal');
    const ytIframe = document.getElementById('yt-iframe');
    const modalTitle = document.getElementById('modal-title');
    const modalCat = document.getElementById('modal-cat');
    const modalSheet = document.getElementById('modal-sheet');
    const modalYtLink = document.getElementById('modal-yt-link');

    function playVideoByIndex(idx) {
      if (idx < 0 || idx >= filteredVideos.length) return;
      currentPlayingIndex = idx;
      const v = filteredVideos[idx];

      modalTitle.textContent = v.title;
      modalCat.textContent = v.mainCat;
      modalSheet.textContent = v.sheets.join(' · ');
      modalYtLink.href = 'https://www.youtube.com/watch?v=' + v.id;
      ytIframe.src = 'https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1&enablejsapi=1';
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function setGalleryYtVolume15() {
      if (!ytIframe || !ytIframe.contentWindow) return;
      ytIframe.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'setVolume', args: [15] }), '*');
    }
    ytIframe.addEventListener('load', () => {
      ytIframe.contentWindow?.postMessage(JSON.stringify({ event: 'listening', id: 'yt-iframe' }), '*');
      [150, 400, 800, 1400].forEach(d => setTimeout(setGalleryYtVolume15, d));
    });
    window.addEventListener('message', (e) => {
      if (typeof e.data === 'string' && (e.data.includes('onReady') || e.data.includes('infoDelivery'))) {
        setGalleryYtVolume15();
      }
    });

    function closeModal() {
      ytIframe.src = '';
      modal.classList.add('hidden');
      document.body.style.overflow = '';
      currentPlayingIndex = -1;
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.getElementById('modal-prev').addEventListener('click', () => {
      if (currentPlayingIndex > 0) playVideoByIndex(currentPlayingIndex - 1);
    });

    document.getElementById('modal-next').addEventListener('click', () => {
      if (currentPlayingIndex < filteredVideos.length - 1) playVideoByIndex(currentPlayingIndex + 1);
    });

    window.addEventListener('keydown', (e) => {
      if (modal.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight' && currentPlayingIndex < filteredVideos.length - 1) playVideoByIndex(currentPlayingIndex + 1);
      if (e.key === 'ArrowLeft' && currentPlayingIndex > 0) playVideoByIndex(currentPlayingIndex - 1);
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.cat-btn').forEach(b => {
          b.className = 'cat-btn px-4 py-2 rounded-xl font-medium transition whitespace-nowrap bg-slate-800 hover:bg-slate-700 text-slate-300';
        });
        btn.className = 'cat-btn px-4 py-2 rounded-xl font-medium transition whitespace-nowrap bg-red-600 text-white shadow-lg shadow-red-600/30';
        currentCategory = btn.dataset.cat;
        updateSheetOptions();
        applyFilters();
      });
    });

    sheetFilter.addEventListener('change', (e) => {
      currentSheet = e.target.value;
      applyFilters();
    });

    sortFilter.addEventListener('change', (e) => {
      sortMode = e.target.value;
      applyFilters();
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearch.classList.toggle('hidden', !searchQuery);
      applyFilters();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearch.classList.add('hidden');
      applyFilters();
    });

    loadMoreBtn.addEventListener('click', () => {
      page++;
      renderGrid();
    });

    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        if (page * pageSize < filteredVideos.length) {
          page++;
          renderGrid();
        }
      }
    });

    updateCounts();
    updateSheetOptions();
    applyFilters();
  </script>
</body>
</html>
