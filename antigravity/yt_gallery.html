      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fef2f2',

  <style>
    body {

    }
    .glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(18, 27, 49, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-card:hover {
      transform: translateY(-4px);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 14px 30px -10px rgba(239, 68, 68, 0.25);
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(239, 68, 68, 0.6);
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

<body class="min-h-screen pb-24 custom-scroll">

  <!-- Top Navigation & Stats Bar -->

    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 via-rose-500 to-amber-500 flex items-center justify-center text-white shadow-lg shadow-red-500/25 shrink-0">
          <i class="fa-brands fa-youtube text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2 flex-wrap">
            YouTube 影音圖庫精選

        </div>
      </div>

      <!-- Quick Metrics -->
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap text-xs">
        <div class="px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/60 flex items-center gap-2">
          <span class="text-slate-400">總影片</span>
          <span class="font-bold text-red-400" id="stat-total">0</span>
        </div>
        <div class="px-3 py-1.5 rounded-lg bg-slate-800/80 border border-slate-700/60 flex items-center gap-2">
          <span class="text-slate-400">當前篩選</span>
          <span class="font-bold text-sky-400" id="stat-filtered">0</span>

        <a href="https://docs.google.com/spreadsheets/d/1xAZ810fin7AY4azNgN-sPr4fuIx0a77ASFOymfvxTXk/edit#gid=1769528515" target="_blank" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition flex items-center gap-1.5">
          <i class="fa-solid fa-table-list text-emerald-400"></i>
          <span>原始 Sheet</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Filter & Controls Section -->
  <div class="max-w-7xl mx-auto px-4 lg:px-8 mt-6 space-y-4">
    <div class="glass rounded-2xl p-4 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
      
      <!-- Search -->
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="search-input" 
          placeholder="搜尋影片標題、播放清單名稱、影片 ID..." 
          class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-10 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 transition-all"
        />
        <button id="clear-search" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 hidden text-sm">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Quick Sub-Category Selector -->
      <div class="flex items-center gap-2">
        <select id="sheet-filter" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-red-500">

        </select>
      </div>
    </div>

      <button data-cat="all" class="cat-btn px-4 py-2 rounded-xl font-medium transition whitespace-nowrap bg-red-600 text-white shadow-lg shadow-red-600/30">
        全部 <span class="text-xs opacity-75" id="pill-all-count"></span>

      <button data-cat="詩歌聖樂" class="cat-btn px-4 py-2 rounded-xl font-medium transition whitespace-nowrap bg-slate-800 hover:bg-slate-700 text-slate-300">

    </div>

      </button>
      <p class="text-xs text-slate-500" id="page-info"></p>

            下一部 <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>
      </div>
    </div>

    // Transform compact data
    const SHEETS = RAW_DATA.sheets;

      sheets: item[3].map(idx => SHEETS[idx]),
      viewCount: item[4] ? Number(item[4]) : 0,

    }));

    // State

    const statTotal = document.getElementById('stat-total');
    const statFiltered = document.getElementById('stat-filtered');

    // Init Sheets select
    SHEETS.forEach(sheet => {
      const opt = document.createElement('option');
      opt.value = sheet;
      opt.textContent = sheet;
      sheetFilter.appendChild(opt);
    });

    // Counts for Category Pills
    function updateCounts() {
      statTotal.textContent = VIDEOS.length.toLocaleString();
      document.getElementById('pill-all-count').textContent = `(${VIDEOS.length})`;
      
      const catCounts = {};
      VIDEOS.forEach(v => {
        catCounts[v.mainCat] = (catCounts[v.mainCat] || 0) + 1;
      });
      if (document.getElementById('pill-worship-count')) document.getElementById('pill-worship-count').textContent = `(${catCounts['詩歌聖樂'] || 0})`;
      if (document.getElementById('pill-bible-count')) document.getElementById('pill-bible-count').textContent = `(${catCounts['聖經靈修'] || 0})`;
      if (document.getElementById('pill-music-count')) document.getElementById('pill-music-count').textContent = `(${catCounts['音樂琴藝'] || 0})`;
      if (document.getElementById('pill-hiking-count')) document.getElementById('pill-hiking-count').textContent = `(${catCounts['健行運動'] || 0})`;
      if (document.getElementById('pill-tech-count')) document.getElementById('pill-tech-count').textContent = `(${catCounts['科技生活'] || 0})`;
    }

    // Apply Filter & Sort
    function applyFilters() {
      filteredVideos = VIDEOS.filter(v => {
        if (currentCategory !== 'all' && v.mainCat !== currentCategory) return false;
        if (currentSheet && !v.sheets.includes(currentSheet)) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchTitle = v.title.toLowerCase().includes(q);
          const matchId = v.id.toLowerCase().includes(q);
          const matchSheet = v.sheets.some(s => s.toLowerCase().includes(q));
          if (!matchTitle && !matchId && !matchSheet) return false;
        }
        return true;
      });

      if (sortMode === 'views_desc') {
        filteredVideos.sort((a, b) => b.viewCount - a.viewCount);
      } else if (sortMode === 'title_asc') {
        filteredVideos.sort((a, b) => a.title.localeCompare(b.title, 'zh-TW'));
      }

      statFiltered.textContent = filteredVideos.length.toLocaleString();
      page = 1;
      renderGrid();
    }

    function formatNumber(num) {
      if (!num) return '';
      if (num >= 10000) return (num / 10000).toFixed(1) + '萬';
      return num.toLocaleString();
    }

        const memberBadge = v.isMembersOnly ? `<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 text-[10px] font-bold">會員</span>` : '';
        
        return `

              <div class="flex items-center justify-between text-xs text-slate-400 pt-1 border-t border-slate-800/80">

    function playVideoByIndex(idx) {
      if (idx < 0 || idx >= filteredVideos.length) return;
      currentPlayingIndex = idx;

      modalTitle.textContent = v.title;

    }

    function closeModal() {
      ytIframe.src = '';
      modal.classList.add('hidden');
      document.body.style.overflow = '';
      currentPlayingIndex = -1;
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.getElementById('modal-prev').addEventListener('click', () => {
      if (currentPlayingIndex > 0) {
        playVideoByIndex(currentPlayingIndex - 1);
      }
    });

    document.getElementById('modal-next').addEventListener('click', () => {
      if (currentPlayingIndex < filteredVideos.length - 1) {
        playVideoByIndex(currentPlayingIndex + 1);
      }
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (modal.classList.contains('hidden')) return;
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight' && currentPlayingIndex < filteredVideos.length - 1) playVideoByIndex(currentPlayingIndex + 1);
      if (e.key === 'ArrowLeft' && currentPlayingIndex > 0) playVideoByIndex(currentPlayingIndex - 1);
    });

    sortFilter.addEventListener('change', (e) => {
      sortMode = e.target.value;
      applyFilters();
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearSearch.classList.toggle('hidden', !searchQuery);
      applyFilters();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearch.classList.add('hidden');
      applyFilters();
    });

    loadMoreBtn.addEventListener('click', () => {
      page++;
      renderGrid();
    });

    // Infinite scroll trigger when reaching bottom
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        if (page * pageSize < filteredVideos.length) {
          page++;
          renderGrid();
        }
      }
    });

    // Startup
    updateCounts();
    applyFilters();
  </script>
</body>
</html>
