<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經 200 位核心人物中英對照與事蹟速查海報｜200 Bible Figures</title>
<style>
  :root {
    --bg-cream: #F6F1E3;
    --card-bg: #FCF9F2;
    --navy: #142B44;
    --navy-light: #2A4766;
    --gold: #DFB14B;
    --gold-dark: #B58723;
    --border-navy: #243B55;
    --text-main: #182C42;
    --text-sub: #47586B;
    --accent-green: #5B8C5A;
    --accent-red: #C85A48;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-cream);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", serif;
    line-height: 1.45;
    padding: 20px 16px 60px;
  }

  /* 頂部控制與搜尋列 (列印時自動隱藏) */
  .toolbar {
    max-width: 1380px;
    margin: 0 auto 22px;
    background: #FFFFFF;
    border: 2px solid var(--border-navy);
    border-radius: 16px;
    padding: 16px 20px;
    box-shadow: 0 8px 24px rgba(20, 43, 68, 0.08);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }

  .search-box {
    flex: 1 1 300px;
    position: relative;
  }

  .search-box input {
    width: 100%;
    padding: 11px 16px 11px 40px;
    font-size: 15px;
    border: 1.5px solid #CBD5E1;
    border-radius: 10px;
    outline: none;
    transition: all 0.2s;
    background: #F8FAFC;
    color: var(--navy);
  }

  .search-box input:focus {
    border-color: var(--navy);
    background: #FFF;
    box-shadow: 0 0 0 3px rgba(20, 43, 68, 0.12);
  }

  .search-box .search-icon {
    position: absolute;
    left: 13px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    pointer-events: none;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .btn {
    padding: 8px 14px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 999px;
    border: 1.5px solid var(--border-navy);
    background: var(--card-bg);
    color: var(--navy);
    cursor: pointer;
    transition: all 0.18s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn:hover {
    background: #EAE2CE;
  }

  .btn.active {
    background: var(--navy);
    color: #FFF;
  }

  .btn-gold {
    background: var(--gold);
    border-color: var(--gold-dark);
    color: var(--navy);
    font-weight: 700;
  }

  .btn-gold:hover {
    background: #D2A138;
  }

  .stats-badge {
    font-size: 13px;
    color: var(--text-sub);
    font-weight: 600;
    padding: 4px 10px;
    background: #EFE9D8;
    border-radius: 8px;
  }

  /* 海報主容器 (復刻 @dgifilms 4 欄圓角長卡排版) */
  .poster-sheet {
    max-width: 1380px;
    margin: 0 auto 36px;
    background: var(--bg-cream);
    border: 2.5px solid var(--navy);
    border-radius: 22px;
    padding: 28px 24px 22px;
    box-shadow: 0 12px 32px rgba(20, 43, 68, 0.1);
    position: relative;
  }

  .poster-header {
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }

  .leaf-deco {
    font-size: 38px;
    line-height: 1;
    user-select: none;
  }

  .poster-title-wrap h1 {
    font-family: Georgia, "Noto Serif TC", "Songti TC", serif;
    font-size: 38px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .poster-subtitle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-family: Georgia, "Noto Serif TC", serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--navy-light);
  }

  .poster-subtitle::before,
  .poster-subtitle::after {
    content: "";
    height: 2px;
    width: 72px;
    background: var(--gold);
    display: inline-block;
  }

  /* 4 欄圓角長卡 Grid */
  .columns-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  .poster-column {
    background: var(--card-bg);
    border: 1.8px solid var(--border-navy);
    border-radius: 16px;
    padding: 22px 12px 12px;
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .col-pill {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: var(--navy);
    font-weight: 800;
    font-size: 15px;
    padding: 3px 22px;
    border-radius: 999px;
    border: 1.5px solid var(--gold-dark);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    white-space: nowrap;
  }

  /* 單一人物條目 */
  .figure-item {
    display: grid;
    grid-template-columns: 28px 32px 1fr;
    align-items: center;
    gap: 6px;
    padding: 5px 7px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 1px solid transparent;
  }

  .figure-item:hover {
    background: #FFFDF7;
    border-color: var(--gold);
    transform: translateX(3px);
    box-shadow: 0 3px 10px rgba(20, 43, 68, 0.08);
  }

  .fig-num {
    font-size: 12px;
    font-weight: 800;
    color: var(--navy-light);
    text-align: right;
    padding-right: 3px;
    font-variant-numeric: tabular-nums;
  }

  .fig-icon {
    font-size: 23px;
    line-height: 1;
    text-align: center;
    user-select: none;
  }

  .fig-info {
    min-width: 0;
  }

  .fig-name-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }

  .fig-zh-name {
    font-weight: 800;
    font-size: 14.5px;
    color: var(--navy);
  }

  .fig-en-name {
    font-family: Georgia, serif;
    font-weight: 700;
    font-size: 12.5px;
    color: #3D556E;
  }

  .fig-desc-zh {
    font-size: 12.2px;
    color: var(--text-main);
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fig-desc-en {
    font-size: 11px;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .fig-ref-tag {
    display: inline-block;
    font-size: 10.5px;
    color: #8A620A;
    background: #F9EBC8;
    padding: 0 6px;
    border-radius: 4px;
    font-weight: 700;
    margin-left: auto;
  }

  .poster-footer {
    margin-top: 16px;
    text-align: center;
    font-size: 12.5px;
    color: var(--text-sub);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .color-squares {
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .sq {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    display: inline-block;
  }

  /* 搜尋篩選結果視圖 (當非標準 100+100 雙海報模式時) */
  .search-results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 12px;
  }

  .search-results-grid .figure-item {
    background: var(--card-bg);
    border: 1.5px solid #D8CZA8;
    border-color: rgba(20, 43, 68, 0.2);
    padding: 10px 12px;
  }

  .search-results-grid .fig-desc-zh,
  .search-results-grid .fig-desc-en {
    white-space: normal;
  }

  /* 彈出式經文與靈修卡片 Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 29, 46, 0.62);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-card {
    background: var(--card-bg);
    border: 3px solid var(--navy);
    border-radius: 20px;
    max-width: 580px;
    width: 100%;
    padding: 26px 26px 22px;
    box-shadow: 0 24px 48px rgba(0,0,0,0.28);
    position: relative;
    animation: popIn 0.18s ease-out;
  }

  @keyframes popIn {
    from { transform: scale(0.94); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--navy);
    background: #FFF;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    color: var(--navy);
  }

  .modal-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
    padding-right: 36px;
  }

  .modal-icon {
    font-size: 48px;
    width: 72px;
    height: 72px;
    background: #EFE8D4;
    border: 2px solid var(--gold-dark);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .modal-badges {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 999px;
  }

  .badge-num {
    background: var(--navy);
    color: #FFF;
  }

  .badge-era {
    background: var(--gold);
    color: var(--navy);
  }

  .modal-title {
    font-size: 24px;
    font-weight: 800;
    color: var(--navy);
  }

  .modal-title span {
    font-family: Georgia, serif;
    font-size: 18px;
    color: var(--text-sub);
    font-weight: 600;
    margin-left: 6px;
  }

  .modal-section {
    background: #FFF;
    border: 1.5px solid #E2D9C3;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }

  .modal-section-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--gold-dark);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  .modal-verse {
    font-family: "Noto Serif TC", Georgia, serif;
    font-size: 16px;
    color: var(--navy);
    line-height: 1.65;
    border-left: 4px solid var(--gold);
    padding-left: 12px;
    margin-top: 6px;
  }

  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
    justify-content: space-between;
  }

  .modal-nav-btns {
    display: flex;
    gap: 8px;
  }

  /* 響應式設計 */
  @media (max-width: 1100px) {
    .columns-grid {
      grid-template-columns: repeat(2, 1fr);
      row-gap: 24px;
    }
  }

  @media (max-width: 640px) {
    .columns-grid {
      grid-template-columns: 1fr;
    }
    .poster-title-wrap h1 {
      font-size: 26px;
    }
  }

  /* A4 滿版雙頁海報列印專用樣式 */
  @page {
    size: A4 portrait;
    margin: 7mm 7mm;
  }

  @media print {
    body {
      padding: 0;
      background: var(--bg-cream) !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .toolbar,
    .modal-backdrop,
    .no-print {
      display: none !important;
    }
    .poster-sheet {
      max-width: 100%;
      margin: 0;
      padding: 10px 10px 8px;
      border-width: 1.8px;
      border-radius: 12px;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .poster-sheet:last-of-type {
      page-break-after: auto;
      break-after: auto;
    }
    .poster-header {
      margin-bottom: 14px;
    }
    .poster-title-wrap h1 {
      font-size: 22px;
    }
    .poster-subtitle {
      font-size: 12px;
    }
    .columns-grid {
      grid-template-columns: repeat(4, 1fr) !important;
      gap: 7px !important;
    }
    .poster-column {
      padding: 13px 5px 5px;
      gap: 1.5px;
      border-radius: 10px;
    }
    .col-pill {
      font-size: 10px;
      padding: 1px 12px;
      top: -9px;
    }
    .figure-item {
      grid-template-columns: 18px 18px 1fr;
      gap: 3px;
      padding: 1.5px 3px;
    }
    .fig-num {
      font-size: 8.2px;
    }
    .fig-icon {
      font-size: 13px;
    }
    .fig-zh-name {
      font-size: 9.5px;
    }
    .fig-en-name {
      font-size: 8px;
    }
    .fig-desc-zh {
      font-size: 8px;
    }
    .fig-desc-en,
    .fig-ref-tag {
      display: none !important;
    }
    .poster-footer {
      margin-top: 6px;
      font-size: 8.5px;
    }
  }
</style>
</head>
<body>

<!-- 頂部互動控制列 -->
<div class="toolbar no-print">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜尋 200 位聖經人物（例：大衛、David、方舟、士師、以賽亞、040）..." autocomplete="off">
  </div>
  <div class="filter-group">
    <button class="btn active" data-filter="all" onclick="setFilter('all')">📜 雙海報全覽 (200)</button>
    <button class="btn" data-filter="page1" onclick="setFilter('page1')">第 1 頁 (1–100)</button>
    <button class="btn" data-filter="page2" onclick="setFilter('page2')">第 2 頁 (101–200)</button>
    <button class="btn" data-filter="舊約" onclick="setFilter('舊約')">🕎 舊約人物</button>
    <button class="btn" data-filter="新約" onclick="setFilter('新約')">✝️ 新約人物</button>
    <button class="btn" onclick="openRandomFigure()">🎲 隨機抽靈修人物</button>
    <button class="btn btn-gold" onclick="printPoster()">🖨️ 列印 / 存 A4 PDF</button>
  </div>
  <span class="stats-badge" id="statsBadge">顯示 200 / 200 位人物（點擊任一人物可看經文）</span>
</div>

<!-- 海報內容容器 -->
<div id="posterContainer"></div>

<!-- 點擊人物彈出經文靈修 Modal -->
<div class="modal-backdrop" id="figureModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <button class="modal-close" onclick="closeModal()" title="關閉">✕</button>
    <div class="modal-header">
      <div class="modal-icon" id="mIcon">✝️</div>
      <div>
        <div class="modal-badges">
          <span class="badge badge-num" id="mNum">#001</span>
          <span class="badge badge-era" id="mEra">舊約・族長時代</span>
        </div>
        <div class="modal-title" id="mTitle">亞當 <span>Adam</span></div>
      </div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">📌 核心代表事蹟 (What They're Known For)</div>
      <div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px;" id="mDescZh"></div>
      <div style="font-size:13.5px;color:var(--text-sub);font-family:Georgia,serif;" id="mDescEn"></div>
    </div>

    <div class="modal-section">
      <div class="modal-section-label">📖 代表經文與鑰節 (<span id="mRef"></span>)</div>
      <div class="modal-verse" id="mVerse"></div>
    </div>

    <div class="modal-actions">
      <div class="modal-nav-btns">
        <button class="btn" onclick="navModal(-1)">⬅️ 上一位</button>
        <button class="btn" onclick="navModal(1)">下一位 ➡️</button>
      </div>
      <div style="display:flex;gap:8px;">
        <a id="mFhlLink" href="#" target="_blank" rel="noopener" class="btn btn-gold" style="text-decoration:none;">📚 信望愛查經</a>
        <a id="mBgLink" href="#" target="_blank" rel="noopener" class="btn" style="text-decoration:none;">🌐 中英對照經文</a>
      </div>
    </div>
  </div>
</div>

<script>
const FIGURES = [{"id": 1, "icon": "🌍", "en_name": "Adam", "zh_name": "亞當", "en_desc": "First man", "zh_desc": "人類始祖（第一位男人）", "ref": "創世記 1:27; 2:7", "era": "舊約・原初時代", "testament": "舊約", "verse": "耶和華神用地上的塵土造人，將生氣吹在他鼻孔裡，他就成了有靈的活人，名叫亞當。", "page": 1, "col": 1}, {"id": 2, "icon": "🍎", "en_name": "Eve", "zh_name": "夏娃", "en_desc": "First woman", "zh_desc": "眾生之母（第一位女人）", "ref": "創世記 3:20", "era": "舊約・原初時代", "testament": "舊約", "verse": "亞當給他妻子起名叫夏娃，因為她是眾生之母。", "page": 1, "col": 1}, {"id": 3, "icon": "🚢", "en_name": "Noah", "zh_name": "挪亞", "en_desc": "Ark builder", "zh_desc": "建造方舟者", "ref": "創世記 6:9, 22", "era": "舊約・原初時代", "testament": "舊約", "verse": "挪亞是個義人，在當時的世代是個完全人。挪亞與神同行；凡神所吩咐他的，他都照樣行了。", "page": 1, "col": 1}, {"id": 4, "icon": "⭐", "en_name": "Abraham", "zh_name": "亞伯拉罕", "en_desc": "Man of faith", "zh_desc": "信心之父", "ref": "創世記 12:1-3; 15:6", "era": "舊約・族長時代", "testament": "舊約", "verse": "亞伯蘭信耶和華，耶和華就以此為他的義。地上萬族都要因你得福。", "page": 1, "col": 1}, {"id": 5, "icon": "🏺", "en_name": "Sarah", "zh_name": "撒拉", "en_desc": "Mother of Isaac", "zh_desc": "以撒之母", "ref": "創世記 17:15-16; 21:1-3", "era": "舊約・族長時代", "testament": "舊約", "verse": "我必賜福給她，也要使你從她得一個兒子。她必作多國之母，必有百姓的君王從她而出。", "page": 1, "col": 1}, {"id": 6, "icon": "🐑", "en_name": "Isaac", "zh_name": "以撒", "en_desc": "Son of promise", "zh_desc": "應許之子", "ref": "創世記 22:2; 26:2-5", "era": "舊約・族長時代", "testament": "舊約", "verse": "你帶著你的兒子，就是你獨生的兒子，你所愛的以撒，往摩利亞地去。", "page": 1, "col": 1}, {"id": 7, "icon": "🪜", "en_name": "Jacob", "zh_name": "雅各", "en_desc": "Father of Israel's tribes", "zh_desc": "以色列十二支派之父", "ref": "創世記 28:12-15; 32:28", "era": "舊約・族長時代", "testament": "舊約", "verse": "你的名不要再叫雅各，要叫以色列；因為你與神與人較力，都得了勝。", "page": 1, "col": 1}, {"id": 8, "icon": "🧥", "en_name": "Joseph", "zh_name": "約瑟", "en_desc": "Second to Pharaoh", "zh_desc": "埃及宰相（一人之下、萬人之上）", "ref": "創世記 41:39-41; 50:20", "era": "舊約・族長時代", "testament": "舊約", "verse": "從前你們的意思是要害我，但神的意思原是好的，要保全許多人的性命，成就今日的光景。", "page": 1, "col": 1}, {"id": 9, "icon": "🌊", "en_name": "Moses", "zh_name": "摩西", "en_desc": "Exodus leader", "zh_desc": "出埃及領袖", "ref": "出埃及記 3:10; 14:13-14", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "摩西對百姓說：「不要懼怕，只管站住！看耶和華今天向你們所要施行的救恩。」", "page": 1, "col": 1}, {"id": 10, "icon": "🕎", "en_name": "Aaron", "zh_name": "亞倫", "en_desc": "First high priest", "zh_desc": "第一任大祭司", "ref": "出埃及記 28:1; 民數記 6:24-26", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "願耶和華賜福給你，保護你。願耶和華使祂的臉光照你，賜恩給你。", "page": 1, "col": 1}, {"id": 11, "icon": "🪘", "en_name": "Miriam", "zh_name": "米利暗", "en_desc": "Prophetess", "zh_desc": "女先知（摩西的姊姊）", "ref": "出埃及記 15:20-21", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "亞倫的姊姊女先知米利暗手裡拿著鼓；眾婦女也跟她出去拿鼓跳舞，歌頌耶和華。", "page": 1, "col": 1}, {"id": 12, "icon": "⛰️", "en_name": "Joshua", "zh_name": "約書亞", "en_desc": "Led Israel into Canaan", "zh_desc": "帶領以色列人進入迦南地", "ref": "約書亞記 1:9; 24:15", "era": "舊約・征服迦南", "testament": "舊約", "verse": "你當剛強壯膽！不要懼怕，也不要驚惶……至於我和我家，我們必定事奉耶和華。", "page": 1, "col": 1}, {"id": 13, "icon": "🍇", "en_name": "Caleb", "zh_name": "迦勒", "en_desc": "Faithful spy", "zh_desc": "專一跟從上帝的忠心探子", "ref": "民數記 14:24; 約書亞記 14:11-12", "era": "舊約・征服迦南", "testament": "舊約", "verse": "惟獨我的僕人迦勒，因他另有一個心志，專一跟從我，我就把他領進他所去過的那地。", "page": 1, "col": 1}, {"id": 14, "icon": "🌴", "en_name": "Deborah", "zh_name": "底波拉", "en_desc": "Judge & prophetess", "zh_desc": "士師兼女先知", "ref": "士師記 4:4-5; 5:7", "era": "舊約・士師時代", "testament": "舊約", "verse": "有一位女先知，是拉比多的妻底波拉，當時作以色列的士師，直到我底波拉興起，作以色列的母。", "page": 1, "col": 1}, {"id": 15, "icon": "🎺", "en_name": "Gideon", "zh_name": "基甸", "en_desc": "Defeated Midian", "zh_desc": "率三百勇士擊敗米甸人", "ref": "士師記 6:12; 7:7", "era": "舊約・士師時代", "testament": "舊約", "verse": "耶和華的使者向基甸顯現，對他說：「大能的勇士啊，耶和華與你同在！」", "page": 1, "col": 1}, {"id": 16, "icon": "💪", "en_name": "Samson", "zh_name": "參孫", "en_desc": "Great strength", "zh_desc": "擁有超凡力氣的士師", "ref": "士師記 16:28-30", "era": "舊約・士師時代", "testament": "舊約", "verse": "參孫求告耶和華說：「主耶和華啊，求你眷念我。神啊，求你賜我這一次的力量！」", "page": 1, "col": 1}, {"id": 17, "icon": "🌾", "en_name": "Ruth", "zh_name": "路得", "en_desc": "Loyal & faithful", "zh_desc": "忠貞賢德的摩押女子", "ref": "路得記 1:16", "era": "舊約・士師時代", "testament": "舊約", "verse": "路得說：「不要催我回去不跟隨你。你往哪裡去，我也往那裡去；你的國就是我的國，你的神就是我的神。」", "page": 1, "col": 1}, {"id": 18, "icon": "🙏", "en_name": "Hannah", "zh_name": "哈拿", "en_desc": "Mother of Samuel", "zh_desc": "迫切禱告求子的撒母耳之母", "ref": "撒母耳記上 1:27-28; 2:1-2", "era": "舊約・士師至王國", "testament": "舊約", "verse": "我祈求為要得這孩子；耶和華已將我所求的賜給我了。所以我將這孩子歸與耶和華。", "page": 1, "col": 1}, {"id": 19, "icon": "👂", "en_name": "Samuel", "zh_name": "撒母耳", "en_desc": "Prophet & judge", "zh_desc": "聆聽上帝聲音的先知與最後一位士師", "ref": "撒母耳記上 3:10; 7:12", "era": "舊約・士師至王國", "testament": "舊約", "verse": "撒母耳說：「請說，僕人敬聽！」……撒母耳給石頭起名叫以便以謝，說：「到如今耶和華都幫助我們。」", "page": 1, "col": 1}, {"id": 20, "icon": "🪨", "en_name": "David", "zh_name": "大衛", "en_desc": "King & giant-slayer", "zh_desc": "合神心意的以色列王、擊殺巨人歌利亞", "ref": "撒母耳記上 17:45; 詩篇 23:1", "era": "舊約・聯合王國", "testament": "舊約", "verse": "你來攻擊我，是靠著刀槍和銅戟；我來攻擊你，是靠著萬軍之耶和華的名！耶和華是我的牧者，我必不致缺乏。", "page": 1, "col": 1}, {"id": 21, "icon": "⚖️", "en_name": "Solomon", "zh_name": "所羅門", "en_desc": "Wisdom", "zh_desc": "以絕頂智慧與建造聖殿聞名的君王", "ref": "列王紀上 3:9, 12; 8:27", "era": "舊約・聯合王國", "testament": "舊約", "verse": "求你賜我智慧，可以判斷你的民，能辨別是非……我就應允你所求的，賜你聰明智慧。", "page": 1, "col": 1}, {"id": 22, "icon": "🔥", "en_name": "Elijah", "zh_name": "以利亞", "en_desc": "Called down fire", "zh_desc": "迦密山上求神降火的大先知", "ref": "列王紀上 18:36-39", "era": "舊約・分裂王國", "testament": "舊約", "verse": "耶和華的火降下來，燒盡燔祭、木柴、石頭、塵土……眾民看見了，就俯伏在地說：「耶和華是神！」", "page": 1, "col": 1}, {"id": 23, "icon": "🫙", "en_name": "Elisha", "zh_name": "以利沙", "en_desc": "Elijah's successor", "zh_desc": "以利亞的繼承人、行多項神蹟", "ref": "列王紀下 2:9, 14; 6:16", "era": "舊約・分裂王國", "testament": "舊約", "verse": "以利沙說：「願感動你的靈加倍地感動我。」……不要懼怕！與我們同在的比與他們同在的更多。", "page": 1, "col": 1}, {"id": 24, "icon": "🪶", "en_name": "Isaiah", "zh_name": "以賽亞", "en_desc": "Messianic prophet", "zh_desc": "預言彌賽亞受苦與榮耀的先知", "ref": "以賽亞書 6:8; 9:6; 53:5", "era": "舊約・王國與先知", "testament": "舊約", "verse": "我又聽見主的聲音說：「我可以差遣誰呢？」我說：「我在這裡，請差遣我！」因祂受的刑罰，我們得平安。", "page": 1, "col": 1}, {"id": 25, "icon": "💧", "en_name": "Jeremiah", "zh_name": "耶利米", "en_desc": "Weeping prophet", "zh_desc": "流淚的先知", "ref": "耶利米書 1:5; 29:11; 哀歌 3:22-23", "era": "舊約・被擄前夕", "testament": "舊約", "verse": "耶和華的慈愛永不斷絕，祂的憐憫永不止息；每早晨這都是新的；你的誠實極其廣大！", "page": 1, "col": 1}, {"id": 26, "icon": "🦁", "en_name": "Daniel", "zh_name": "但以理", "en_desc": "Lions' den", "zh_desc": "在獅子坑中蒙神保守的先知", "ref": "但以理書 6:22", "era": "舊約・被擄時期", "testament": "舊約", "verse": "我的神差遣使者，封住獅子的口，叫獅子不傷我；因我在神面前無辜。", "page": 1, "col": 2}, {"id": 27, "icon": "👑", "en_name": "Esther", "zh_name": "以斯帖", "en_desc": "Saved her people", "zh_desc": "冒死進見拯救猶太同胞的王后", "ref": "以斯帖記 4:14-16", "era": "舊約・波斯時期", "testament": "舊約", "verse": "焉知你得了王后的位分，不是為現今的機會嗎？……我若死就死吧！", "page": 1, "col": 2}, {"id": 28, "icon": "⛈️", "en_name": "Job", "zh_name": "約伯", "en_desc": "Faith in suffering", "zh_desc": "在極大苦難中仍持守信仰的義人", "ref": "約伯記 1:21; 19:25; 42:5", "era": "舊約・智慧文學", "testament": "舊約", "verse": "我知道我的救贖主活著，末了必站立在地上。我從前風聞有你，現在親眼看見你。", "page": 1, "col": 2}, {"id": 29, "icon": "🐋", "en_name": "Jonah", "zh_name": "約拿", "en_desc": "Great fish", "zh_desc": "被大魚吞入腹中三日三夜的先知", "ref": "約拿書 1:17; 2:9", "era": "舊約・分裂王國", "testament": "舊約", "verse": "耶和華安排一條大魚吞了約拿，約拿在魚腹中三日三夜……救恩出於耶和華！", "page": 1, "col": 2}, {"id": 30, "icon": "🏞️", "en_name": "John the Baptist", "zh_name": "施洗約翰", "en_desc": "Prepared the way", "zh_desc": "在曠野為主預備道路的開路先鋒", "ref": "約翰福音 1:23, 29; 3:30", "era": "新約・福音時期", "testament": "新約", "verse": "看哪，神的羔羊，除去世人罪孽的！祂必興旺，我必衰微。", "page": 1, "col": 2}, {"id": 31, "icon": "🗝️", "en_name": "Peter", "zh_name": "彼得", "en_desc": "Pentecost preacher", "zh_desc": "五旬節剛強講道的使徒領袖", "ref": "馬太福音 16:16; 使徒行傳 2:38", "era": "新約・福音與初代教會", "testament": "新約", "verse": "西門彼得回答說：「你是基督，是永生神的兒子。」你們各人要悔改，奉耶穌基督的名受洗。", "page": 1, "col": 2}, {"id": 32, "icon": "🦅", "en_name": "John (the Apostle)", "zh_name": "使徒約翰", "en_desc": "Apostle & writer", "zh_desc": "耶穌所愛的門徒、約翰福音與啟示錄作者", "ref": "約翰福音 20:31; 約翰一書 4:8", "era": "新約・福音與初代教會", "testament": "新約", "verse": "但記這些事要叫你們信耶穌是基督，是神的兒子，並且叫你們信了祂，就可以因祂的名得生命。", "page": 1, "col": 2}, {"id": 33, "icon": "✉️", "en_name": "Paul", "zh_name": "保羅", "en_desc": "Apostle to the Gentiles", "zh_desc": "外邦人的使徒、撰寫多封新約書信", "ref": "羅馬書 1:16; 加拉太書 2:20", "era": "新約・使徒宣教", "testament": "新約", "verse": "我不以福音為恥；這福音本是神的大能，要救一切相信的。現在活著的不再是我，乃是基督在我裡面活著。", "page": 1, "col": 2}, {"id": 34, "icon": "🌷", "en_name": "Mary", "zh_name": "馬利亞", "en_desc": "Mother of Jesus", "zh_desc": "耶穌的母親", "ref": "路加福音 1:38, 46-47", "era": "新約・福音時期", "testament": "新約", "verse": "馬利亞說：「我是主的使女，情願照你的話成就在我身上。」我心尊主為大，我靈以神我的救主為樂。", "page": 1, "col": 2}, {"id": 35, "icon": "🍲", "en_name": "Martha", "zh_name": "馬大", "en_desc": "Served Jesus", "zh_desc": "殷勤款待服事耶穌的姊姊", "ref": "路加福音 10:38-41; 約翰福音 11:27", "era": "新約・福音時期", "testament": "新約", "verse": "馬大對耶穌說：「主啊，是的，我信你是基督，是神的兒子，就是那要臨到世界的。」", "page": 1, "col": 2}, {"id": 36, "icon": "🪦", "en_name": "Lazarus", "zh_name": "拉撒路", "en_desc": "Raised by Jesus", "zh_desc": "死後四天被耶穌叫出墳墓復活的人", "ref": "約翰福音 11:43-44", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌大聲呼叫說：「拉撒路出來！」那死人就出來了。", "page": 1, "col": 2}, {"id": 37, "icon": "🌅", "en_name": "Mary Magdalene", "zh_name": "抹大拉的馬利亞", "en_desc": "Witness to the risen Christ", "zh_desc": "第一位見證復活基督的婦女", "ref": "約翰福音 20:16, 18", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌說：「馬利亞。」馬利亞就轉過來……去告訴門徒說：「我已經看見了主！」", "page": 1, "col": 2}, {"id": 38, "icon": "💰", "en_name": "Judas Iscariot", "zh_name": "加略人猶大", "en_desc": "Betrayed Jesus", "zh_desc": "為三十塊錢出賣耶穌的門徒", "ref": "馬太福音 26:14-15; 路加福音 22:48", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌對他說：「猶大！你用親嘴的暗號賣人子嗎？」", "page": 1, "col": 2}, {"id": 39, "icon": "🌿", "en_name": "Stephen", "zh_name": "司提反", "en_desc": "First Christian martyr", "zh_desc": "教會歷史上第一位殉道者", "ref": "使徒行傳 7:55-60", "era": "新約・初代教會", "testament": "新約", "verse": "但司提反被聖靈充滿，定睛望天，看見神的榮耀，又看見耶穌站在神的右邊……說：「主啊，不要將這罪歸於他們！」", "page": 1, "col": 2}, {"id": 40, "icon": "✝️", "en_name": "Jesus Christ", "zh_name": "耶穌基督", "en_desc": "Savior of the world", "zh_desc": "世人的救主、上帝的兒子", "ref": "約翰福音 3:16; 14:6", "era": "新約・救贖中心", "testament": "新約", "verse": "耶穌說：「我就是道路、真理、生命；若不藉著我，沒有人能到父那裡去。」", "page": 1, "col": 2}, {"id": 41, "icon": "🌙", "en_name": "Nicodemus", "zh_name": "尼哥底母", "en_desc": "Sought Jesus by night", "zh_desc": "夜裡拜訪耶穌探討重生之道的法利賽人", "ref": "約翰福音 3:1-3; 19:39", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌回答說：「我實實在在地告訴你，人若不重生，就不能見神的國。」", "page": 1, "col": 2}, {"id": 42, "icon": "🏺", "en_name": "Joseph of Arimathea", "zh_name": "亞利馬太的約瑟", "en_desc": "Gave his tomb", "zh_desc": "獻出自己新墳墓安葬耶穌的尊貴議員", "ref": "路加福音 23:50-53", "era": "新約・福音時期", "testament": "新約", "verse": "有一個人名叫約瑟，是個議士，為人善良公義……去見彼拉多，求耶穌的身體，安放在石頭鑿成的墳墓裡。", "page": 1, "col": 2}, {"id": 43, "icon": "🏛️", "en_name": "Zacchaeus", "zh_name": "撒該", "en_desc": "Met Jesus; was changed", "zh_desc": "爬上桑樹遇見耶穌、生命翻轉的稅吏長", "ref": "路加福音 19:5-10", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌對他說：「撒該，快下來！今天我必住在你家裡。」……人子來，為要尋找、拯救失喪的人。", "page": 1, "col": 2}, {"id": 44, "icon": "🪖", "en_name": "Cornelius", "zh_name": "哥尼流", "en_desc": "Key early Gentile convert", "zh_desc": "早期歸信基督並領受聖靈的羅馬百夫長", "ref": "使徒行傳 10:1-4, 44", "era": "新約・初代教會", "testament": "新約", "verse": "在凱撒利亞有一個人，名叫哥尼流，是義大利營的百夫長，是個虔誠人……你的禱告和你的賙濟達到神面前，已蒙記念了。", "page": 1, "col": 2}, {"id": 45, "icon": "👁️", "en_name": "Ananias", "zh_name": "亞拿尼亞（大馬士革）", "en_desc": "Helped Saul see", "zh_desc": "奉差遣為掃羅（保羅）按手使他重見光明", "ref": "使徒行傳 9:15-18", "era": "新約・初代教會", "testament": "新約", "verse": "亞拿尼亞就去了，進入那家，把手按在掃羅身上說：「兄弟掃羅，在你來的路上向你顯現的主耶穌，打發我來，叫你能看見，又被聖靈充滿。」", "page": 1, "col": 2}, {"id": 46, "icon": "🙋‍♀️", "en_name": "Leah", "zh_name": "利亞", "en_desc": "Mother of Judah & Levi", "zh_desc": "雅各之妻、猶大與利未等支派之母", "ref": "創世記 29:35; 49:31", "era": "舊約・族長時代", "testament": "舊約", "verse": "她又懷孕生子，說：「這回我要讚美耶和華」，因此給他起名叫猶大。", "page": 1, "col": 2}, {"id": 47, "icon": "🪣", "en_name": "Rachel", "zh_name": "拉結", "en_desc": "Mother of Joseph & Benjamin", "zh_desc": "雅各深愛之妻、約瑟與便雅憫之母", "ref": "創世記 29:18; 30:22-24", "era": "舊約・族長時代", "testament": "舊約", "verse": "神顧念拉結，應允了她，使她能生育。她就懷孕生子，起名叫約瑟。", "page": 1, "col": 2}, {"id": 48, "icon": "🌺", "en_name": "Reuben", "zh_name": "流便（呂便）", "en_desc": "Eldest son of Jacob", "zh_desc": "雅各的長子", "ref": "創世記 29:32; 37:21-22", "era": "舊約・族長時代", "testament": "舊約", "verse": "利亞懷孕生子，就給他起名叫流便（就是有兒子的意思），因為她說：「耶和華看見我的苦情。」", "page": 1, "col": 2}, {"id": 49, "icon": "⚔️", "en_name": "Simeon", "zh_name": "西緬（雅各次子）", "en_desc": "Avenged Dinah", "zh_desc": "為妹底拿報仇的雅各次子", "ref": "創世記 29:33; 34:25", "era": "舊約・族長時代", "testament": "舊約", "verse": "她又懷孕生子，說：「耶和華因為聽見我失寵，所以又賜給我這個兒子」，於是給他起名叫西緬。", "page": 1, "col": 2}, {"id": 50, "icon": "🕯️", "en_name": "Levi", "zh_name": "利未", "en_desc": "Ancestor of the priestly tribe", "zh_desc": "祭司支派利未人的先祖", "ref": "創世記 29:34; 民數記 3:6", "era": "舊約・族長時代", "testament": "舊約", "verse": "你使利未支派近前來，站在祭司亞倫面前好服事他。", "page": 1, "col": 2}, {"id": 51, "icon": "👑", "en_name": "Judah", "zh_name": "猶大（雅各四子）", "en_desc": "Ancestor of King David", "zh_desc": "大衛王與彌賽亞君王支派的先祖", "ref": "創世記 49:8-10; 啟示錄 5:5", "era": "舊約・族長時代", "testament": "舊約", "verse": "猶大啊，你弟兄們必讚美你……圭必不離猶大，杖必不離他兩腳之間，直等細羅（彌賽亞）來到。", "page": 1, "col": 3}, {"id": 52, "icon": "⏳", "en_name": "Issachar", "zh_name": "以薩迦", "en_desc": "Jacob & Leah's fifth son", "zh_desc": "雅各與利亞的第五子", "ref": "創世記 30:18; 歷代志上 12:32", "era": "舊約・族長時代", "testament": "舊約", "verse": "以薩迦支派，有二百族長都通達時務，知道以色列人所當行的。", "page": 1, "col": 3}, {"id": 53, "icon": "⛵", "en_name": "Zebulun", "zh_name": "西布倫", "en_desc": "Jacob & Leah's sixth son", "zh_desc": "雅各與利亞的第六子（臨海支派）", "ref": "創世記 30:20; 49:13", "era": "舊約・族長時代", "testament": "舊約", "verse": "西布倫必住在海口，必成為停船的海口。", "page": 1, "col": 3}, {"id": 54, "icon": "🍞", "en_name": "Asher", "zh_name": "亞設", "en_desc": "Received abundant blessings", "zh_desc": "承受豐盛美食祝福的支派先祖", "ref": "創世記 30:13; 申命記 33:25", "era": "舊約・族長時代", "testament": "舊約", "verse": "你的門閂是銅的，是鐵的。你的日子如何，你的力量也必如何。", "page": 1, "col": 3}, {"id": 55, "icon": "🐺", "en_name": "Benjamin", "zh_name": "便雅憫", "en_desc": "Youngest son of Jacob", "zh_desc": "雅各最小的兒子", "ref": "創世記 35:18; 申命記 33:12", "era": "舊約・族長時代", "testament": "舊約", "verse": "論便雅憫說：「耶和華所親愛的必同耶和華安然居住；耶和華終日遮蔽他。」", "page": 1, "col": 3}, {"id": 56, "icon": "🏜️", "en_name": "Hagar", "zh_name": "夏甲", "en_desc": "Mother of Ishmael", "zh_desc": "撒拉的使女、以實瑪利之母", "ref": "創世記 16:13", "era": "舊約・族長時代", "testament": "舊約", "verse": "夏甲就稱那對她說話的耶和華為「看顧人的神」。", "page": 1, "col": 3}, {"id": 57, "icon": "🏹", "en_name": "Ishmael", "zh_name": "以實瑪利", "en_desc": "Son of Hagar", "zh_desc": "亞伯拉罕與夏甲所生之子、善射箭", "ref": "創世記 21:17-20", "era": "舊約・族長時代", "testament": "舊約", "verse": "神聽見童子的聲音……神保佑童子，他就漸漸長大，住在曠野，成了弓箭手。", "page": 1, "col": 3}, {"id": 58, "icon": "⛲", "en_name": "Abimelech", "zh_name": "亞比米勒", "en_desc": "King of Gerar", "zh_desc": "與亞伯拉罕、以撒立水井盟約的基拉耳王", "ref": "創世記 21:22-31; 26:28", "era": "舊約・族長時代", "testament": "舊約", "verse": "亞比米勒說：「我們明明地看見耶和華與你同在，便說，不如我們兩下彼此起誓，立約吧！」", "page": 1, "col": 3}, {"id": 59, "icon": "🍷", "en_name": "Melchizedek", "zh_name": "麥基洗德", "en_desc": "King-priest; blessed Abraham", "zh_desc": "撒冷王兼至高神的祭司、為亞伯拉罕祝福", "ref": "創世記 14:18-20; 希伯來書 7:1-3", "era": "舊約・族長時代", "testament": "舊約", "verse": "又有撒冷王麥基洗德帶著餅和酒出來迎接；他是至高神的祭司。他為亞伯蘭祝福。", "page": 1, "col": 3}, {"id": 60, "icon": "🐪", "en_name": "Jethro", "zh_name": "葉忒羅", "en_desc": "Father-in-law of Moses", "zh_desc": "摩西的岳父、建議設立千夫長與百夫長分層治理", "ref": "出埃及記 18:17-23", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "摩西的岳父對他說：「你這做的不好……要從百姓中揀選有才能的人，就是敬畏神、誠實無妄、恨不義之財的人。」", "page": 1, "col": 3}, {"id": 61, "icon": "🧶", "en_name": "Rahab", "zh_name": "喇合", "en_desc": "Helped Israelite spies", "zh_desc": "垂下朱紅線繩保護以色列探子的耶利哥女子", "ref": "約書亞記 2:11, 21; 希伯來書 11:31", "era": "舊約・征服迦南", "testament": "舊約", "verse": "耶和華你們的神本是上天下地的神……妓女喇合因著信，曾和和平平地接待探子，就不與那些不順從的人一同滅亡。", "page": 1, "col": 3}, {"id": 62, "icon": "👠", "en_name": "Boaz", "zh_name": "波阿斯", "en_desc": "Redeemer; married Ruth", "zh_desc": "履行至近親屬贖業責任、迎娶路得的財主", "ref": "路得記 2:12; 4:9-10", "era": "舊約・士師時代", "testament": "舊約", "verse": "願耶和華照你所行的賞賜你。你來投靠耶和華以色列神的翅膀下，願你滿得祂的賞賜。", "page": 1, "col": 3}, {"id": 63, "icon": "👶", "en_name": "Obed", "zh_name": "俄備得", "en_desc": "Grandfather of David", "zh_desc": "波阿斯與路得之子、大衛的祖父", "ref": "路得記 4:14-17", "era": "舊約・士師時代", "testament": "舊約", "verse": "婦人們對拿俄米說：「耶和華是應當稱頌的！因為今日沒有撇下你，使你無至近的親屬。」就給孩子起名叫俄備得，他是耶西的父，耶西是大衛的父。", "page": 1, "col": 3}, {"id": 64, "icon": "🌱", "en_name": "Jesse", "zh_name": "耶西", "en_desc": "Father of David", "zh_desc": "大衛王的父親（耶西的本）", "ref": "撒母耳記上 16:1, 11-13; 以賽亞書 11:1", "era": "舊約・王國時期", "testament": "舊約", "verse": "從耶西的本必發一條；從他根生的枝子必結果實。耶和華的靈必住在他身上。", "page": 1, "col": 3}, {"id": 65, "icon": "🌹", "en_name": "Bathsheba", "zh_name": "拔示巴", "en_desc": "Mother of Solomon", "zh_desc": "大衛之妻、所羅門王的母親", "ref": "撒母耳記下 12:24; 列王紀上 1:28-31", "era": "舊約・聯合王國", "testament": "舊約", "verse": "大衛安慰他的妻拔示巴，與她同寢，她就生了兒子，給他起名叫所羅門。耶和華也喜愛他。", "page": 1, "col": 3}, {"id": 66, "icon": "🐑", "en_name": "Nathan", "zh_name": "拿單", "en_desc": "Confronted King David", "zh_desc": "用母羊羔比喻勇敢指責大衛罪行的先知", "ref": "撒母耳記下 7:12-16; 12:7", "era": "舊約・聯合王國", "testament": "舊約", "verse": "拿單對大衛說：「你就是那人！」……大衛對拿單說：「我得罪耶和華了！」", "page": 1, "col": 3}, {"id": 67, "icon": "🛡️", "en_name": "Uriah", "zh_name": "烏利亞", "en_desc": "Faithful soldier", "zh_desc": "對大衛與軍隊忠心耿耿的赫人勇士", "ref": "撒母耳記下 11:11; 23:39", "era": "舊約・聯合王國", "testament": "舊約", "verse": "烏利亞對大衛說：「約櫃和以色列與猶大兵都住在棚裡……我豈可回家吃喝、與妻子同寢呢？」", "page": 1, "col": 3}, {"id": 68, "icon": "🗡️", "en_name": "Joab", "zh_name": "約押", "en_desc": "David's military leader", "zh_desc": "大衛王麾下的元帥將領", "ref": "撒母耳記下 8:16; 10:12", "era": "舊約・聯合王國", "testament": "舊約", "verse": "我們都當剛強，為本國的民和神的城邑作大丈夫。願耶和華憑祂的意旨而行！", "page": 1, "col": 3}, {"id": 69, "icon": "🌳", "en_name": "Absalom", "zh_name": "押沙龍", "en_desc": "Sought the kingdom", "zh_desc": "謀叛篡位、長髮卡在橡樹上的大衛三子", "ref": "撒母耳記下 15:6; 18:9, 33", "era": "舊約・聯合王國", "testament": "舊約", "verse": "王就心裡傷慟，上城門樓去哭泣，一面走一面說：「我兒押沙龍啊！我兒，我兒押沙龍啊！」", "page": 1, "col": 3}, {"id": 70, "icon": "🧠", "en_name": "Ahithophel", "zh_name": "亞希多弗", "en_desc": "Betrayed David for Absalom", "zh_desc": "足智多謀卻背叛大衛投靠押沙龍的謀士", "ref": "撒母耳記下 15:31; 16:23", "era": "舊約・聯合王國", "testament": "舊約", "verse": "大衛禱告說：「耶和華啊，求你使亞希多弗的計謀變為愚拙！」", "page": 1, "col": 3}, {"id": 71, "icon": "📜", "en_name": "Huldah", "zh_name": "戶勒大", "en_desc": "Prophetess", "zh_desc": "為約西亞王解讀律法書卷的女先知", "ref": "列王紀下 22:14-20", "era": "舊約・分裂王國", "testament": "舊約", "verse": "祭司希勒家和亞希甘等人就去見女先知戶勒大……她對他們說：「耶和華以色列的神如此說……」", "page": 1, "col": 3}, {"id": 72, "icon": "☀️", "en_name": "Hezekiah", "zh_name": "希西家", "en_desc": "Trusted God", "zh_desc": "專靠耶和華、禱告蒙神醫治延壽十五年的猶大王", "ref": "列王紀下 18:5; 20:5", "era": "舊約・分裂王國", "testament": "舊約", "verse": "希西家倚靠耶和華以色列的神，在他前後的猶大列王中沒有一個及他的……我聽見了你的禱告，看見了你的眼淚，我必醫治你。", "page": 1, "col": 3}, {"id": 73, "icon": "⛓️", "en_name": "Manasseh", "zh_name": "瑪拿西（猶大王）", "en_desc": "Repented after captivity", "zh_desc": "作惡多端卻在被擄受苦中痛悔歸神的猶大王", "ref": "歷代志下 33:12-13", "era": "舊約・分裂王國", "testament": "舊約", "verse": "瑪拿西在急難的時候，就懇求耶和華他的神，且在他列祖的神面前極其自卑。他祈禱耶和華，耶和華就允准他的祈求。", "page": 1, "col": 3}, {"id": 74, "icon": "📖", "en_name": "Josiah", "zh_name": "約西亞", "en_desc": "Led the people to reform", "zh_desc": "重修聖殿尋獲律法書、帶領全國信仰復興的猶大王", "ref": "列王紀下 22:2; 23:25", "era": "舊約・分裂王國", "testament": "舊約", "verse": "在約西亞以前沒有王像他盡心、盡性、盡力地歸向耶和華，遵行摩西的一切律法；在他以後也沒有興起一個王像他。", "page": 1, "col": 3}, {"id": 75, "icon": "🐎", "en_name": "Jehu", "zh_name": "耶戶", "en_desc": "Destroyed Baal worship", "zh_desc": "駕車狂奔、徹底剿滅巴力崇拜與亞哈家的以色列王", "ref": "列王紀下 9:20; 10:28", "era": "舊約・分裂王國", "testament": "舊約", "verse": "這樣，耶戶在以色列中滅了巴力。", "page": 1, "col": 3}, {"id": 76, "icon": "🪔", "en_name": "Zechariah (prophet)", "zh_name": "撒迦利亞（先知）", "en_desc": "Encouraged the people", "zh_desc": "以異象勉勵百姓重建聖殿並預言彌賽亞的先知", "ref": "撒迦利亞書 4:6; 9:9", "era": "舊約・被擄歸回", "testament": "舊約", "verse": "萬軍之耶和華說：不是倚靠勢力，不是倚靠才能，乃是倚靠我的靈方能成事。", "page": 1, "col": 4}, {"id": 77, "icon": "🥣", "en_name": "Malachi", "zh_name": "瑪拉基", "en_desc": "Post-exilic prophet", "zh_desc": "舊約最後一位先知、呼籲敬畏神與十分之一奉獻", "ref": "瑪拉基書 3:10; 4:2", "era": "舊約・被擄歸回", "testament": "舊約", "verse": "萬軍之耶和華說：你們要將當納的十分之一全然送入倉庫……但向你們敬畏我名的人必有公義的日頭出現，其光線有醫治之能。", "page": 1, "col": 4}, {"id": 78, "icon": "🧭", "en_name": "Silas", "zh_name": "西拉", "en_desc": "Missionary companion", "zh_desc": "與保羅在腓立比監獄中半夜唱詩讚美神的宣教夥伴", "ref": "使徒行傳 15:40; 16:25", "era": "新約・使徒宣教", "testament": "新約", "verse": "約在半夜，保羅和西拉禱告，唱詩讚美神，眾囚犯也側耳而聽。", "page": 1, "col": 4}, {"id": 79, "icon": "📃", "en_name": "Timothy", "zh_name": "提摩太", "en_desc": "Young pastor", "zh_desc": "保羅在主裡的真兒子、牧養以弗所教會的年輕傳道人", "ref": "提摩太前書 4:12; 提摩太後書 1:7", "era": "新約・使徒宣教", "testament": "新約", "verse": "不可叫人小看你年輕，總要在言語、行為、愛心、信心、清潔上，都作信徒的榜樣。", "page": 1, "col": 4}, {"id": 80, "icon": "🔨", "en_name": "Joseph of Nazareth", "zh_name": "拿撒勒人約瑟", "en_desc": "Husband of Mary; raised Jesus", "zh_desc": "馬利亞的丈夫、順服神旨意撫養耶穌長大的木匠", "ref": "馬太福音 1:19-24", "era": "新約・福音時期", "testament": "新約", "verse": "她的丈夫約瑟是個義人……約瑟醒了，起來，就遵著主使者的吩咐把妻子娶過來。", "page": 1, "col": 4}, {"id": 81, "icon": "🤰", "en_name": "Elizabeth", "zh_name": "以利沙伯", "en_desc": "Mother of John the Baptist", "zh_desc": "施洗約翰的母親、馬利亞的親戚", "ref": "路加福音 1:41-45", "era": "新約・福音時期", "testament": "新約", "verse": "以利沙伯被聖靈充滿，高聲喊著說：「你在婦女中是有福的！你所懷的胎也是有福的！這相信的女子是有福的！」", "page": 1, "col": 4}, {"id": 82, "icon": "🤐", "en_name": "Zechariah (priest)", "zh_name": "撒迦利亞（祭司）", "en_desc": "Father of John the Baptist", "zh_desc": "施洗約翰的父親、因不信天使預言而暫時啞口", "ref": "路加福音 1:13, 67-68", "era": "新約・福音時期", "testament": "新約", "verse": "他的父親撒迦利亞被聖靈充滿了，就預言說：「主以色列的神是應當稱頌的！因祂眷顧祂的百姓，為他們施行救贖。」", "page": 1, "col": 4}, {"id": 83, "icon": "👴", "en_name": "Simeon (Luke 2)", "zh_name": "西面（路加福音 2 章）", "en_desc": "Recognized baby Jesus", "zh_desc": "在聖殿中抱起嬰孩耶穌頌讚神救恩的公義虔誠長者", "ref": "路加福音 2:25-32", "era": "新約・福音時期", "testament": "新約", "verse": "主啊，如今可以照你的話，釋放僕人安然去世；因為我的眼睛已經看見你的救恩，就是你在萬民面前所預備的。", "page": 1, "col": 4}, {"id": 84, "icon": "👵", "en_name": "Anna", "zh_name": "亞拿（女先知）", "en_desc": "Prophetess in the temple", "zh_desc": "晝夜在聖殿禁食祈禱、見證嬰孩耶穌的高齡女先知", "ref": "路加福音 2:36-38", "era": "新約・福音時期", "testament": "新約", "verse": "又有女先知，名叫亞拿……並不離開聖殿，禁食祈求，晝夜事奉神。正那一刻，她進前來稱謝神，將孩子的事對一切盼望耶路撒冷得救贖的人講說。", "page": 1, "col": 4}, {"id": 85, "icon": "🏛️", "en_name": "Herod the Great", "zh_name": "大希律王", "en_desc": "Tried to kill Jesus", "zh_desc": "下令屠殺伯利恆兩歲以下男嬰、企圖殺害耶穌的暴君", "ref": "馬太福音 2:1-3, 16", "era": "新約・福音時期", "testament": "新約", "verse": "希律王聽見了，就心裡不安；耶路撒冷合城的人也都不安。", "page": 1, "col": 4}, {"id": 86, "icon": "🍽️", "en_name": "Herod Antipas", "zh_name": "希律安提帕", "en_desc": "Executed John the Baptist", "zh_desc": "斬首施洗約翰並在耶穌受審時戲弄祂的分封王", "ref": "馬可福音 6:14-20; 路加福音 23:8-11", "era": "新約・福音時期", "testament": "新約", "verse": "希律知道約翰是義人，是聖人，所以敬畏他，保護他，聽他講論，就多照著行，並且樂意聽他（後卻因起誓斬了約翰）。", "page": 1, "col": 4}, {"id": 87, "icon": "🧼", "en_name": "Pilate", "zh_name": "彼拉多", "en_desc": "Condemned Jesus", "zh_desc": "在眾人壓力下拿水洗手、判處耶穌釘十字架的羅馬巡撫", "ref": "馬太福音 27:24; 約翰福音 19:19", "era": "新約・福音時期", "testament": "新約", "verse": "彼拉多見說也無濟於事，反要生亂，就拿水在眾人面前洗手，說：「流這義人的血，罪不在我，你們承當吧。」", "page": 1, "col": 4}, {"id": 88, "icon": "⛪", "en_name": "Caiaphas", "zh_name": "該亞法", "en_desc": "High priest", "zh_desc": "主導公會定耶穌死罪的大祭司", "ref": "約翰福音 11:49-52; 馬太福音 26:57", "era": "新約・福音時期", "testament": "新約", "verse": "內中有一個人，名叫該亞法，本年作大祭司，對他們說：「獨不想一個人替百姓死，免得通國滅亡，就是你們的益處。」", "page": 1, "col": 4}, {"id": 89, "icon": "🪓", "en_name": "Judas (not Iscariot)", "zh_name": "猶大（雅各的兒子／達太）", "en_desc": "Apostle; son of James", "zh_desc": "十二使徒之一（非賣主的加略人猶大）", "ref": "約翰福音 14:22; 路加福音 6:16", "era": "新約・福音時期", "testament": "新約", "verse": "猶大（不是加略人猶大）問耶穌說：「主啊，為什麼要向我們顯現，不向世人顯現呢？」", "page": 1, "col": 4}, {"id": 90, "icon": "🖐️", "en_name": "Thomas", "zh_name": "多馬", "en_desc": "\"Doubting\" but faithful", "zh_desc": "親探耶穌釘痕後宣告「我的主！我的神！」的使徒", "ref": "約翰福音 20:27-29", "era": "新約・福音時期", "testament": "新約", "verse": "多馬說：「我的主！我的神！」耶穌對他說：「你因看見了我才信；那沒有看見就信的有福了。」", "page": 1, "col": 4}, {"id": 91, "icon": "🐚", "en_name": "James (son of Zebedee)", "zh_name": "雅各（西庇太的兒子）", "en_desc": "First apostle martyred", "zh_desc": "約翰的哥哥、十二使徒中第一位為主殉道者", "ref": "馬可福音 1:19; 使徒行傳 12:1-2", "era": "新約・福音與初代教會", "testament": "新約", "verse": "希律王下手苦害教會中幾個人，用刀殺了約翰的哥哥雅各。", "page": 1, "col": 4}, {"id": 92, "icon": "🖊️", "en_name": "John Mark", "zh_name": "約翰馬可", "en_desc": "Traditionally credited with Mark's Gospel", "zh_desc": "馬可福音作者、巴拿巴的表弟", "ref": "馬可福音 1:1; 提摩太後書 4:11", "era": "新約・使徒宣教", "testament": "新約", "verse": "神的兒子，耶穌基督福音的起頭……你來的時候，要把馬可帶來，因為他在傳道的事上於我有益處。", "page": 1, "col": 4}, {"id": 93, "icon": "🤝", "en_name": "Barnabas", "zh_name": "巴拿巴", "en_desc": "Encouraged others", "zh_desc": "「勸慰子」、接納保羅並提攜馬可的慷慨使徒", "ref": "使徒行傳 4:36; 9:27; 11:24", "era": "新約・初代教會", "testament": "新約", "verse": "巴拿巴（翻出來就是勸慰子）原是個好人，被聖靈充滿，大有信心。於是有許多人歸服了主。", "page": 1, "col": 4}, {"id": 94, "icon": "🗣️", "en_name": "Apollos", "zh_name": "亞波羅", "en_desc": "Powerful speaker", "zh_desc": "學問淵博、最能講解聖經的亞歷山大傳道者", "ref": "使徒行傳 18:24-28; 哥林多前書 3:6", "era": "新約・使徒宣教", "testament": "新約", "verse": "有一個猶太人，名叫亞波羅，生在亞歷山大，是有學問的，最能講解聖經……我栽種了，亞波羅澆灌了，惟有神叫他生長。", "page": 1, "col": 4}, {"id": 95, "icon": "🏠", "en_name": "Priscilla", "zh_name": "百基拉", "en_desc": "Taught with Aquila", "zh_desc": "與丈夫亞居拉同心織帳棚、開放家庭教會並指導亞波羅", "ref": "使徒行傳 18:2, 26; 羅馬書 16:3-4", "era": "新約・使徒宣教", "testament": "新約", "verse": "問百基拉和亞居拉安。他們在基督耶穌裡與我同工，也為我的命將自己的頸項置之度外。", "page": 1, "col": 4}, {"id": 96, "icon": "⛺", "en_name": "Aquila", "zh_name": "亞居拉", "en_desc": "Worked with Priscilla", "zh_desc": "百基拉的丈夫、保羅忠實的宣教同工", "ref": "使徒行傳 18:2-3, 26", "era": "新約・使徒宣教", "testament": "新約", "verse": "保羅因與他們同業，就和他們同住做工；他們本是製造帳棚為業。百基拉、亞居拉聽見，就接他來，將神的道給他講解更加詳細。", "page": 1, "col": 4}, {"id": 97, "icon": "🟣", "en_name": "Lydia", "zh_name": "呂底亞", "en_desc": "First recorded convert in Macedonia", "zh_desc": "賣紫色布疋的婦人、歐洲（馬其頓）第一位歸主信徒", "ref": "使徒行傳 16:14-15", "era": "新約・使徒宣教", "testament": "新約", "verse": "有一個賣紫色布疋的婦人，名叫呂底亞，是推雅推喇城的人，素來敬拜神。她聽見了，主就開導她的心，叫她留心聽保羅所講的話。", "page": 1, "col": 4}, {"id": 98, "icon": "🤲", "en_name": "Phoebe", "zh_name": "非比", "en_desc": "Served the church", "zh_desc": "堅革哩教會的女執事、將羅馬書帶往羅馬的忠心同工", "ref": "羅馬書 16:1-2", "era": "新約・使徒宣教", "testament": "新約", "verse": "我對你們舉薦我們的姊妹非比，她是堅革哩教會中的女執事……因她素來幫助許多人，也幫助了我。", "page": 1, "col": 4}, {"id": 99, "icon": "🫂", "en_name": "Onesimus", "zh_name": "阿尼西母", "en_desc": "Beloved brother in Christ", "zh_desc": "原為腓利門逃跑的奴隸，後因保羅帶領歸主成為親愛弟兄", "ref": "腓利門書 1:10-16", "era": "新約・使徒宣教", "testament": "新約", "verse": "就是為我在捆鎖中所生的兒子阿尼西母求你。他從前與你沒有益處，但如今與你我都有益處……不再是奴僕，乃是高過奴僕，是親愛的兄弟。", "page": 1, "col": 4}, {"id": 100, "icon": "📧", "en_name": "Tychicus", "zh_name": "推基古", "en_desc": "Trusted messenger", "zh_desc": "為保羅傳遞以弗所書與歌羅西書的忠心使者", "ref": "以弗所書 6:21; 歌羅西書 4:7", "era": "新約・使徒宣教", "testament": "新約", "verse": "有我親愛的兄弟推基古要將我一切的事都告訴你們。他是忠心的執事，和我一同作主的僕人。", "page": 1, "col": 4}, {"id": 101, "icon": "🥀", "en_name": "Cain", "zh_name": "該隱", "en_desc": "Killed his brother Abel", "zh_desc": "亞當長子、因嫉妒殺害弟弟亞伯", "ref": "創世記 4:8-9", "era": "舊約・原初時代", "testament": "舊約", "verse": "耶和華對該隱說：「你兄弟亞伯在哪裡？」他說：「我不知道！我豈是我兄弟的守望者嗎？」", "page": 2, "col": 1}, {"id": 102, "icon": "🐐", "en_name": "Abel", "zh_name": "亞伯", "en_desc": "Offered a better sacrifice", "zh_desc": "因著信獻上蒙神悅納頭生羊羔的義人", "ref": "創世記 4:4; 希伯來書 11:4", "era": "舊約・原初時代", "testament": "舊約", "verse": "亞伯因著信，獻祭與神，比該隱所獻的更美，因此便得了稱義的見證……他雖然死了，卻因這信仍舊說話。", "page": 2, "col": 1}, {"id": 103, "icon": "👦", "en_name": "Seth", "zh_name": "塞特", "en_desc": "Given in place of Abel", "zh_desc": "神賜給亞當夏娃代替亞伯的兒子", "ref": "創世記 4:25-26", "era": "舊約・原初時代", "testament": "舊約", "verse": "亞當又與妻子同房，她就生了一個兒子，起名叫塞特，意思說：「神另給我立了一個兒子代替亞伯。」那時候，人才求告耶和華的名。", "page": 2, "col": 1}, {"id": 104, "icon": "☁️", "en_name": "Enoch", "zh_name": "以諾", "en_desc": "Walked with God", "zh_desc": "與神同行三百年、未見死被神取去", "ref": "創世記 5:24; 希伯來書 11:5", "era": "舊約・原初時代", "testament": "舊約", "verse": "以諾與神同行，神將他取去，他就不在世了。因為他被接去以先，已經得了神喜悅他的明證。", "page": 2, "col": 1}, {"id": 105, "icon": "🎂", "en_name": "Methuselah", "zh_name": "瑪土撒拉", "en_desc": "Lived 969 years", "zh_desc": "聖經記載最長壽的人（享壽 969 歲）", "ref": "創世記 5:27", "era": "舊約・原初時代", "testament": "舊約", "verse": "瑪土撒拉共活了九百六十九歲就死了。", "page": 2, "col": 1}, {"id": 106, "icon": "🏃", "en_name": "Lot", "zh_name": "羅得", "en_desc": "Rescued from Sodom", "zh_desc": "亞伯拉罕的姪兒、蒙天使救出所多瑪傾覆之災", "ref": "創世記 19:15-16; 彼得後書 2:7", "era": "舊約・族長時代", "testament": "舊約", "verse": "但羅得遲延不走。二人因為耶和華憐恤羅得，就拉著他的手和他妻子的手，並他兩個女兒的手，把他們領出來。", "page": 2, "col": 1}, {"id": 107, "icon": "🧂", "en_name": "Lot's wife", "zh_name": "羅得的妻子", "en_desc": "Became a pillar of salt", "zh_desc": "逃離所多瑪時違命回頭留戀，變成一根鹽柱", "ref": "創世記 19:26; 路加福音 17:32", "era": "舊約・族長時代", "testament": "舊約", "verse": "羅得的妻子在後邊回頭一看，就變成了一根鹽柱。耶穌說：「你們要回想羅得的妻子！」", "page": 2, "col": 1}, {"id": 108, "icon": "💍", "en_name": "Rebekah", "zh_name": "利百加", "en_desc": "Mother of Esau & Jacob", "zh_desc": "以撒之妻、以掃與雅各雙胞胎之母", "ref": "創世記 24:58, 67", "era": "舊約・族長時代", "testament": "舊約", "verse": "他們就叫了利百加來，問她說：「你和這人同去嗎？」她說：「我去。」以撒娶了利百加為妻，並且愛她。", "page": 2, "col": 1}, {"id": 109, "icon": "🥣", "en_name": "Esau", "zh_name": "以掃", "en_desc": "Sold his birthright", "zh_desc": "為一碗紅豆湯出賣長子名分的以撒長子", "ref": "創世記 25:33-34; 希伯來書 12:16", "era": "舊約・族長時代", "testament": "舊約", "verse": "雅各給以掃餅和紅豆湯，以掃吃了喝了，便起來走了。這就是以掃輕看了他長子的名分。", "page": 2, "col": 1}, {"id": 110, "icon": "👱‍♂️", "en_name": "Laban", "zh_name": "拉班", "en_desc": "Jacob's tricky uncle", "zh_desc": "詭詐更改工價十次的雅各母舅與岳父", "ref": "創世記 29:25; 31:7, 49", "era": "舊約・族長時代", "testament": "舊約", "verse": "拉班又說：「願耶和華在你我中間鑒察。我們彼此離別以後，願耶和華在你我中間作見證（米斯巴）。」", "page": 2, "col": 1}, {"id": 111, "icon": "🐣", "en_name": "Dan", "zh_name": "但", "en_desc": "Jacob & Bilhah's 1st son", "zh_desc": "雅各與辟拉所生的長子", "ref": "創世記 30:6; 49:16", "era": "舊約・族長時代", "testament": "舊約", "verse": "但必判斷他的民，作以色列支派之一。", "page": 2, "col": 1}, {"id": 112, "icon": "🤼", "en_name": "Naphtali", "zh_name": "拿弗他利", "en_desc": "Jacob & Bilhah's 2nd son", "zh_desc": "雅各與辟拉所生的次子", "ref": "創世記 30:8; 49:21", "era": "舊約・族長時代", "testament": "舊約", "verse": "拿弗他利是被釋放的母鹿；他出嘉美的言語。", "page": 2, "col": 1}, {"id": 113, "icon": "👥", "en_name": "Gad", "zh_name": "迦得", "en_desc": "Jacob & Zilpah's 1st son", "zh_desc": "雅各與悉帕所生的長子", "ref": "創世記 30:11; 49:19", "era": "舊約・族長時代", "testament": "舊約", "verse": "迦得必被敵軍追逼，他卻要追逼他們的腳跟。", "page": 2, "col": 1}, {"id": 114, "icon": "🧶", "en_name": "Tamar", "zh_name": "他瑪", "en_desc": "Judah's daughter-in-law", "zh_desc": "猶大的兒婦、列入耶穌基督家譜的婦女", "ref": "創世記 38:26; 馬太福音 1:3", "era": "舊約・族長時代", "testament": "舊約", "verse": "猶大承認說：「她比我更有義。」猶大從他瑪氏生法勒斯和謝拉（列入基督家譜）。", "page": 2, "col": 1}, {"id": 115, "icon": "🔑", "en_name": "Potiphar", "zh_name": "波提乏", "en_desc": "Bought Joseph", "zh_desc": "買下約瑟並委以家務總管的埃及法老內臣護衛長", "ref": "創世記 39:1-4", "era": "舊約・族長時代", "testament": "舊約", "verse": "波提乏見耶和華與約瑟同在，又見耶和華使他手裡所辦的盡都順利，約瑟就在主人眼前蒙恩，派他管理家務。", "page": 2, "col": 1}, {"id": 116, "icon": "🍼", "en_name": "Jochebed", "zh_name": "約基別", "en_desc": "Hid baby Moses", "zh_desc": "憑信心將嬰孩摩西藏在蒲草箱裡的母親", "ref": "出埃及記 2:2-3; 6:20; 希伯來書 11:23", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "摩西生下來，他的父母見他是個俊美的孩子，就因著信，把他藏了三個月，並不怕王命。", "page": 2, "col": 1}, {"id": 117, "icon": "💐", "en_name": "Zipporah", "zh_name": "西坡拉", "en_desc": "Wife of Moses", "zh_desc": "摩西的米甸妻子（葉忒羅的女兒）", "ref": "出埃及記 2:21; 18:2", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "摩西甘心和那人同住；那人把他的女兒西坡拉給摩西為妻。", "page": 2, "col": 1}, {"id": 118, "icon": "🐸", "en_name": "Pharaoh (Exodus)", "zh_name": "埃及法老（出埃及記）", "en_desc": "Refused to let Israel go", "zh_desc": "心裡剛硬經歷十災仍抗拒容以色列百姓離去的埃及王", "ref": "出埃及記 5:2; 9:16", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "其實，我叫你存立，是特要向你顯我的大能，並要使我的名傳遍天下。", "page": 2, "col": 1}, {"id": 119, "icon": "🙌", "en_name": "Hur", "zh_name": "戶珥", "en_desc": "Held up Moses' hands", "zh_desc": "與亞倫一左一右扶住摩西雙手禱告直到戰勝亞瑪力人", "ref": "出埃及記 17:12", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "但摩西的手發沉，亞倫與戶珥扶著他的手，一個在這邊，一個在那邊，他的手就穩住，直到日落的時候。", "page": 2, "col": 1}, {"id": 120, "icon": "🕳️", "en_name": "Korah", "zh_name": "可拉", "en_desc": "Rebelled against Moses", "zh_desc": "聚眾背叛摩西與亞倫職分、被地裂開口吞滅的利未人", "ref": "民數記 16:1-3, 32", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "地開了口，把他們和他們的家眷，並一切屬可拉的人丁、財物，都吞下去。", "page": 2, "col": 1}, {"id": 121, "icon": "🫏", "en_name": "Balaam", "zh_name": "巴蘭", "en_desc": "Rebuked by his donkey", "zh_desc": "貪愛不義工價、被開口說話的驢子責備的術士先知", "ref": "民數記 22:28-31; 23:19", "era": "舊約・出埃及時代", "testament": "舊約", "verse": "耶和華叫驢開口，對巴蘭說：「我向你行了什麼，你竟打我這三次呢？」……神非人，必不致說謊，也非人子，必不致後悔。", "page": 2, "col": 1}, {"id": 122, "icon": "⛏️", "en_name": "Achan", "zh_name": "亞干", "en_desc": "Hid plunder from Jericho", "zh_desc": "私藏耶利哥當滅之物導致艾城戰敗的猶大人", "ref": "約書亞記 7:19-21", "era": "舊約・征服迦南", "testament": "舊約", "verse": "約書亞對亞干說：「我兒，我勸你將榮耀歸給耶和華以色列的神，在祂面前認罪，將你所做的事告訴我。」", "page": 2, "col": 1}, {"id": 123, "icon": "🗡️", "en_name": "Ehud", "zh_name": "以笏", "en_desc": "Left-handed judge", "zh_desc": "用左手拔雙刃劍刺殺摩押王伊磯倫的士師", "ref": "士師記 3:15, 21", "era": "舊約・士師時代", "testament": "舊約", "verse": "耶和華為他們興起一位拯救者，就是便雅憫人基拉的兒子以笏；他是左手便利的。", "page": 2, "col": 1}, {"id": 124, "icon": "🚩", "en_name": "Barak", "zh_name": "巴拉", "en_desc": "Led the army with Deborah", "zh_desc": "與女先知底波拉同心率軍擊潰西西拉鐵車大軍的將領", "ref": "士師記 4:8, 14; 希伯來書 11:32", "era": "舊約・士師時代", "testament": "舊約", "verse": "底波拉對巴拉說：「你起來，今日就是耶和華將西西拉交在你手的日子。耶和華豈不在你前頭行嗎？」", "page": 2, "col": 1}, {"id": 125, "icon": "⛺", "en_name": "Jael", "zh_name": "雅億", "en_desc": "Killed Sisera with a peg", "zh_desc": "在帳棚內用橛子釘死敵軍元帥西西拉的基尼婦人", "ref": "士師記 4:21; 5:24", "era": "舊約・士師時代", "testament": "舊約", "verse": "基尼人希百的妻雅億比眾婦人多得福氣，比住帳棚的婦人更蒙福祉。", "page": 2, "col": 1}, {"id": 126, "icon": "💔", "en_name": "Jephthah", "zh_name": "耶弗他", "en_desc": "Made a rash vow", "zh_desc": "擊敗亞捫人卻因冒失許願而痛心的士師", "ref": "士師記 11:29-35; 希伯來書 11:32", "era": "舊約・士師時代", "testament": "舊約", "verse": "耶和華的靈降在耶弗他身上……耶弗他向耶和華許願（卻因冒失許願而撕裂衣服痛心）。", "page": 2, "col": 2}, {"id": 127, "icon": "✂️", "en_name": "Delilah", "zh_name": "大利拉", "en_desc": "Betrayed Samson", "zh_desc": "誘出參孫力氣祕密並剃去他七條髮綹的非利士婦人", "ref": "士師記 16:4, 17-19", "era": "舊約・士師時代", "testament": "舊約", "verse": "參孫就把心中所藏的都告訴了她（大利拉）……大利拉使參孫枕著她的膝睡覺，叫了一個人來剃除他頭上的七條髮綹。", "page": 2, "col": 2}, {"id": 128, "icon": "🏡", "en_name": "Naomi", "zh_name": "拿俄米", "en_desc": "Ruth's mother-in-law", "zh_desc": "路得的婆婆、帶領路得歸回伯利恆並促成波阿斯良緣", "ref": "路得記 1:8; 4:14-16", "era": "舊約・士師時代", "testament": "舊約", "verse": "拿俄米就把孩子抱在懷中，作他的養母。婦人們說：「耶和華是應當稱頌的！因為今日沒有撇下你。」", "page": 2, "col": 2}, {"id": 129, "icon": "🪑", "en_name": "Eli", "zh_name": "以利", "en_desc": "Raised young Samuel", "zh_desc": "在示羅會幕撫養教導年幼撒母耳、卻縱容二子作惡的祭司", "ref": "撒母耳記上 2:30; 3:8-9", "era": "舊約・士師至王國", "testament": "舊約", "verse": "以利明白是耶和華呼喚童子，就對撒母耳說：「你仍去睡吧；若再呼喚你，你就說：『耶和華啊，請說，僕人敬聽！』」", "page": 2, "col": 2}, {"id": 130, "icon": "👑", "en_name": "Saul", "zh_name": "掃羅", "en_desc": "Israel's first king", "zh_desc": "以色列王國第一任君王，後因違背神命被廢", "ref": "撒母耳記上 10:1; 15:22", "era": "舊約・聯合王國", "testament": "舊約", "verse": "撒母耳說：「耶和華喜悅燔祭和平安祭，豈如喜悅人聽從祂的話呢？聽命勝於獻祭；順從勝於公羊的脂油。」", "page": 2, "col": 2}, {"id": 131, "icon": "📏", "en_name": "Goliath", "zh_name": "歌利亞", "en_desc": "Philistine giant", "zh_desc": "向以色列軍隊罵陣、被少年大衛用機弦甩石擊倒的非利士巨人", "ref": "撒母耳記上 17:4, 47", "era": "舊約・聯合王國", "testament": "舊約", "verse": "又使這眾人知道耶和華使人得勝，不是用刀用槍，因為爭戰的勝敗全在乎耶和華。", "page": 2, "col": 2}, {"id": 132, "icon": "🎯", "en_name": "Jonathan", "zh_name": "約拿單", "en_desc": "David's loyal friend", "zh_desc": "掃羅長子、愛大衛如同自己性命的忠誠摯友", "ref": "撒母耳記上 14:6; 18:1-3", "era": "舊約・聯合王國", "testament": "舊約", "verse": "約拿單的心與大衛的心深相契合。約拿單愛大衛，如同愛自己的性命……因為耶和華使人得勝，不在乎人多人少。", "page": 2, "col": 2}, {"id": 133, "icon": "🪟", "en_name": "Michal", "zh_name": "米甲", "en_desc": "Helped David escape", "zh_desc": "掃羅次女、大衛之妻，曾從窗戶縋下大衛助其逃離追殺", "ref": "撒母耳記上 19:11-12", "era": "舊約・聯合王國", "testament": "舊約", "verse": "大衛的妻米甲將大衛從窗戶裡縋下去；大衛就逃走，躲避了。", "page": 2, "col": 2}, {"id": 134, "icon": "🙇‍♀️", "en_name": "Abigail", "zh_name": "亞比該", "en_desc": "Wisely calmed David", "zh_desc": "用智慧言語與禮物化解大衛怒氣、免去流血衝突的聰明婦人", "ref": "撒母耳記上 25:32-33", "era": "舊約・聯合王國", "testament": "舊約", "verse": "大衛對亞比該說：「耶和華以色列的神是應當稱頌的！因為祂今日使你來迎接我。你和你的見識也當稱讚，因為你今日攔阻我親手報仇。」", "page": 2, "col": 2}, {"id": 135, "icon": "🍴", "en_name": "Mephibosheth", "zh_name": "米非波設", "en_desc": "Ate at David's table", "zh_desc": "約拿單雙腿殘疾的兒子，蒙大衛守約恩待常與王同席吃飯", "ref": "撒母耳記下 9:7, 13", "era": "舊約・聯合王國", "testament": "舊約", "verse": "大衛說：「你不要懼怕，我必因你父親約拿單的緣故施恩與你，將你祖父掃羅的一切田地都歸還你；你也可以常與我同席吃飯。」", "page": 2, "col": 2}, {"id": 136, "icon": "💎", "en_name": "Queen of Sheba", "zh_name": "示巴女王", "en_desc": "Tested Solomon's wisdom", "zh_desc": "遠道帶香料寶石來用難題試問所羅門王智慧的女王", "ref": "列王紀上 10:1, 6-7", "era": "舊約・聯合王國", "testament": "舊約", "verse": "示巴女王聽見所羅門因耶和華之名所得的名聲，就來要用難題試問他……說：「你的智慧和你的福分，越過我所聽見的風聲。」", "page": 2, "col": 2}, {"id": 137, "icon": "🦂", "en_name": "Rehoboam", "zh_name": "羅波安", "en_desc": "Reigned as Israel split", "zh_desc": "所羅門之子、因拒絕減輕百姓重軛導致王國南北分裂", "ref": "列王紀上 12:8, 16", "era": "舊約・分裂王國", "testament": "舊約", "verse": "王卻不用老年人給他出的主意，就和那些與他一同長大、在他面前侍立的少年人商議（導致以色列王國南北分裂）。", "page": 2, "col": 2}, {"id": 138, "icon": "🐄", "en_name": "Jeroboam", "zh_name": "耶羅波安", "en_desc": "Made two golden calves", "zh_desc": "北國以色列首任君王、在但與伯特利鑄造兩隻金牛犢陷民於罪", "ref": "列王紀上 12:28-30", "era": "舊約・分裂王國", "testament": "舊約", "verse": "耶羅波安王就籌劃定妥，鑄造了兩個金牛犢……這事叫百姓陷在罪裡。", "page": 2, "col": 2}, {"id": 139, "icon": "🌵", "en_name": "Ahab", "zh_name": "亞哈", "en_desc": "Wicked king of Israel", "zh_desc": "迎娶耶洗別、引進巴力崇拜並奪取拿伯葡萄園的北國惡王", "ref": "列王紀上 16:30-33; 21:20", "era": "舊約・分裂王國", "testament": "舊約", "verse": "暗利的兒子亞哈行耶和華眼中看為惡的事，比他以前的列王更甚。", "page": 2, "col": 2}, {"id": 140, "icon": "💄", "en_name": "Jezebel", "zh_name": "耶洗別", "en_desc": "Ahab's wicked queen", "zh_desc": "殺害耶和華眾先知、逼迫以利亞的亞哈王后", "ref": "列王紀上 18:4; 19:2; 21:25", "era": "舊約・分裂王國", "testament": "舊約", "verse": "從來沒有像亞哈的，因他自賣，行耶和華眼中看為惡的事，受了王后耶洗別的聳動。", "page": 2, "col": 2}, {"id": 141, "icon": "👨‍🌾", "en_name": "Naboth", "zh_name": "拿伯", "en_desc": "Killed for his vineyard", "zh_desc": "堅守祖業不賣葡萄園、遭耶洗別設假見證害死的耶斯列人", "ref": "列王紀上 21:3", "era": "舊約・分裂王國", "testament": "舊約", "verse": "拿伯對亞哈說：「我敬畏耶和華，萬不敢將我先人留下的產業給你。」", "page": 2, "col": 2}, {"id": 142, "icon": "🫧", "en_name": "Naaman", "zh_name": "乃縵", "en_desc": "Syrian healed of leprosy", "zh_desc": "聽從以利沙吩咐在約旦河沐浴七次得潔淨的亞蘭大元帥", "ref": "列王紀下 5:14-15", "era": "舊約・分裂王國", "testament": "舊約", "verse": "於是乃縵下去，照著神人的話，在約旦河裡沐浴七回；他的肉復了原，好像小孩子的肉，他就潔淨了。", "page": 2, "col": 2}, {"id": 143, "icon": "👛", "en_name": "Gehazi", "zh_name": "基哈西", "en_desc": "Elisha's greedy servant", "zh_desc": "貪圖乃縵銀子與衣裳而染上大痲瘋的以利沙僕人", "ref": "列王紀下 5:20, 26-27", "era": "舊約・分裂王國", "testament": "舊約", "verse": "神人以利沙的僕人基哈西心裡說：「我主人不願從這亞蘭人乃縵手裡受他帶來的禮物，我必跑去追上他，向他要些。」", "page": 2, "col": 2}, {"id": 144, "icon": "📢", "en_name": "Cyrus", "zh_name": "古列（塞魯士）", "en_desc": "Let the exiles go home", "zh_desc": "被神膏立下詔准許猶太人歸回耶路撒冷重建聖殿的波斯王", "ref": "以斯拉記 1:1-2; 以賽亞書 45:1", "era": "舊約・波斯歸回", "testament": "舊約", "verse": "波斯王古列元年，耶和華為要應驗藉耶利米口所說的話，就激動波斯王古列的心，使他下詔通告全國，囑咐我為祂在猶大的耶路撒冷建造殿宇。", "page": 2, "col": 2}, {"id": 145, "icon": "🏗️", "en_name": "Zerubbabel", "zh_name": "所羅巴伯", "en_desc": "Rebuilt the temple", "zh_desc": "帶領首批被擄百姓歸回並重建第二聖殿的猶大省長", "ref": "以斯拉記 3:8; 撒迦利亞書 4:9", "era": "舊約・波斯歸回", "testament": "舊約", "verse": "所羅巴伯的手立了這殿的根基，他的手也必完成這工，你就知道萬軍之耶和華差遣我到你們這裡來了。", "page": 2, "col": 2}, {"id": 146, "icon": "📚", "en_name": "Ezra", "zh_name": "以斯拉", "en_desc": "Taught God's law", "zh_desc": "定志考究遵行耶和華律法、教導百姓回歸聖言的文士兼祭司", "ref": "以斯拉記 7:10", "era": "舊約・波斯歸回", "testament": "舊約", "verse": "以斯拉定志考究遵行耶和華的律法，又將律例典章教訓以色列人。", "page": 2, "col": 2}, {"id": 147, "icon": "🧱", "en_name": "Nehemiah", "zh_name": "尼希米", "en_desc": "Rebuilt Jerusalem's walls", "zh_desc": "放下波斯王酒政高位、率領百姓五十二天重建耶路撒冷城牆的省長", "ref": "尼希米記 2:17; 6:15; 8:10", "era": "舊約・波斯歸回", "testament": "舊約", "verse": "來吧，我們重建耶路撒冷的城牆，免得再受凌辱！……以耶和華為樂，就是你們的力量。", "page": 2, "col": 2}, {"id": 148, "icon": "🏰", "en_name": "Ahasuerus", "zh_name": "亞哈隨魯", "en_desc": "Made Esther his queen", "zh_desc": "統治百二十七省、立以斯帖為王后的波斯帝王", "ref": "以斯帖記 1:1; 2:17", "era": "舊約・波斯時期", "testament": "舊約", "verse": "王愛以斯帖過於愛眾女，她在王眼前蒙寵愛比眾處女更甚。王就把王后的冠冕戴在她頭上，立她為王后。", "page": 2, "col": 2}, {"id": 149, "icon": "🙅‍♀️", "en_name": "Vashti", "zh_name": "瓦實提", "en_desc": "Refused the king's call", "zh_desc": "拒絕在酒宴中展示美貌而被廢去王后位分的波斯王后", "ref": "以斯帖記 1:12", "era": "舊約・波斯時期", "testament": "舊約", "verse": "王后瓦實提卻不肯遵太監所傳的王命而來，所以王甚發怒，心如火燒。", "page": 2, "col": 2}, {"id": 150, "icon": "🐴", "en_name": "Mordecai", "zh_name": "末底改", "en_desc": "Raised his cousin Esther", "zh_desc": "撫養堂妹以斯帖、不向哈曼跪拜並拯救猶太全族的忠臣", "ref": "以斯帖記 2:7; 3:2; 10:3", "era": "舊約・波斯時期", "testament": "舊約", "verse": "猶大人末底改作亞哈隨魯王的宰相，在猶大人中為大，得他眾弟兄的喜悅，為本族的人求好處，向他們說和平的話。", "page": 2, "col": 2}, {"id": 151, "icon": "🧬", "en_name": "Haman", "zh_name": "哈曼", "en_desc": "Plotted to destroy the Jews", "zh_desc": "陰謀滅絕波斯境內猶太人、反被掛在自備木架上的亞甲族宰相", "ref": "以斯帖記 3:6; 7:10", "era": "舊約・波斯時期", "testament": "舊約", "verse": "於是人將哈曼掛在他為末底改所預備的木架上。王的忿怒這才止息。", "page": 2, "col": 3}, {"id": 152, "icon": "🦴", "en_name": "Ezekiel", "zh_name": "以西結", "en_desc": "Saw the valley of dry bones", "zh_desc": "在被擄之地見平原骸骨復生與神榮耀聖殿異象的先知", "ref": "以西結書 36:26; 37:4-5", "era": "舊約・被擄時期", "testament": "舊約", "verse": "主耶和華對這些骸骨如此說：「我必使氣息進入你們裡面，你們就要活了。」我也要賜給你們一個新心，將新靈放在你們裡面。", "page": 2, "col": 3}, {"id": 153, "icon": "🐂", "en_name": "Nebuchadnezzar", "zh_name": "尼布甲尼撒", "en_desc": "King humbled by God", "zh_desc": "攻陷耶路撒冷、因驕傲被神降卑吃草如牛後學會稱頌至高神的巴比倫王", "ref": "但以理書 4:34-37", "era": "舊約・被擄時期", "testament": "舊約", "verse": "日子滿足，我尼布甲尼撒舉目望天，我的聰明復歸於我，我便稱頌至高者，讚美尊敬活到永遠的神。", "page": 2, "col": 3}, {"id": 154, "icon": "🚫", "en_name": "Shadrach", "zh_name": "沙得拉", "en_desc": "Hananiah; refused the idol", "zh_desc": "哈拿尼雅（但以理三友之一），拒絕叩拜金像被扔入烈火窯卻毫髮無傷", "ref": "但以理書 3:16-18", "era": "舊約・被擄時期", "testament": "舊約", "verse": "沙得拉、米煞、亞伯尼歌對王說：「即便如此，我們所事奉的神能將我們從烈火的窯中救出來。即或不然，王啊，你當知道我們決不事奉你的神。」", "page": 2, "col": 3}, {"id": 155, "icon": "♨️", "en_name": "Meshach", "zh_name": "米煞", "en_desc": "Mishael; cast into the furnace", "zh_desc": "米沙利（但以理三友之一），在火窯中有神子同行保守", "ref": "但以理書 3:25", "era": "舊約・被擄時期", "testament": "舊約", "verse": "王說：「看哪，我看見有四個人，並沒有捆綁，在火中遊行，也沒有受傷；第四個的相貌好像神子。」", "page": 2, "col": 3}, {"id": 156, "icon": "🚶", "en_name": "Abednego", "zh_name": "亞伯尼歌", "en_desc": "Azariah; unharmed by the fire", "zh_desc": "亞撒利雅（但以理三友之一），身上毫無火燎氣味的信心見證人", "ref": "但以理書 3:27", "era": "舊約・被擄時期", "testament": "舊約", "verse": "見那火無力傷他們的身體，頭髮也沒有燒焦，衣裳也沒有變色，並沒有火燎的氣味。", "page": 2, "col": 3}, {"id": 157, "icon": "✍️", "en_name": "Belshazzar", "zh_name": "伯沙撒", "en_desc": "Saw writing on the wall", "zh_desc": "用聖殿器皿飲酒作樂、驚見粉牆上指頭寫字「彌尼，彌尼，提客勒，烏法珥新」的巴比倫王", "ref": "但以理書 5:5, 25-27", "era": "舊約・被擄時期", "testament": "舊約", "verse": "當時，忽有人的指頭顯出，在王宮與燈臺相對的粉牆上寫字……「提客勒」，就是你被稱在天平裡，顯出你的虧欠。", "page": 2, "col": 3}, {"id": 158, "icon": "🔒", "en_name": "Darius the Mede", "zh_name": "瑪代人大利烏", "en_desc": "Sent Daniel to the lions", "zh_desc": "受奸臣算計無奈將但以理下入獅子坑、整夜禁食並見證神拯救的君王", "ref": "但以理書 6:16, 26", "era": "舊約・被擄時期", "testament": "舊約", "verse": "大利烏王對但以理說：「你所常事奉的神，祂必救你。」……因為祂是永遠長存的活神，祂的國永不敗壞。", "page": 2, "col": 3}, {"id": 159, "icon": "🐉", "en_name": "Michael", "zh_name": "米迦勒", "en_desc": "Archangel; fought the dragon", "zh_desc": "護衛神子民、在天上與古蛇大龍爭戰並得勝的天使長", "ref": "但以理書 12:1; 啟示錄 12:7-8", "era": "新舊約・天上爭戰", "testament": "新舊約", "verse": "在天上就有了爭戰。米迦勒同他的使者與龍爭戰，龍也同牠的使者去爭戰，並沒有得勝。", "page": 2, "col": 3}, {"id": 160, "icon": "❤️‍🩹", "en_name": "Hosea", "zh_name": "何西阿", "en_desc": "Married Gomer as a sign", "zh_desc": "奉命迎娶不貞的歌篾，以破碎又挽回的婚姻顯明神對以色列守約不離棄的慈愛", "ref": "何西阿書 3:1; 6:1-3", "era": "舊約・分裂王國", "testament": "舊約", "verse": "來吧，我們歸向耶和華！祂撕裂我們，也必醫治；祂打傷我們，也必纏裹……我們務要認識耶和華，竭力追求認識祂。", "page": 2, "col": 3}, {"id": 161, "icon": "🍶", "en_name": "Joel", "zh_name": "約珥", "en_desc": "Foretold the Spirit poured out", "zh_desc": "呼籲撕裂心腸悔改，並預言末後神的靈要澆灌凡有血氣者的先知", "ref": "約珥書 2:13, 28", "era": "舊約・先知時期", "testament": "舊約", "verse": "你們要撕裂心腸，不撕裂衣服，歸向耶和華你們的神……以後，我要將我的靈澆灌凡有血氣的。", "page": 2, "col": 3}, {"id": 162, "icon": "🧺", "en_name": "Amos", "zh_name": "阿摩司", "en_desc": "Shepherd turned prophet", "zh_desc": "原為提哥亞牧人與修理桑樹者，蒙召北上宣告「惟願公平如大水滾滾，公義如江河滔滔」", "ref": "阿摩司書 5:24; 7:14-15", "era": "舊約・分裂王國", "testament": "舊約", "verse": "惟願公平如大水滾滾，使公義如江河滔滔！", "page": 2, "col": 3}, {"id": 163, "icon": "⛰️", "en_name": "Obadiah", "zh_name": "俄巴底亞", "en_desc": "Prophesied against Edom", "zh_desc": "斥責以東對兄弟猶大幸災樂禍、宣告耶和華日子臨近的先知", "ref": "俄巴底亞書 1:15, 21", "era": "舊約・先知時期", "testament": "舊約", "verse": "耶和華降罰的日子臨近萬國。你怎樣行，他也必照樣向你行……國度就歸耶和華了。", "page": 2, "col": 3}, {"id": 164, "icon": "🏘️", "en_name": "Micah", "zh_name": "彌迦", "en_desc": "Prophesied of Bethlehem", "zh_desc": "預言彌賽亞將降生於伯利恆，並闡明「行公義，好憐憫，存謙卑的心與神同行」", "ref": "彌迦書 5:2; 6:8", "era": "舊約・分裂王國", "testament": "舊約", "verse": "世人哪，耶和華已指示你何為善。祂向你所要的是什麼呢？只要你行公義，好憐憫，存謙卑的心，與你的神同行。", "page": 2, "col": 3}, {"id": 165, "icon": "🏚️", "en_name": "Nahum", "zh_name": "那鴻", "en_desc": "Foretold Nineveh's fall", "zh_desc": "宣告強暴之城尼尼微必遭神公義審判傾覆的安慰先知", "ref": "那鴻書 1:7", "era": "舊約・分裂王國", "testament": "舊約", "verse": "耶和華本為善，在患難的日子為人的保障，並且認得那些投靠祂的人。", "page": 2, "col": 3}, {"id": 166, "icon": "🦌", "en_name": "Habakkuk", "zh_name": "哈巴谷", "en_desc": "\"The just shall live by his faith\"", "zh_desc": "在患難困惑中登上守望樓，宣告「義人必因信得生」與無花果樹不發旺仍因神歡欣的先知", "ref": "哈巴谷書 2:4; 3:17-18", "era": "舊約・被擄前夕", "testament": "舊約", "verse": "惟義人因信得生……雖然無花果樹不發旺，葡萄樹不結果，然而我要因耶和華歡欣，因救我的神喜樂。", "page": 2, "col": 3}, {"id": 167, "icon": "📯", "en_name": "Zephaniah", "zh_name": "西番雅", "en_desc": "Warned of coming judgment", "zh_desc": "警告耶和華大日子的審判，並應許神必因愛祂的百姓歡欣喜樂且默然愛他們", "ref": "西番雅書 3:17", "era": "舊約・被擄前夕", "testament": "舊約", "verse": "耶和華你的神是施行拯救、大有能力的主。祂在你中間必因你歡欣喜樂，默然愛你，且因你喜樂而歡呼。", "page": 2, "col": 3}, {"id": 168, "icon": "🛠️", "en_name": "Haggai", "zh_name": "哈該", "en_desc": "Urged rebuilding the temple", "zh_desc": "責備百姓只顧自己天花板房屋、激勵眾人動工重建聖殿的先知", "ref": "哈該書 1:7-8; 2:9", "era": "舊約・被擄歸回", "testament": "舊約", "verse": "萬軍之耶和華如此說：「你們要省察自己的行為。你們要上山取木料，建造這殿……這殿後來的榮耀必大過先前的榮耀。」", "page": 2, "col": 3}, {"id": 169, "icon": "🪽", "en_name": "Gabriel", "zh_name": "加百列", "en_desc": "Announced Jesus' birth to Mary", "zh_desc": "侍立在神面前、向但以理解夢並向馬利亞報耶穌降生大喜信息的天使", "ref": "但以理書 8:16; 路加福音 1:19, 26-28", "era": "新舊約・救恩宣告", "testament": "新舊約", "verse": "天使回答說：「我是站在神面前的加百列，奉差而來對你說話，將這好信息報給你。」", "page": 2, "col": 3}, {"id": 170, "icon": "📋", "en_name": "Caesar Augustus", "zh_name": "凱撒奧古斯都（亞古士督）", "en_desc": "Decreed the census", "zh_desc": "下旨天下報名上冊，無意間促成約瑟與馬利亞返回伯利恆應驗彌賽亞降生預言的羅馬皇帝", "ref": "路加福音 2:1-4", "era": "新約・福音時期", "testament": "新約", "verse": "當那些日子，凱撒奧古斯都有旨意下來，叫天下人民都報名上冊……約瑟也從加利利的拿撒勒城上猶太去，到了大衛的城，名叫伯利恆。", "page": 2, "col": 3}, {"id": 171, "icon": "🐟", "en_name": "Andrew", "zh_name": "安得烈", "en_desc": "Brought Peter to Jesus", "zh_desc": "彼得肉身的兄弟、第一位跟從耶穌並立刻帶領哥哥彼得與五餅二魚孩童來到耶穌面前的使徒", "ref": "約翰福音 1:40-42; 6:8-9", "era": "新約・福音時期", "testament": "新約", "verse": "聽見約翰的話跟從耶穌的那兩個人，一個是西門彼得的兄弟安得烈。他先找著自己的哥哥西門，對他說：「我們遇見彌賽亞了。」領他去見耶穌。", "page": 2, "col": 3}, {"id": 172, "icon": "👀", "en_name": "Philip (apostle)", "zh_name": "腓力（使徒）", "en_desc": "Brought Nathanael to Jesus", "zh_desc": "來自伯賽大的使徒，對拿但業說「你來看！」領他遇見耶穌", "ref": "約翰福音 1:45-46", "era": "新約・福音時期", "testament": "新約", "verse": "腓力找著拿但業，對他說：「摩西在律法上所寫的和眾先知所記的那一位，我們遇見了，就是約瑟的兒子拿撒勒人耶穌。」腓力說：「你來看！」", "page": 2, "col": 3}, {"id": 173, "icon": "🍃", "en_name": "Nathanael", "zh_name": "拿但業（巴多羅買）", "en_desc": "Seen by Jesus under a fig tree", "zh_desc": "蒙耶穌稱讚「心裡沒有詭詐的真以色列人」、在無花果樹下被耶穌看見的使徒", "ref": "約翰福音 1:47-49", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌看見拿但業來，就指著他說：「看哪，這是個真以色列人，他心裡是沒有詭詐的！」拿但業說：「拉比，你是神的兒子，你是以色列的王！」", "page": 2, "col": 3}, {"id": 174, "icon": "🧾", "en_name": "Matthew", "zh_name": "馬太（利未）", "en_desc": "Tax collector; apostle", "zh_desc": "毅然撇下稅關跟從耶穌、撰寫馬太福音見證君王基督的使徒", "ref": "馬太福音 9:9", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌從那裡往前走，看見一個人名叫馬太，坐在稅關上，就對他說：「你跟從我來。」他就起來跟從了耶穌。", "page": 2, "col": 3}, {"id": 175, "icon": "🥾", "en_name": "James (son of Alphaeus)", "zh_name": "雅各（亞勒腓的兒子）", "en_desc": "Named among the Twelve", "zh_desc": "十二使徒之一（又稱小雅各）", "ref": "馬太福音 10:3; 使徒行傳 1:13", "era": "新約・福音時期", "testament": "新約", "verse": "腓力和巴多羅買，多馬和稅吏馬太，亞勒腓的兒子雅各，和達太。", "page": 2, "col": 3}, {"id": 176, "icon": "⚡", "en_name": "Simon the Zealot", "zh_name": "奮銳黨的西門", "en_desc": "One of the Twelve", "zh_desc": "原屬狂熱反羅馬奮銳黨、後被基督之愛感化成為十二使徒之一", "ref": "路加福音 6:15; 使徒行傳 1:13", "era": "新約・福音時期", "testament": "新約", "verse": "馬太和多馬，亞勒腓的兒子雅各和奮銳黨的西門。", "page": 2, "col": 4}, {"id": 177, "icon": "👧", "en_name": "Jairus", "zh_name": "睚魯", "en_desc": "Jesus raised his daughter", "zh_desc": "俯伏求耶穌醫治十二歲獨生女、經歷耶穌拉著女孩手說「大利大，古米」復活神蹟的會堂主管", "ref": "馬可福音 5:22-23, 41", "era": "新約・福音時期", "testament": "新約", "verse": "耶穌對管會堂的（睚魯）說：「不要怕，只要信！」就拉著孩子的手，對她說：「大利大，古米！」（閨女，我吩咐你起來！）", "page": 2, "col": 4}, {"id": 178, "icon": "💢", "en_name": "Herodias", "zh_name": "希羅底", "en_desc": "Wanted John the Baptist's head", "zh_desc": "懷恨施洗約翰指責其不法婚姻、教唆女兒在筵席上索取約翰頭顱的婦人", "ref": "馬可福音 6:19, 24", "era": "新約・福音時期", "testament": "新約", "verse": "希羅底懷恨他（施洗約翰），想要殺他……女兒就出去對她母親說：「我可以求什麼呢？」她母親說：「施洗約翰的頭。」", "page": 2, "col": 4}, {"id": 179, "icon": "🦯", "en_name": "Bartimaeus", "zh_name": "巴底買", "en_desc": "Blind beggar Jesus healed", "zh_desc": "在耶利哥路旁大聲呼求「大衛的子孫耶穌啊，可憐我吧！」立刻重見光明跟從耶穌的盲人", "ref": "馬可福音 10:46-52", "era": "新約・福音時期", "testament": "新約", "verse": "有一個討飯的瞎子，是底買的兒子巴底買，坐在路旁喊著說：「大衛的子孫耶穌啊，可憐我吧！」耶穌說：「你去吧！你的信救了你了。」他立刻看見了，就在路上跟隨耶穌。", "page": 2, "col": 4}, {"id": 180, "icon": "🧴", "en_name": "Mary of Bethany", "zh_name": "伯大尼的馬利亞", "en_desc": "Anointed Jesus' feet", "zh_desc": "坐在耶穌腳前聽道、打破玉瓶用極貴真哪噠香膏膏抹耶穌並用頭髮擦乾的馬大之妹", "ref": "路加福音 10:39, 42; 約翰福音 12:3", "era": "新約・福音時期", "testament": "新約", "verse": "馬利亞已經選擇那上好的福分，是不能奪去的……馬利亞就拿著一斤極貴的真哪噠香膏，抹耶穌的腳，又用自己的頭髮去擦，屋裡就滿了膏的香氣。", "page": 2, "col": 4}, {"id": 181, "icon": "🩹", "en_name": "Malchus", "zh_name": "馬勒古", "en_desc": "Peter cut off his ear", "zh_desc": "客西馬尼園捉拿耶穌時被彼得削掉右耳、卻蒙耶穌親手摸耳醫治的大祭司僕人", "ref": "約翰福音 18:10; 路加福音 22:51", "era": "新約・福音時期", "testament": "新約", "verse": "西門彼得帶著一把刀，就拔出來，將大祭司的僕人砍了一刀，削掉他的右耳；那僕人名叫馬勒古。耶穌就摸那人的耳朵，把他治好了。", "page": 2, "col": 4}, {"id": 182, "icon": "🔓", "en_name": "Barabbas", "zh_name": "巴拉巴", "en_desc": "Released instead of Jesus", "zh_desc": "作亂殺人的強盜，在逾越節特赦中代替無罪的耶穌被釋放（預表基督代罪）", "ref": "馬太福音 27:16, 21, 26", "era": "新約・福音時期", "testament": "新約", "verse": "巡撫對眾人說：「這兩個人，你們要我釋放哪一個給你們呢？」他們說：「巴拉巴。」於是彼拉多釋放巴拉巴給他們，把耶穌鞭打了，交給人釘十字架。", "page": 2, "col": 4}, {"id": 183, "icon": "🪵", "en_name": "Simon of Cyrene", "zh_name": "古利奈人西門", "en_desc": "Carried Jesus' cross", "zh_desc": "在往各各他路上被羅馬兵丁強逼替耶穌背負十字架的人", "ref": "路加福音 23:26; 馬可福音 15:21", "era": "新約・福音時期", "testament": "新約", "verse": "帶耶穌去的時候，有一個古利奈人西門，從鄉下來（就是亞歷山大和魯孚的父親）；他們就抓住他，把十字架擱在他身上，叫他背著跟隨耶穌。", "page": 2, "col": 4}, {"id": 184, "icon": "🫓", "en_name": "Cleopas", "zh_name": "革流巴", "en_desc": "On the road to Emmaus", "zh_desc": "復活節下午在往以馬忤斯路上與復活主同行談論聖經、心裡火熱並在擘餅時認出耶穌的門徒", "ref": "路加福音 24:18, 32", "era": "新約・福音時期", "testament": "新約", "verse": "二人中有一個名叫革流巴的……他們彼此說：「在路上，祂和我們說話，給我們講解聖經的時候，我們的心豈不是火熱的嗎？」", "page": 2, "col": 4}, {"id": 185, "icon": "🎲", "en_name": "Matthias", "zh_name": "馬提亞", "en_desc": "Took Judas Iscariot's place", "zh_desc": "升天後眾門徒禱告搖籤選出、遞補加略人猶大使徒職分的復活見證人", "ref": "使徒行傳 1:23, 26", "era": "新約・初代教會", "testament": "新約", "verse": "於是眾人為他們搖籤，搖出馬提亞來；他就和十一個使徒同列，同作耶穌復活的見證。", "page": 2, "col": 4}, {"id": 186, "icon": "🤥", "en_name": "Sapphira", "zh_name": "撒非喇", "en_desc": "Lied with her husband", "zh_desc": "與丈夫亞拿尼亞同謀私留田產價銀並欺哄聖靈、當場倒地氣絕的初代教會信徒", "ref": "使徒行傳 5:1-2, 9", "era": "新約・初代教會", "testament": "新約", "verse": "有一個人，名叫亞拿尼亞，同他的妻子撒非喇賣了田產，把價銀私自留下幾分……彼得對她說：「你們為什麼同心試探主的靈呢？」", "page": 2, "col": 4}, {"id": 187, "icon": "🎓", "en_name": "Gamaliel", "zh_name": "迦瑪列", "en_desc": "Taught Paul; urged caution", "zh_desc": "保羅年輕時的律法名師，在公會中勸諫眾人「若是出於神，你們就不能敗壞他們」的智慧法利賽教法師", "ref": "使徒行傳 5:34, 38-39; 22:3", "era": "新約・初代教會", "testament": "新約", "verse": "但有一個法利賽人，名叫迦瑪列，是眾百姓所敬重的教法師……說：「他們所謀的、所行的，若是出於人，必要敗壞；若是出於神，你們就不能敗壞他們。」", "page": 2, "col": 4}, {"id": 188, "icon": "🛞", "en_name": "Philip the Evangelist", "zh_name": "傳福音的腓利", "en_desc": "Baptized an Et function createFigureItemHTML(f) {
  const padded = String(f.id).padStart(3, '0');
  return `
    <div class="figure-item" onclick="openModal(${f.id})" title="點擊查看 ${f.zh_name} (${f.en_name}) 的代表經文：${f.ref}">
      <div class="fig-num">${f.id}</div>
      <div class="fig-icon">${f.icon}</div>
      <div class="fig-info">
        <div class="fig-name-row">
          <span class="fig-zh-name">${f.zh_name}</span>
          <span class="fig-en-name">${f.en_name}</span>
          <span class="fig-ref-tag">${f.ref.split(';')[0]}</span>
        </div>
        <div class="fig-desc-zh">${f.zh_desc}</div>
        <div class="fig-desc-en">${f.en_desc}</div>
      </div>
    </div>
  `;
}

function createPosterSheetHTML(pageNumber, pageFigures) {
  const startBase = (pageNumber - 1) * 100;
  let colsHTML = '';
  for (let c = 0; c < 4; c++) {
    const rStart = startBase + c * 25 + 1;
    const rEnd = rStart + 24;
    const colFigs = pageFigures.filter(f => f.id >= rStart && f.id <= rEnd);
    colsHTML += `
      <div class="poster-column">
        <div class="col-pill">${rStart}–${rEnd}</div>
        ${colFigs.map(createFigureItemHTML).join('')}
      </div>
    `;
  }

  return `
    <section class="poster-sheet">
      <header class="poster-header">
        <div class="leaf-deco">🌿</div>
        <div class="poster-title-wrap">
          <h1>聖經 200 位核心人物速查海報 (${startBase + 1}–${startBase + 100})</h1>
          <div class="poster-subtitle">200 Bible Figures — What They're Known For</div>
        </div>
        <div class="leaf-deco" style="transform: scaleX(-1);">🌿</div>
      </header>
      <div class="columns-grid">
        ${colsHTML}
      </div>
      <footer class="poster-footer">
        <div>每一句事蹟都是認識聖經人物的起點・點擊任一人物卡片即可展開代表經文與救贖史座標</div>
        <div class="color-squares">
          <span class="sq" style="background:#DFB14B"></span>
          <span class="sq" style="background:#142B44"></span>
          <span class="sq" style="background:#3A6B88"></span>
          <span class="sq" style="background:#5B8C5A"></span>
          <strong style="margin:0 8px;color:var(--navy);">Antigravity × dgifilms 繁體中文互動典藏版</strong>
          <span class="sq" style="background:#5B8C5A"></span>
          <span class="sq" style="background:#3A6B88"></span>
          <span class="sq" style="background:#142B44"></span>
          <span class="sq" style="background:#DFB14B"></span>
        </div>
      </footer>
    </section>
  `;
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const container = document.getElementById('posterContainer');
  const badge = document.getElementById('statsBadge');

  // 若無搜尋字詞且為預設或單頁海報模式，以經典 4 欄海報呈現
  if (!q && (currentFilter === 'all' || currentFilter === 'page1' || currentFilter === 'page2')) {
    let html = '';
    if (currentFilter === 'all' || currentFilter === 'page1') {
      html += createPosterSheetHTML(1, FIGURES.filter(f => f.page === 1));
    }
    if (currentFilter === 'all' || currentFilter === 'page2') {
      html += createPosterSheetHTML(2, FIGURES.filter(f => f.page === 2));
    }
    container.innerHTML = html;
    const count = currentFilter === 'all' ? 200 : 100;
    badge.textContent = `顯示 ${count} / 200 位人物（點擊任一人物可看經文）`;
    return;
  }

  // 搜尋或新舊約篩選模式
  const filtered = FIGURES.filter(f => {
    if (currentFilter === '舊約' && !f.testament.includes('舊約')) return false;
    if (currentFilter === '新約' && !f.testament.includes('新約')) return false;
    if (currentFilter === 'page1' && f.page !== 1) return false;
    if (currentFilter === 'page2' && f.page !== 2) return false;
    if (!q) return true;
    const hay = `${f.id} ${String(f.id).padStart(3,'0')} ${f.zh_name} ${f.en_name} ${f.zh_desc} ${f.en_desc} ${f.ref} ${f.era} ${f.verse}`.toLowerCase();
    return hay.includes(q);
  });

  badge.textContent = `篩選結果：共 ${filtered.length} / 200 位人物`;
  container.innerHTML = `
    <section class="poster-sheet">
      <header class="poster-header">
        <div class="poster-title-wrap">
          <h1>🔍 聖經人物檢索結果（共 ${filtered.length} 位）</h1>
          <div class="poster-subtitle">點擊任一人物卡片查看完整代表經文</div>
        </div>
      </header>
      <div class="search-results-grid">
        ${filtered.map(createFigureItemHTML).join('')}
      </div>
    </section>
  `;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-group .btn[data-filter]').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-filter') === f);
  });
  render();
}

function openModal(id) {
  const f = FIGURES.find(x => x.id === id);
  if (!f) return;
  currentModalId = id;
  document.getElementById('mIcon').textContent = f.icon;
  document.getElementById('mNum').textContent = `#${String(f.id).padStart(3, '0')} (第 ${f.page} 頁海報)`;
  document.getElementById('mEra').textContent = f.era;
  document.getElementById('mTitle').innerHTML = `${f.zh_name} <span>${f.en_name}</span>`;
  document.getElementById('mDescZh').textContent = f.zh_desc;
  document.getElementById('mDescEn').textContent = f.en_desc;
  document.getElementById('mRef').textContent = f.ref;
  document.getElementById('mVerse').textContent = f.verse;

  const firstRef = encodeURIComponent(f.ref.split(';')[0].trim());
  document.getElementById('mFhlLink').href = `https://bible.fhl.net/new/search.php?VERSION=unv&query=${encodeURIComponent(f.zh_name)}`;
  document.getElementById('mBgLink').href = `https://www.biblegateway.com/passage/?search=${firstRef}&version=CUVMPT;NIV`;

  document.getElementById('figureModal').classList.add('open');
}

function closeModal() {
  document.getElementById('figureModal').classList.remove('open');
}

function navModal(delta) {
  let nextId = currentModalId + delta;
  if (nextId < 1) nextId = 200;
  if (nextId > 200) nextId = 1;
  openModal(nextId);
}

function openRandomFigure() {
  const rnd = Math.floor(Math.random() * 200) + 1;
  openModal(rnd);
}

function printPoster() {
  document.getElementById('searchInput').value = '';
  setFilter('all');
  setTimeout(() => window.print(), 120);
}

document.getElementById('searchInput').addEventListener('input', render);
document.addEventListener('keydown', e => {
  if (!document.getElementById('figureModal').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') navModal(-1);
  if (e.key === 'ArrowRight') navModal(1);
});

render();
</script>
</body>
</html>
