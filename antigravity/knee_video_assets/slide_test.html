<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1920px;
  height: 1080px;
  background: radial-gradient(circle at 20% 20%, #064e3b 0%, #0f172a 50%, #020617 100%);
  color: #f8fafc;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 50px 70px;
  overflow: hidden;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.12);
  padding-bottom: 24px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: linear-gradient(135deg, #10b981, #059669);
  color: white;
  font-size: 28px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4);
}
.brand-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.brand-sub {
  font-size: 16px;
  color: #94a3b8;
  margin-top: 2px;
}
.header-badge {
  display: flex;
  align-items: center;
  gap: 12px;
}
.tag-cat {
  background: rgba(16, 185, 129, 0.2);
  color: #34d399;
  border: 1px solid rgba(16, 185, 129, 0.4);
  font-size: 18px;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 30px;
}
.tag-prog {
  background: rgba(255, 255, 255, 0.1);
  color: #e2e8f0;
  font-size: 18px;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 30px;
}
main {
  display: grid;
  grid-template-columns: 780px 1fr;
  gap: 60px;
  align-items: center;
  flex: 1;
  padding: 30px 0;
}
.card-left {
  background: #ffffff;
  border-radius: 28px;
  padding: 30px;
  height: 720px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.2);
  position: relative;
}
.badge-num {
  position: absolute;
  top: 24px;
  left: 24px;
  background: #0f172a;
  color: #34d399;
  font-size: 20px;
  font-weight: 900;
  padding: 6px 18px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.img-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 10px;
}
.img-wrap img {
  max-width: 100%;
  max-height: 520px;
  object-fit: contain;
}
.card-left-bottom {
  background: #f1f5f9;
  border-radius: 16px;
  padding: 14px 20px;
  text-align: center;
  color: #334155;
  font-size: 18px;
  font-weight: 700;
}
.info-right {
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  border-bottom: 2px solid rgba(255,255,255,0.08);
  padding-bottom: 16px;
}
.action-title {
  font-size: 50px;
  font-weight: 900;
  color: #ffffff;
  letter-spacing: -1px;
}
.freq-pill {
  background: #064e3b;
  color: #6ee7b7;
  border: 1px solid #059669;
  font-size: 18px;
  font-weight: 700;
  padding: 6px 16px;
  border-radius: 20px;
}
.mantra-box {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.08));
  border-left: 6px solid #f59e0b;
  padding: 18px 24px;
  border-radius: 0 16px 16px 0;
}
.mantra-text {
  font-size: 26px;
  font-weight: 800;
  color: #fbbf24;
}
.steps-box {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.step-item {
  display: flex;
  align-items: flex-start;
  gap: 18px;
  background: rgba(255,255,255,0.04);
  padding: 16px 20px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.06);
}
.step-num {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #10b981;
  color: white;
  font-weight: 900;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.step-text {
  font-size: 21px;
  line-height: 1.5;
  color: #e2e8f0;
}
footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(255,255,255,0.12);
  padding-top: 20px;
  font-size: 16px;
  color: #94a3b8;
}
.progress-bar-wrap {
  flex: 1;
  max-width: 400px;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  overflow: hidden;
  margin: 0 30px;
}
.progress-bar-fill {
  height: 100%;
  width: 8.3%;
  background: #10b981;
  border-radius: 4px;
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-icon">膝</div>
    <div>
      <div class="brand-title">膝蓋最喜歡的 12 個強化動作</div>
      <div class="brand-sub">零關節磨損復健與防傷手冊・把周圍肌肉練成天然護膝</div>
    </div>
  </div>
  <div class="header-badge">
    <div class="tag-cat">🦵 練大腿</div>
    <div class="tag-prog">動作 01 / 12</div>
  </div>
</header>

<main>
  <div class="card-left">
    <div class="badge-num">#01</div>
    <div class="img-wrap">
      <img src="file:///Volumes/512G/Antigravity/knee_video_assets/exercise_01.jpeg">
    </div>
    <div class="card-left-bottom">
      股四頭肌（股直肌）/ 膝關節零負擔
    </div>
  </div>

  <div class="info-right">
    <div class="title-row">
      <div class="action-title">仰躺直腿抬高</div>
      <div class="freq-pill">每邊 10~15 次，做 3 組</div>
    </div>

    <div class="mantra-box">
      <div class="mantra-text">💡 口訣：一腳彎曲，一腳伸直抬</div>
    </div>

    <div class="steps-box">

      <div class="step-item">
        <div class="step-num">1</div>
        <div class="step-text">仰躺於瑜伽墊上，一腳屈膝踩地支撐（骨盆與腰椎放鬆貼地），另一腳伸直、腳尖微往回勾。</div>
      </div>

      <div class="step-item">
        <div class="step-num">2</div>
        <div class="step-text">收緊伸直腳的大腿前側肌群，將腿平緩抬高至與對側大腿齊平（約 30~45 度）。</div>
      </div>

      <div class="step-item">
        <div class="step-num">3</div>
        <div class="step-text">在最高點保持膝蓋打直停頓 2~3 秒，緩慢降回接近地面處（不觸地），隨即做下一次。</div>
      </div>

    </div>
  </div>
</main>

<footer>
  <div>🎯 每天 10 分鐘・動態修復不磨損</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" style="width: 8.3%;"></div>
  </div>
  <div>膝關節避震修復指南</div>
</footer>
</body>
</html>
