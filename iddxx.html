      border-radius: 12px;

      align-items: center;

      font-size: 0.95rem;

    .stat-chip strong {

    }

    .search-box {

    }

    .search-box input {

      background: rgba(9, 13, 22, 0.7);

      color: #fff;
      padding: 12px 16px 12px 44px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--glow-cyan);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .view-toggle {

      border-radius: 8px;

      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;

    .view-btn.active {

      color: #fff;
    }

      align-items: center;

    }

      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);

      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 8px;

      font-size: 0.85rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 10px;
      border-radius: 999px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-indigo));
      opacity: 0;
      transition: opacity 0.25s;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-accent);
      transform: translateY(-4px);

      gap: 12px;
      margin-bottom: 12px;

      color: #fff;
      margin-bottom: 4px;

      color: var(--accent-cyan);

      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      margin-top: auto;

      width: 32px;

      border-radius: 50%;

      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;

      right: 24px;
      background: var(--accent-emerald);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 500;

      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

      padding: 60px 20px;

      .cards-list .card-desc {

      .cards-list .card-actions {

    let currentCategory = 'all';
    let currentViewMode = 'grid';

    const categories = [
      { id: 'all', name: '全部網頁', icon: '✨' },
      { id: '通訊與聯絡', name: '通訊與聯絡', icon: '📇' },
      { id: '教會與團契', name: '教會與團契', icon: '⛪' },
      { id: '通用查表與記帳', name: '通用查表與記帳', icon: '📊' },
      { id: 'General 系統模組', name: 'General 模組', icon: '🧩' },
      { id: 'Sheet 數據查詢 (sht_Gen)', name: 'Sheet 查詢 (sht_Gen)', icon: '📄' }
    ];

    function init() {
      document.getElementById('stat-total').textContent = allData.length;
      renderPills();
      renderContent();
    }

    function renderPills() {
      const container = document.getElementById('pills-container');
      container.innerHTML = categories.map(cat => {
        const count = cat.id === 'all' ? allData.length : allData.filter(i => i.category === cat.id).length;
        const activeClass = cat.id === currentCategory ? 'active' : '';
        return `<button class="pill-btn ${activeClass}" onclick="setCategory('${cat.id}')">
          <span>${cat.icon}</span> ${cat.name} <span style="opacity:0.7;">(${count})</span>
        </button>`;
      }).join('');
    }

    function setCategory(catId) {
      currentCategory = catId;
      renderPills();
      renderContent();
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      document.getElementById('btn-grid').classList.toggle('active', mode === 'grid');
      document.getElementById('btn-list').classList.toggle('active', mode === 'list');
      renderContent();
    }

    function handleSearch() {
      renderContent();
    }

    function filterData() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      return allData.filter(item => {
        const matchCategory = currentCategory === 'all' || item.category === currentCategory;
        const matchQuery = !query || 
          item.name.toLowerCase().includes(query) ||
          item.filename.toLowerCase().includes(query) ||
          item.desc.toLowerCase().includes(query) ||
          item.rel.toLowerCase().includes(query);
        return matchCategory && matchQuery;
      });
    }

    function renderContent() {
      const area = document.getElementById('content-area');
      const filtered = filterData();

      if (filtered.length === 0) {
        area.innerHTML = `
          <div class="empty-state">
            <div style="font-size:3rem; margin-bottom:12px;">🔍</div>
            <h3>未找到符合條件的網頁</h3>
            <p style="margin-top:8px;">請嘗試更換搜尋關鍵字或分類條件。</p>
          </div>
        `;
        return;
      }

      const activeCategories = currentCategory === 'all' 
        ? categories.filter(c => c.id !== 'all')
        : categories.filter(c => c.id === currentCategory);

      let html = '';

      activeCategories.forEach(cat => {
        const catItems = filtered.filter(i => i.category === cat.id);
        if (catItems.length === 0) return;

        const layoutClass = currentViewMode === 'grid' ? 'cards-grid' : 'cards-list';

        html += `
          <section class="category-section">
            <div class="category-title">
              <span>${cat.icon}</span>
              <span>${cat.name}</span>
              <span class="category-count">${catItems.length}</span>
            </div>
            <div class="${layoutClass}">
              ${catItems.map(item => createCardHTML(item)).join('')}
            </div>
          </section>
        `;
      });

      area.innerHTML = html;
    }

    function createCardHTML(item) {
      return `
        <div class="card">
          <div class="card-header">
            <div class="card-icon">${item.icon}</div>
            <div class="card-info">
              <div class="card-title">${escapeHTML(item.name)}</div>
              <div class="card-path">${escapeHTML(item.rel)}</div>
            </div>
          </div>
          <div class="card-desc">${escapeHTML(item.desc)}</div>
          <div class="card-actions">
            <a href="${item.rel}" target="_blank" class="btn-action btn-primary">
              <span>開啟頁面</span> ↗
            </a>
            <button onclick="openPreview('${item.rel}', '${escapeHTML(item.name)}')" class="btn-action btn-secondary">
              <span>預覽</span> 👁️
            </button>
            <button onclick="copyUrl('${item.full_url}')" class="btn-action btn-secondary" title="複製線上完整網址">
              <span>複製</span> 📋
            </button>
          </div>
        </div>
      `;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    function openPreview(relPath, name) {
      const modal = document.getElementById('preview-modal');
      const iframe = document.getElementById('modal-iframe-frame');
      const title = document.getElementById('modal-title-text');
      
      title.innerHTML = `👁️ 預覽網頁: <span style="color:var(--accent-cyan); margin-left:8px;">${name}</span>`;
      iframe.src = relPath;
      modal.style.display = 'flex';
    }

    function closePreview() {
      const modal = document.getElementById('preview-modal');
      const iframe = document.getElementById('modal-iframe-frame');
      modal.style.display = 'none';
      iframe.src = '';
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        showToast('已複製網址: ' + url);
      }).catch(err => {
        showToast('複製失敗');
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-msg');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closePreview();
    });

    window.onload = init;
  </script>
</body>
</html>
